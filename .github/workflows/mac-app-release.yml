name: Build macOS App Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-app:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Go (for cicy-code sidecar build)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Read cicy-code ref pin
        id: cicy_code_ref
        shell: bash
        run: |
          ref="$(cat .cicy-code-ref | tr -d '[:space:]')"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          # Enforce: ref must be a tagged release (vX.Y.Z), not a branch.
          # This guarantees a deterministic build and lets the homepage
          # display the same version it shipped with.
          if ! [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::.cicy-code-ref must be a release tag (vX.Y.Z), got: $ref"
            exit 1
          fi

      - name: Checkout cicy-code as sibling
        uses: actions/checkout@v4
        with:
          repository: cicy-ai/cicy-code
          ref: ${{ steps.cicy_code_ref.outputs.ref }}
          path: cicy-code

      - name: Build cicy-code sidecar binaries (darwin amd64 + arm64)
        # `bash build.sh all` runs prepare_embed (cicy-skills tarball, frontend,
        # ttyd assets) and cross-compiles all four darwin/linux targets.
        # We only need the two darwin slots for the Mac .app, but building
        # the linux ones here is cheap (~20s) and keeps the prepare:sidecar
        # script's "all targets at once" mode happy.
        shell: bash
        working-directory: cicy-code
        run: |
          bash build.sh all
          ls -lh dist/

      - name: Sync runtime deps to latest (cicy-code + cicy-mihomo; drop msys2)
        run: node scripts/sync-runtime-deps.cjs

      - name: Install project dependencies
        run: npm install --no-audit

      - name: Install Electron build dependencies in project directory
        run: npm install --save-dev --no-audit electron@41.0.2 electron-builder@26.7.0

      # NOTE: the homepage SPA is rebuilt automatically by the prebuild:mac npm
      # hook (scripts/build-homepage.cjs) right before `npm run build:mac` below,
      # so the dmg can never ship a stale homepage. No explicit step needed.

      - name: Prepare macOS icon
        shell: bash
        # cicy-ai.com sometimes returns 522 (origin unreachable). Don't let an
        # icon-asset hiccup kill the whole release — we fall back to the
        # default Electron icon if the fetch + convert chain fails. Build
        # step downstream checks `build/logo.icns` and conditionally passes
        # --config.mac.icon.
        continue-on-error: true
        run: |
          set +e
          mkdir -p build/icon.iconset
          if ! curl -fsSL --max-time 12 "https://cicy-ai.com/logo.svg" -o build/logo.svg; then
            echo "::warning::logo.svg fetch failed (cicy-ai.com unreachable); building with default Electron icon"
            exit 0
          fi
          magick -background none -density 1024 build/logo.svg \
            -alpha on -resize 1024x1024 PNG32:build/logo-1024.png || { echo "::warning::magick failed"; exit 0; }
          for size in 16 32 128 256 512; do
            sips -z $size $size build/logo-1024.png \
              --out "build/icon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) build/logo-1024.png \
              --out "build/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/logo.icns || { echo "::warning::iconutil failed"; exit 0; }

      - name: Build macOS app (dmg + zip, unsigned)
        # prebuild:mac (declared in package.json) chains npm run prepare:sidecar
        # which reads CICY_CODE_DIST_DIR and populates vendor/cicy-code/.
        # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from probing
        # the runner keychain for a cert it does not have; combined with
        # build.mac.identity=null in package.json this produces a clean
        # unsigned build (with the cicy-code sidecar ad-hoc signed by
        # prepare-cicy-code-sidecar.js so Apple Silicon will exec it).
        shell: bash
        env:
          CICY_CODE_DIST_DIR: ${{ github.workspace }}/cicy-code/dist
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist
          # Build BOTH arches: --arm64 (Apple Silicon) AND --x64 (Intel). The runner
          # is arm64 and electron-builder cross-builds x64, so Intel Macs get a NATIVE
          # dmg instead of being forced onto the slow `npx` electron path (the repo had
          # only arm64 dmgs, so x86_64 Macs had no installer). cicy-code sidecar is
          # already built for darwin amd64 + arm64 above.
          if [ -f build/logo.icns ]; then
            npm run build:mac -- --arm64 --x64 --config.mac.icon=build/logo.icns --publish always
          else
            echo "::warning::build/logo.icns missing — using default Electron icon"
            npm run build:mac -- --arm64 --x64 --publish always
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicy-desktop-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CiCy Desktop v${{ steps.meta.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest \
            2>/dev/null || echo "release already exists, continuing"

      - name: Publish macOS assets (dmg + zip + latest-mac.yml)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CICY_CODE_DIST_DIR: ${{ github.workspace }}/cicy-code/dist
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" dist/*.dmg dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Also upload latest-mac.yml generated by --publish always into dist/
          if ls dist/latest-mac.yml 2>/dev/null; then
            gh release upload "${{ steps.meta.outputs.tag }}" dist/latest-mac.yml \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # Lightweight app installer (~150MB): prebuilt ad-hoc-signed .app + install.command.
      # No Apple cert (installer strips quarantine + re-ad-hoc-signs locally). Docker is
      # NOT bundled — the app downloads + reuses it at runtime (keeps this small). For a
      # fully-offline install, drop the docker base disk + cicy-code image next to
      # install.command in a docker/ subdir and it'll stage them instead.
      - name: Build app installer bundles (.app + installer, no docker)
        continue-on-error: true   # extra artifact — never fail the dmg/zip release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          for ARCH in x64 arm64; do
            WANT="$([ "$ARCH" = x64 ] && echo x86_64 || echo arm64)"
            APP=""
            # NUL-delimited: the .app dir name has a space ("CiCy Desktop.app"), so a
            # `for d in $(find …)` word-splits the path and breaks. read -d '' is safe.
            while IFS= read -r -d '' d; do
              bin="$(find "$d/Contents/MacOS" -maxdepth 1 -type f | head -1)"
              if lipo -archs "$bin" 2>/dev/null | grep -qw "$WANT"; then APP="$d"; break; fi
            done < <(find dist -maxdepth 2 -type d -name "*.app" -print0)
            [ -n "$APP" ] || { echo "::warning::no $ARCH .app found, skipping"; continue; }
            echo "app installer $ARCH ← $APP"
            B="appbundle-$ARCH"; rm -rf "$B"; mkdir -p "$B"
            cp -R "$APP" "$B/CiCy Desktop.app"
            cp scripts/mac-allinone/install.command "$B/"; chmod +x "$B/install.command"
            OUT="cicy-desktop-app-$VER-$ARCH.tar.gz"
            tar -czf "$OUT" -C "$B" .
            gh release upload "${{ steps.meta.outputs.tag }}" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
            echo "uploaded $OUT ($(du -h "$OUT" | cut -f1))"

            # Native .pkg installer (right-click Open once; the postinstall ad-hoc-signs
            # + de-quarantines the installed app so it opens with no Apple cert).
            ROOT="pkgroot-$ARCH"; rm -rf "$ROOT"; mkdir -p "$ROOT/Applications"
            cp -R "$APP" "$ROOT/Applications/CiCy Desktop.app"
            SCR="pkgscripts-$ARCH"; rm -rf "$SCR"; mkdir -p "$SCR"
            cp scripts/mac-allinone/postinstall "$SCR/postinstall"; chmod +x "$SCR/postinstall"
            PKG="cicy-desktop-$VER-$ARCH.pkg"
            # Disable bundle relocation. Without this the macOS Installer "relocates" the
            # install to wherever an existing com.cicy.desktop bundle already lives (e.g. a
            # leftover copy in ~/Downloads from a tarball test) instead of /Applications —
            # so the app vanishes from /Applications. BundleIsRelocatable=false pins it to
            # the payload path (/Applications) no matter what's already on disk.
            PLIST="component-$ARCH.plist"
            pkgbuild --analyze --root "$ROOT" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" "$PLIST" 2>/dev/null \
              || plutil -replace 0.BundleIsRelocatable -bool NO "$PLIST" || true
            if pkgbuild --root "$ROOT" --component-plist "$PLIST" --scripts "$SCR" \
                 --identifier com.cicy.desktop --version "$VER" --install-location / "$PKG"; then
              gh release upload "${{ steps.meta.outputs.tag }}" "$PKG" --repo "$GITHUB_REPOSITORY" --clobber
              echo "uploaded $PKG ($(du -h "$PKG" | cut -f1))"
            else
              echo "::warning::pkgbuild failed for $ARCH (other arch unaffected)"
            fi
          done

      # Publish the .pkg installers to OSS (CN-fast). GitHub release downloads stall from
      # mainland China, so users in CN pull from OSS instead. Each arch gets a versioned key
      # plus a stable cicy-desktop-mac-<arch>-latest.pkg alias a download page can hard-link.
      # Same bucket/creds as the Windows latest.exe step.
      - name: Upload .pkg to OSS (versioned + per-arch latest alias)
        continue-on-error: true   # OSS is a convenience mirror — never fail the release
        shell: bash
        env:
          OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -uo pipefail
          VER="${{ steps.meta.outputs.version }}"
          if [ -z "${OSS_AK:-}" ] || [ -z "${OSS_SK:-}" ]; then
            echo "::warning::OSS creds missing — skipping OSS mirror"; exit 0
          fi
          curl -fsSL -o ossutil.zip "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-mac-arm64.zip"
          unzip -oq ossutil.zip
          OSS="./ossutil-v1.7.18-mac-arm64/ossutil"; chmod +x "$OSS"
          "$OSS" config -e oss-cn-shanghai.aliyuncs.com -i "$OSS_AK" -k "$OSS_SK"
          BASE="oss://cicy-1372193042-cn/releases"
          HOST="https://cicy-1372193042-cn.oss-cn-shanghai.aliyuncs.com/releases"
          for ARCH in x64 arm64; do
            PKG="cicy-desktop-$VER-$ARCH.pkg"
            [ -f "$PKG" ] || { echo "::warning::$PKG not built — skipping OSS for $ARCH"; continue; }
            "$OSS" cp "$PKG" "$BASE/$PKG" -f --acl public-read || { echo "::warning::OSS versioned upload failed $ARCH"; continue; }
            "$OSS" cp "$PKG" "$BASE/cicy-desktop-mac-$ARCH-latest.pkg" -f --acl public-read || echo "::warning::OSS latest upload failed $ARCH"
            echo "OSS $ARCH: $HOST/cicy-desktop-mac-$ARCH-latest.pkg"
          done
          printf '%s' "$VER" > mac-latest-version.txt
          "$OSS" cp mac-latest-version.txt "$BASE/mac-latest-version.txt" -f --acl public-read || true
