name: Build Windows EXE Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Sync runtime deps to latest (cicy-code + cicy-mihomo; drop msys2)
        run: node scripts/sync-runtime-deps.cjs

      - name: Install project dependencies
        run: npm install --no-audit

      - name: Install Electron build dependencies in project directory
        run: npm install --save-dev --no-audit electron@41.0.2 electron-builder@26.7.0

      - name: Prepare Windows icon
        shell: powershell
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          try {
            Invoke-WebRequest -Uri "https://cicy-ai.com/logo.svg" -OutFile "build\logo.svg" -TimeoutSec 12
          } catch {
            Write-Host "::warning::logo.svg fetch failed ($_); building with default Electron icon"
            exit 0
          }
          try {
            magick -background none -density 768 "build\logo.svg" -alpha on -resize 256x256 PNG32:"build\logo-256.png"
            magick "build\logo-256.png" -define icon:auto-resize=256,128,64,48,32,16 "build\logo.ico"
          } catch {
            Write-Host "::warning::magick convert failed ($_); skipping icon"
            exit 0
          }

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release as draft (idempotent)
        # Draft so autoUpdater doesn't pick it up before .exe + latest.yml are
        # uploaded. Promoted to non-draft + latest in the final step.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CiCy Desktop v${{ steps.meta.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft \
            2>/dev/null || echo "release already exists, continuing"

      - name: Build Windows EXE and publish assets
        # --publish always uploads .exe + latest.yml to the release created above.
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path "build\logo.ico") {
            npm run build:win -- --config.win.icon=build/logo.ico --publish always
          } else {
            Write-Host "::warning::no icon, using default"
            npm run build:win -- --publish always
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicy-desktop-windows-exe
          path: dist/*.exe
          if-no-files-found: error

      # 把最新的安装 exe 推到 OSS 的**单一固定 key**(主人:latest 只发一个)。
      # 每次发版覆盖同一个文件,永远只有一个 latest，URL 不变:
      #   https://cicy-1372193042-cn.oss-cn-shanghai.aliyuncs.com/releases/cicy-desktop-latest.exe
      - name: Upload latest EXE to OSS (single 'latest' file, overwritten)
        shell: pwsh
        env:
          OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          Invoke-WebRequest -Uri "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-windows-amd64.zip" -OutFile ossutil.zip
          Expand-Archive -LiteralPath ossutil.zip -DestinationPath ossutil-dir -Force
          $oss = "ossutil-dir\ossutil-v1.7.18-windows-amd64\ossutil.exe"
          & $oss config -e oss-cn-shanghai.aliyuncs.com -i "$env:OSS_AK" -k "$env:OSS_SK"
          $exe = Get-ChildItem dist\*.exe | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem dist\*.exe | Select-Object -First 1 }
          if (-not $exe) { Write-Error "no exe found in dist"; exit 1 }
          Write-Host "Uploading $($exe.Name) -> oss://cicy-1372193042-cn/releases/cicy-desktop-latest.exe"
          & $oss cp "$($exe.FullName)" "oss://cicy-1372193042-cn/releases/cicy-desktop-latest.exe" -f --acl public-read
          if ($LASTEXITCODE -ne 0) { Write-Error "ossutil upload failed"; exit 1 }
          Write-Host "Latest EXE: https://cicy-1372193042-cn.oss-cn-shanghai.aliyuncs.com/releases/cicy-desktop-latest.exe"

      - name: Publish release (drop draft, mark latest)
        # Only promote AFTER all assets uploaded successfully. autoUpdater on
        # existing clients will pick up the new version on its next poll.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
