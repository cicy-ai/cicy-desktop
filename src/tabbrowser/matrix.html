<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="pv" content="a2ee3f77d09b">
<title>矩阵</title>
<style>
  /* 配色与网格样式 **逐条取自老矩阵页**(git f7ba527^),不是我自己调的 */
  :root { color-scheme: dark; --bg:#0A0A0A; --cell:#141416; --head:#1a1a1c; --line:rgba(255,255,255,.08);
          --fg:#e6e6e9; --muted:#8b8b92; --accent:#3b82f6; --hover:rgba(255,255,255,.06);
          font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font-size: 13px; }

  /* 顶栏:四个 tab(全部/TG/FB/TK)+ 动作 */
  header { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
           border-bottom: 1px solid var(--line); background: var(--head); }
  .mid { flex: none; padding: 1px 7px; border-radius: 999px; background: rgba(59,130,246,.15);
         color: #7aa7ff; font: 11px ui-monospace, monospace; }
  h1 { font-size: 13px; margin: 0; font-weight: 650; }
  .tabs { display: flex; gap: 4px; }
  .tab { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 8px; cursor: pointer;
         border: 1px solid transparent; background: transparent; color: var(--muted); font: inherit; font-weight: 600; }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .n { font: 11px ui-monospace, monospace; opacity: .85; }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12px; }
  button.act { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
               color: var(--fg); cursor: pointer; font: inherit; }
  button.act:hover { background: var(--hover); }
  button.act.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.act:disabled { opacity: .5; cursor: default; }

  /* ↓↓ 以下网格/格子规则与老页一字不差 ↓↓ */
  #grid { display: flex; width: 100%; flex: 1 1 auto; min-height: 0; gap: 8px; flex-direction: row; flex-wrap: wrap;
          align-content: flex-start; overflow-x: hidden; overflow-y: auto; padding: 8px; }
  .gcell { display: flex; flex-direction: column; flex: none; width: 360px; height: 50vh; min-height: 0;
           border: 1px solid var(--line); border-radius: 14px; background: var(--cell); overflow: hidden; }
  .gcell.done { border-color: rgba(63,185,80,.6); }
  .gcell.failed { border-color: rgba(255,92,92,.6); }
  .ghead { flex: none; height: 30px; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 12px;
           border-bottom: 1px solid var(--line); background: var(--head); min-width: 0; }
  .ghead .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ghead .phone { color: #b4b4bb; font: 11px ui-monospace, monospace; white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; min-width: 0; }
  .ghead .phone[hidden] { display: none; }
  .ghead .st { margin-left: auto; }
  .gcell.done .ghead .st { color: #3fb950; font-weight: 600; }
  .gbody { flex: 1 1 auto; min-height: 0; width: 100%; background: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a40; flex: none; }
  .dot.loading { background: #f0b429; animation: pulse 1s infinite alternate; }
  .dot.ok { background: #3fb950; }
  .dot.failed { background: #ff5c5c; }
  @keyframes pulse { to { opacity: .35; } }
  .chip { flex: none; padding: 1px 6px; border-radius: 999px; background: var(--head); color: #b4b4bb;
          font: 11px ui-monospace, monospace; }
  .st { flex: none; color: var(--muted); font-size: 11px; white-space: nowrap; margin-left: auto; }
  .icon { background: transparent; color: #b4b4bb; padding: 3px 6px; font-size: 13px; border-radius: 6px;
          border: none; cursor: pointer; }
  .icon:hover { background: var(--hover); color: #fff; }
  .ghead button { flex: none; white-space: nowrap; }
  .code { background: transparent; color: #b4b4bb; padding: 2px 7px; font-size: 11px; border-radius: 6px;
          border: 1px solid var(--line); cursor: pointer; }
  .code:hover { background: var(--hover); color: #fff; }
  .code.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .code:disabled { opacity: .4; cursor: default; }
  /* ↑↑ 老页规则结束 ↑↑ */

  /* 一个网格混放多平台,不标就分不清哪格是哪个平台 */
  .chip.ty { font-weight: 700; }
  .chip.ty[hidden] { display: none; }
  .chip.ty-telegram { color: #6ab7ff; } .chip.ty-facebook { color: #7aa0ff; }
  .chip.ty-tiktok { color: #ff6b81; }  .chip.ty-tab { color: #9aa4b2; }
  /* 最大化:替代被删掉的单个大预览 */
  #grid.maxed .gcell { width: 100%; height: calc(100vh - 56px); }
  #empty { width: 100%; display: grid; place-items: center; color: var(--muted); padding: 40px; }

  /* 设置弹窗(老页 ⚙ 弹窗的等价物) */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
           justify-content: center; z-index: 50; }
  .modal[hidden] { display: none; }
  .card { width: 420px; max-width: 92vw; background: var(--cell); border: 1px solid var(--line);
          border-radius: 14px; padding: 16px 18px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; }
  .ident { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--fg);
           background: var(--head); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
           max-height: 120px; overflow: auto; }
  .lbl { font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=text] { flex: 1; min-width: 0; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line);
                          background: var(--head); color: var(--fg); font: inherit; }
  .plats { display: flex; gap: 12px; flex-wrap: wrap; }
  .plats label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .err { color: #ff5c5c; font-size: 12px; min-height: 16px; margin-top: 8px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .del { color: #ff5c5c; border-color: rgba(255,92,92,.4); }
</style>
</head>
<body>
<header>
  <span id="mid" class="mid" hidden></span>
  <h1>矩阵</h1>
  <div class="tabs" id="tabs"></div>
  <span id="status"></span>
  <span class="spacer"></span>
  <button class="act" id="reload-all" title="重新加载当前 tab 里的所有格子">全部重载</button>
  <button class="act pri" id="add-profile" title="新建一个独立会话（persist:sandbox-N）">+ 添加 Profile</button>
</header>

<div id="grid"><div id="empty">加载中…</div></div>

<div class="modal" id="cfg" hidden>
  <div class="card">
    <div class="modal-head"><span id="cfg-title">Profile 设置</span><button class="icon" id="cfg-x" title="关闭">✕</button></div>
    <div id="cfg-login">
    <label class="lbl">手机号</label>
    <div class="row"><input type="text" id="cfg-phone" placeholder="+8801700000000" spellcheck="false"></div>
    <label class="lbl">接码 URL</label>
    <div class="row"><input type="text" id="cfg-code" placeholder="https://…/getcode?id=…" spellcheck="false"><button class="act" id="cfg-code-open" title="在该 Profile 的 tab 里打开">打开</button></div>
    </div>
    <label class="lbl">代理地址</label>
    <div class="row"><input type="text" id="cfg-proxy" placeholder="留空 = 直连，例如 http://127.0.0.1:20001" spellcheck="false"><button class="act pri" id="cfg-save">保存</button></div>
    <div class="row" style="margin-top:8px"><button class="act" id="cfg-ip">测 IP</button><span id="cfg-ipinfo"></span></div>
    <div class="err" id="cfg-err"></div>
    <div class="foot"><button class="act del" id="cfg-del">删除此 Profile</button></div>
  </div>
</div>

<script>
  // 矩阵 —— 三个社媒矩阵合并成的**唯一**页面。
  //
  // 形态就一个:一个 webview 网格。没有左侧列表、没有单个预览 —— 因为这页的目的是**保活**,
  // 所有会话必须一直挂着,而不是选中谁才加载谁。
  //
  // 一个格子 = (profile × 平台)。同一个 profile 常常同时登录 telegram + facebook
  // (全车队 64 个 profile 里有 23 个),一个 profile 只挂一个平台的话,副平台账号根本不会被保活。
  // 所以 profile 带一个 types 数组,勾几个平台就开几个格子。
  //
  // 格子 id 用 `<type>-preview-<idx>` —— 和老的三个矩阵页完全一致,所以从老页切过来时
  // 主进程里已经登录着的会话会被原样接管,一个都不会掉。
  //
  // 四个 tab(全部/TG/FB/TK)只是**过滤显示**:非当前 tab 的格子仍然 sync 给主进程,
  // 只是 visible=false —— 会话继续活着,只是不占屏幕。这才是「总的网格」该有的行为。

  const TYPES = ['telegram', 'facebook', 'tiktok', 'tab'];
  const SITE = {
    telegram: { url: 'https://web.telegram.org/k/', label: 'Telegram', short: 'TG' },
    facebook: { url: 'https://www.facebook.com/',   label: 'Facebook', short: 'FB' },
    tiktok:   { url: 'https://www.tiktok.com/',     label: 'TikTok',   short: 'TK' },
    tab:      { url: 'about:blank',                 label: '标签页',   short: 'TAB' },
  };
  const TABS = [
    { id: 'all',      label: '全部' },
    { id: 'telegram', label: 'TG' },
    { id: 'facebook', label: 'FB' },
    { id: 'tiktok',   label: 'TK' },
  ];

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gridEl = document.getElementById('grid');
  const tabsEl = document.getElementById('tabs');
  const statusEl = document.getElementById('status');

  let profiles = [];
  let activeTab = (() => { try { return localStorage.getItem('matrix-tab') || 'all'; } catch (e) { return 'all'; } })();
  const cellState = new Map();     // cellKey -> { loading, failed, url, identity }
  const cells = new Map();         // cellKey -> { el, body, idx, type }
  const codeOpen = new Set();      // 开着接码 overlay 的 accountIdx(Telegram 专属)
  // 最大化:老页点格子头会切到右侧大图预览,那块被删掉后得有替代 —— 一个格子铺满整页。
  // 只是**显示**上铺满,其它格子照样 sync 给主进程(visible=false),会话继续活着,不影响保活。
  let maxed = null;                // 被最大化的 cellKey;null = 正常网格

  const key = (type, idx) => `${type}-preview-${idx}`;
  const hasId = (i) => !!(i && (i.username || i.displayName || i.phone));
  // 这个 profile 要开哪几个平台的格子。
  // 优先用显式保存的 types(新版 app 才有);**老版本 app 不返回 types,但一直返回
  // telegram/facebook/tiktok 三个身份对象** —— 直接按「哪个平台真登录着」推导,
  // 这样不用等发版,FB/TK 的号立刻就能在各自 tab 里出现。
  // (踩过:只认 types 的话,老版本上全部退回 telegram,FB tab 空了,看着像号没了。)
  const typesOf = (p) => {
    const explicit = Array.isArray(p.types) ? p.types.filter((x) => TYPES.includes(x)) : [];
    if (explicit.length) return explicit;
    const d = [];
    if (hasId(p.telegram)) d.push('telegram');
    if (hasId(p.facebook)) d.push('facebook');
    if (hasId(p.tiktok)) d.push('tiktok');
    return d.length ? d : ['telegram'];
  };
  const urlOf = (p, type) => type === 'tab' ? (String(p.tabUrl || '').trim() || 'about:blank') : SITE[type].url;
  const identityOf = (p, type) => (cellState.get(key(type, p.accountIdx)) || {}).identity || p[type] || null;
  // 和老矩阵页一致:@用户名 · 显示名 两个都显示;都没有才回退手机号。
  // (之前只取其中一个,信息比老页少了。)
  const nameOf = (it) => {
    if (!it) return '';
    const parts = [];
    if (it.username) parts.push('@' + it.username);
    if (it.displayName) parts.push(it.displayName);
    if (!parts.length && it.phone) parts.push('+' + it.phone);
    return parts.join(' · ');
  };
  // profile 名默认是 electron-N,和后面的 #N 完全重复、没有信息量。
  // 默认名就不显示了,只留编号(一眼知道是哪个 profile);自己起过名的才显示名字。
  const isDefaultName = (n) => !n || /^(electron|chrome|profile)[-_ ]?\d+$/i.test(String(n).trim());
  const displayName = (p) => isDefaultName(p.name) ? '' : String(p.name).trim();
  const ipOf = (p) => (p.ipInfo && p.ipInfo.ip) ? (p.ipInfo.ip + (p.ipInfo.area ? ' · ' + p.ipInfo.area : '')) : '';
  const phoneOf = (p) => (p.login && p.login.phone) || '';
  const codeUrlOf = (p) => (p.login && p.login.codeUrl) || '';

  // 机器 id 徽章(app 打开面板时拼在 URL 上:?team=xs-3007)
  (function () {
    try {
      const t = new URLSearchParams(location.search).get('team');
      if (t) { const el = document.getElementById('mid'); el.textContent = t; el.hidden = false; document.title = t + ' · 矩阵'; }
    } catch (e) {}
  })();

  function flash(text, ms = 2500) {
    statusEl.textContent = text;
    clearTimeout(flash.t);
    flash.t = setTimeout(() => { statusEl.textContent = summary(); }, ms);
  }
  function summary() {
    const all = allCells();
    const on = all.filter((c) => nameOf(identityOf(c.p, c.type))).length;
    return `${all.length} 个格子 · ${on} 已登录`;
  }

  // 当前应该存在的全部格子(不分 tab)—— 保活的单位
  function allCells() {
    const out = [];
    for (const p of profiles) for (const type of typesOf(p)) out.push({ p, type });
    return out;
  }
  const inTab = (c) => activeTab === 'all' || c.type === activeTab;

  // ── 渲染 ──────────────────────────────────────────────────────────────
  function renderTabs() {
    const all = allCells();
    tabsEl.innerHTML = TABS.map((t) => {
      const n = t.id === 'all' ? all.length : all.filter((c) => c.type === t.id).length;
      return `<button class="tab${activeTab === t.id ? ' on' : ''}" data-tab="${t.id}">${esc(t.label)}<span class="n">${n}</span></button>`;
    }).join('');
    for (const b of tabsEl.querySelectorAll('.tab')) {
      b.onclick = () => {
        activeTab = b.dataset.tab;
        try { localStorage.setItem('matrix-tab', activeTab); } catch (e) {}
        renderTabs(); renderGrid(); sync();
      };
    }
  }

  function buildCell(p, type) {
    const el = document.createElement('div');
    el.className = 'gcell';
    el.innerHTML =
      `<div class="ghead">
         <span class="dot"></span>
         <span class="name">${esc(p.name)}</span>
         <span class="chip">#${p.accountIdx}</span>
         <span class="phone"></span>
         <span class="st"></span>
         <button class="code" title="在格子上叠加/关闭接码 webview(同代理出口)">接码</button>
         <button class="icon reload" title="重新加载">⟳</button>
       </div>
       <div class="gbody"></div>`;
    const k = key(type, p.accountIdx);
    el.querySelector('.reload').onclick = () => { try { window.panelAPI.reload(codeOpen.has(p.accountIdx) && type === 'telegram' ? 'code-' + p.accountIdx : k); } catch (e) {} };
    // ⚙/⤢ 两个按钮已按要求去掉,格子头与老页一致。
    // 设置和最大化改挂在格子头上:单击打开设置,双击最大化 —— 不占版面。
    const kk = key(type, p.accountIdx);
    const toggleMax = () => { maxed = (maxed === kk) ? null : kk; renderGrid(); sync(); };
    el.querySelector('.ghead').onclick = (e) => { if (!e.target.closest('button')) openCfg(p, type); };
    el.querySelector('.ghead').ondblclick = (e) => { if (!e.target.closest('button')) toggleMax(); };
    const codeBtn = el.querySelector('.code');
    if (type !== 'telegram') codeBtn.remove();            // 接码是 Telegram 专属
    else {
      codeBtn.disabled = !codeUrlOf(p);
      codeBtn.onclick = () => {
        const idx = p.accountIdx;
        if (codeOpen.has(idx)) codeOpen.delete(idx);
        else { if (!codeUrlOf(p)) { flash(`#${idx} 还没有接码 URL,点 ⚙ 填写`, 4000); return; } codeOpen.add(idx); }
        renderCell(p, type); sync();
      };
    }
    return { el, body: el.querySelector('.gbody'), idx: p.accountIdx, type };
  }

  // 平台徽章只在「全部」tab 出现:那里混着多平台,不标分不清。
  // TG/FB/TK 单平台 tab 下不显示 —— 格子头就和老矩阵页一模一样。
  function renderCell(p, type) {
    const k = key(type, p.accountIdx);
    const c = cells.get(k); if (!c) return;
    const st = cellState.get(k) || {};
    const who = nameOf(identityOf(p, type));
    c.el.classList.toggle('done', !!who);
    c.el.classList.toggle('failed', !!st.failed && !st.loading);
    c.el.querySelector('.dot').className = 'dot ' + (st.loading ? 'loading' : st.failed ? 'failed' : st.url ? 'ok' : '');
    // 状态位显示**状态**,不是账号身份 —— 老页就是这样。
    // (我之前把完整身份塞这儿,FB 那串带密码的显示名直接把格子头挤爆、接码按钮被压成两行。)
    const w = c.el.querySelector('.st');
    w.textContent = who ? '✓ 已登录' : (st.loading ? '加载中…' : st.failed ? '连接失败' : '未登录');
    w.title = who || '';
    
    // 手机号:老页格子头里就有这一项(.ghead 的 .phone),位置也一样
    const ph = c.el.querySelector('.ghead .phone');
    // 手机号是 Telegram 专属:老 FB/TK 矩阵页直接 .ghead .phone{display:none!important}
    if (ph) { const v = type === 'telegram' ? phoneOf(p) : ''; ph.textContent = v ? '+' + String(v).replace(/^\+/, '') : ''; ph.hidden = !v; }
    const cb = c.el.querySelector('.code');
    if (cb) { cb.classList.toggle('on', codeOpen.has(p.accountIdx)); cb.textContent = codeOpen.has(p.accountIdx) ? '关闭接码' : '接码'; cb.disabled = !codeUrlOf(p); }
  }

  function renderGrid() {
    // 最大化:只铺这一格(它必须还在当前 tab 的集合里,否则自动退出最大化)
    const all = allCells();
    if (maxed && !all.some(({ p, type }) => key(type, p.accountIdx) === maxed)) maxed = null;
    const want = maxed
      ? all.filter(({ p, type }) => key(type, p.accountIdx) === maxed)
      : all.filter(inTab);
    gridEl.classList.toggle('maxed', !!maxed);
    gridEl.innerHTML = '';
    if (!want.length) {
      gridEl.innerHTML = `<div id="empty">${profiles.length ? '这个 tab 下没有格子 —— 在某个 Profile 的 ⚙ 里勾上这个平台' : '还没有 Profile,点右上角「+ 添加 Profile」'}</div>`;
      statusEl.textContent = summary(); return;
    }
    for (const { p, type } of want) {
      const k = key(type, p.accountIdx);
      let c = cells.get(k);
      if (!c) { c = buildCell(p, type); cells.set(k, c); }
      gridEl.appendChild(c.el);
      renderCell(p, type);
    }
    // 清掉已经不该存在的格子(profile 删了 / 平台取消勾选)
    const live = new Set(allCells().map(({ p, type }) => key(type, p.accountIdx)));
    for (const k of [...cells.keys()]) if (!live.has(k)) cells.delete(k);
    statusEl.textContent = summary();
  }

  // ── 把格子位置同步给主进程(BrowserView 贴在这些矩形上)────────────────
  function sync() {
    if (!window.panelAPI) return;
    const box = (r) => ({ x: r.x, y: r.y, w: r.width, h: r.height });
    const list = [], overlays = [];
    for (const { p, type } of allCells()) {
      const k = key(type, p.accountIdx);
      const c = cells.get(k);
      // 非当前 tab 的格子:visible=false —— 会话继续活着(保活),只是不贴到屏幕上
      const visible = !!c && !!c.el.isConnected && (maxed ? key(type, p.accountIdx) === maxed : inTab({ p, type }));
      list.push({ id: k, url: urlOf(p, type), profile: p.accountIdx, visible, rect: visible ? box(c.body.getBoundingClientRect()) : null });
      if (visible && type === 'telegram' && codeOpen.has(p.accountIdx)) {
        const cu = codeUrlOf(p);
        if (cu) overlays.push({ id: 'code-' + p.accountIdx, url: cu, profile: p.accountIdx, visible: true, rect: box(c.body.getBoundingClientRect()) });
      }
    }
    try { window.panelAPI.sync(list.concat(overlays)); } catch (e) {}
  }

  // ── 设置弹窗 ──────────────────────────────────────────────────────────
  let cfgP = null;
  const $ = (id) => document.getElementById(id);
  const CAN_SET_TYPES = !!(window.panelAPI && window.panelAPI.setProfileTypes);
  function openCfg(p, type) {
    cfgP = p;
    // 手机号/接码是 Telegram 专属 —— 老 FB/TK 页用 #cfg-login{display:none} 把这块藏了
    $('cfg-login').hidden = (type !== 'telegram');
    $('cfg-title').textContent = `${p.name} · #${p.accountIdx} 设置`;
    $('cfg-phone').value = phoneOf(p); $('cfg-code').value = codeUrlOf(p);
    $('cfg-proxy').value = p.proxy || '';
    $('cfg-ipinfo').textContent = ipOf(p);
    $('cfg-err').textContent = '';
    $('cfg').hidden = false;
    try { window.panelAPI.dragging(true); } catch (e) {}
  }
  function closeCfg() { $('cfg').hidden = true; cfgP = null; try { window.panelAPI.dragging(false); } catch (e) {} sync(); }
  $('cfg-x').onclick = closeCfg;
  $('cfg').onclick = (e) => { if (e.target === $('cfg')) closeCfg(); };
  $('cfg-ip').onclick = async () => {
    if (!cfgP) return; $('cfg-ipinfo').textContent = '探测中…';
    try { const r = await window.panelAPI.probeIp(cfgP.accountIdx); $('cfg-ipinfo').textContent = r && r.ip ? `${r.ip}${r.area ? ' · ' + r.area : ''}` : '探测失败'; }
    catch (e) { $('cfg-ipinfo').textContent = '探测失败: ' + e.message; }
  };
  $('cfg-save').onclick = async () => {
    if (!cfgP) return;
    const b = $('cfg-save'); b.disabled = true; $('cfg-err').textContent = '';
    try {
      const lg = await window.panelAPI.setProfileLogin(cfgP.accountIdx, $('cfg-phone').value.trim(), $('cfg-code').value.trim());
      cfgP.login = lg.login;
      const u = await window.panelAPI.setProfileProxy(cfgP.accountIdx, $('cfg-proxy').value.trim());
      cfgP.proxy = u.proxy; cfgP.ipInfo = null;
      const idx = cfgP.accountIdx;
      closeCfg(); renderGrid(); sync();
      flash(`#${idx} 已保存`);
    } catch (e) { $('cfg-err').textContent = e.message || String(e); }
    finally { b.disabled = false; }
  };
  // 老页有这个:在该 Profile 的 tab 里打开接码 URL
  $('cfg-code-open').onclick = async () => {
    if (!cfgP) return;
    const u = $('cfg-code').value.trim(); if (!u) return;
    try { await window.panelAPI.openCodeUrl(cfgP.accountIdx, u); } catch (e) { $('cfg-err').textContent = e.message; }
  };
  $('cfg-del').onclick = async () => {
    if (!cfgP) return;
    const b = $('cfg-del');
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '再点一次确认删除'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '删除此 Profile'; }, 4000); return; }
    const idx = cfgP.accountIdx;
    try { await window.panelAPI.removeProfile(idx); } catch (e) { $('cfg-err').textContent = e.message; return; }
    b.dataset.armed = ''; b.textContent = '删除此 Profile';
    closeCfg(); await load(); flash(`Profile #${idx} 已删除`);
  };

  // ── 顶栏动作 ──────────────────────────────────────────────────────────
  document.getElementById('reload-all').onclick = () => {
    for (const { p, type } of allCells().filter(inTab)) { try { window.panelAPI.reload(key(type, p.accountIdx)); } catch (e) {} }
    flash('已重载当前 tab 的全部格子');
  };
  document.getElementById('add-profile').onclick = async () => {
    const b = document.getElementById('add-profile'); b.disabled = true;
    try { await window.panelAPI.addProfile(); await load(); flash('已添加 Profile,点 ⚙ 选平台'); }
    catch (e) { flash('添加失败: ' + e.message, 5000); }
    finally { b.disabled = false; }
  };

  // ── 数据 ──────────────────────────────────────────────────────────────
  async function load() {
    try { profiles = (await window.panelAPI.profiles()) || []; } catch (e) { profiles = []; }
    renderTabs(); renderGrid(); sync();
  }

  // 主进程回报每个格子的加载状态/身份
  try {
    window.panelAPI.onCellState((st) => {
      if (!st || !st.id) return;
      const prev = cellState.get(st.id) || {};
      cellState.set(st.id, { ...prev, ...st });
      const m = /^(telegram|facebook|tiktok|tab)-preview-(\d+)$/.exec(st.id);
      if (!m) return;
      const p = profiles.find((x) => x.accountIdx === Number(m[2]));
      if (p) { renderCell(p, m[1]); statusEl.textContent = summary(); }
    });
  } catch (e) {}

  // 已经活着的格子:面板刷新后本页状态是空的,但主进程里那些会话还在 —— 认领回来,
  // 顺带兼容老的三个矩阵页留下的同名格子(id 规则完全一致)。
  (async () => {
    try {
      const sts = (await window.panelAPI.states()) || [];
      for (const st of sts) if (st && st.id) cellState.set(st.id, st);
    } catch (e) {}
    await load();
  })();

  // 页面自动更新:构建时给本页打了内容版本号(<meta name="pv">)。每 60s 拉一次自身,
  // 版本变了就重载。**重写这页时我把这段弄丢了**,结果新版发出去机器却一直停在旧页
  // (实测:16 台还跑着只认 types 的旧版,FB tab 全空,看着像账号没了)。
  (function () {
    const meta = document.querySelector('meta[name="pv"]');
    const PV = meta ? meta.content : '';
    if (!PV) return;
    setInterval(async () => {
      try {
        const r = await fetch(location.href, { cache: 'no-store' });
        if (!r.ok) return;
        const t = await r.text();
        const mm = t.match(/<meta name="pv" content="([^"]*)">/);
        if (mm && mm[1] && mm[1] !== PV) location.reload();
      } catch (e) {}
    }, 60000);
  })();

  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && maxed && document.getElementById('cfg').hidden) { maxed = null; renderGrid(); sync(); }
  });
  addEventListener('resize', sync);
  gridEl.addEventListener('scroll', sync, { passive: true });
  setInterval(sync, 1500);       // 布局变化(格子增删/滚动惯性)后把矩形对齐
  setInterval(load, 30000);      // 定期回读 profile(别处改了代理/登录也能跟上)
</script>
</body>
</html>
