<!doctype html>
<meta charset="utf-8">
<title>矩阵</title>
<!--
  facebook 矩阵已并入统一矩阵(matrix.html)。
  三个平台页原来 92% 是重复代码,只差站点 URL 和文案;现在一个 profile 带一个 type
  (telegram/facebook/tiktok/tab),同一个网格按 type 决定每格加载什么,便于统一保活。
  这里保留成跳转壳:机器上已配置的 panel_url 指着老地址,不用逐台改就会汇到合并页。
  查询参数(如 ?team=xs-3007)原样带过去。
-->
<body style="margin:0;background:#0b0f14;color:#9aa4b2;font:13px system-ui,-apple-system,sans-serif">
<div style="padding:16px">正在转到统一矩阵…</div>
<script>
  try {
    var q = location.search || '';
    location.replace('matrix.html' + q + location.hash);
  } catch (e) { location.href = 'matrix.html'; }
</script>
</body>
