      card.style.top = Math.round(r.top + (r.height - h) / 2) + 'px';
    }
    // ── 自动登录 ─────────────────────────────────────────
    // 手机号 → 短信码 → 2FA,全在面板里驱动格子的 webview。
    // 验证码和 2FA 密码都从接码页读:那页就是格子里的叠加 webview,直接读它的 DOM ——
    // 比走接码的 HTTP 接口稳,那边有 1 次/分钟限流,还会回缓存的空值。
    const loginBusy = new Set();
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    function tgView(idx) {
      const g = gcells.get(idx); if (!g) return null;
      for (const w of g.el.querySelectorAll('webview')) {
        if (/web\.telegram\.org/.test(w.getAttribute('src') || '')) return w;
      }
      return null;
    }
    function codeView(idx) {
      const g = gcells.get(idx); if (!g) return null;
      for (const w of g.el.querySelectorAll('webview')) {
        if (/jiema|getcode/.test(w.getAttribute('src') || '')) return w;
      }
      return null;
    }
    async function typeInto(wv, text, gap) {
      for (const ch of String(text)) {
        wv.sendInputEvent({ type: 'char', keyCode: ch });
        await sleep(gap || 45);
      }
    }
    function phoneFieldJs(expr) {
      return "(function(){var r=document.getElementById('auth-flow-root');if(!r)return null;var e=r.querySelectorAll('[contenteditable]')[1];if(!e)return null;" + expr + "})()";
    }
    // 号码框里国家码是跟着内容走的:清不干净,新号会直接拼在旧国家码后面
    // (实测 +86 + 15155315482 = +8615155315482,后 8 位还一样,只比尾号根本看不出来)。
    // 所以这里清完必须读回来确认是空的,清不掉就一直退格,而不是盲目往下走。
    async function clearPhoneField(wv) {
      for (let t = 0; t < 6; t++) {
        await evalT(wv, phoneFieldJs("e.focus();var s=window.getSelection();var g=document.createRange();g.selectNodeContents(e);s.removeAllRanges();s.addRange(g);return 1"));
        for (let i = 0; i < 25; i++) { wv.sendInputEvent({ type: 'keyDown', keyCode: 'Backspace' }); wv.sendInputEvent({ type: 'keyUp', keyCode: 'Backspace' }); }
        await sleep(350);
        const v = await evalT(wv, phoneFieldJs("return (e.textContent||'')"));
        const left = String(v || '').replace(/\D/g, '');
        if (!left) return String(v || '');
      }
      return null;
    }

    // 打开接码浮层读一次三个字段,再关掉(叠着会盖住 Telegram)
    async function readCodePage(idx) {
      const g = gcells.get(idx); if (!g) return null;
      const btn = g.el.querySelector('.code'); if (!btn) return null;
      // 刚打开的浮层本身就是一次全新请求,不用再刷一遍 —— 接码站大约一分钟只放一次,
      // 「打开 + 强刷」等于连发两次,第二次必然是「请求过于频繁」,永远读不到码。
      const wasOpen = codeOpen.has(idx);
      if (!wasOpen) { btn.click(); await sleep(5000); }
      const cv = codeView(idx);
      let out = null;
      if (cv) {
        try {
          // 只有浮层本来就开着(页面可能是分区缓存里的旧「设备已掉线」)才强制刷新
          if (wasOpen) {
            try { await cv.executeJavaScript("(function(){var u=location.href.replace(/([?&])_ts=\\d+/,'$1_ts='+Date.now());if(u===location.href)u+=(u.indexOf('?')<0?'?':'&')+'_ts='+Date.now();location.replace(u);return 1})()"); } catch (e) {}
            await sleep(2600);
          }
          // 限流页也是「错误」页,不能当成死卡直接放弃
          const s = await cv.executeJavaScript("(function(){var v=[].slice.call(document.querySelectorAll('input,textarea')).map(function(e){return e.value||''});var t=document.body.innerText||'';var rate=/请求过于频繁|等待\\s*\\d+\\s*秒/.test(t);return JSON.stringify({code:v[0]||'',time:v[1]||'',twofa:v[2]||'',rate:rate,dead:!rate&&/接码设备已掉线|已冻结|已封禁|自助补号|账号不存在|卡密(错误|无效|不存在)|404 Not Found|410 Gone/.test(t)})})()");
          out = JSON.parse(s);
        } catch (e) {}
      }
      if (codeOpen.has(idx)) { btn.click(); await sleep(1000); }
      return out;
    }
    // 登录做成状态机:每 2 秒看一眼页面在哪一屏,就只做那一屏该做的一件事。
    // 不用线性脚本 —— 那种写法里任何一步的固定等待落空,后面全部错位,就"卡住"了。
    // 这里每一轮都重新判断,某个动作没生效下一轮自己重做;单次调用全部带超时;
    // 整体有总时限。结构上不存在卡死:要么成功,要么超时并说清停在哪一屏。
    const LOGIN_DEADLINE = 6 * 60 * 1000;
    const loginSay = new Map();   // idx -> 当前这一步的文字(格子重绘时补回去)

    // 一次 executeJavaScript 也可能悬着不返回(页面卡住时),统一加超时兜底
    function evalT(wv, expr, ms) {
      return Promise.race([
        wv.executeJavaScript(expr).catch(() => null),
        new Promise((r) => setTimeout(() => r(null), ms || 6000)),
      ]);
    }
    async function screenOf(wv) {
      const s = await evalT(wv, "(function(){" +
        "var id='';try{id=String(JSON.parse(localStorage.getItem('user_auth')||'{}').id||'')}catch(e){}" +
        "if(id)return JSON.stringify({s:'done',id:id});" +
        "var r=document.getElementById('auth-flow-root');" +
        "if(!r)return JSON.stringify({s:'loading'});" +
        "var t=r.innerText||'';" +
        "if(/Incorrect password/i.test(t))return JSON.stringify({s:'2fa',err:'pw'});" +
        "if(/Enter Your Password|additional password/i.test(t))return JSON.stringify({s:'2fa'});" +
        "if(/Invalid code|INVALID/i.test(t))return JSON.stringify({s:'code',err:'code'});" +
        "if(/sent you a (message|code)|We have sent/i.test(t))return JSON.stringify({s:'code',ph:((t.match(/\\+[\\d\\s\\-()]{6,}/)||[''])[0]).replace(/\\s+/g,' ').trim()});" +
        "var ce=r.querySelectorAll('[contenteditable]');" +
        "if(ce.length>1)return JSON.stringify({s:'phone',val:(ce[1].textContent||'').replace(/\\s+/g,'')});" +
        "if(/Log in by QR|Scan with Telegram/i.test(t))return JSON.stringify({s:'qr'});" +
        "return JSON.stringify({s:'unknown',t:t.slice(0,40)});})()", 6000);
      try { return JSON.parse(s); } catch (e) { return { s: 'unreadable' }; }
    }
    async function autoLogin(idx) {
      if (loginBusy.has(idx)) { flash('#' + idx + ' 正在登录中'); return; }
      const p = profiles.find((x) => x.accountIdx === idx);
      const phone = p && phoneOf(p);
      if (!phone) { flash('#' + idx + ' 没有手机号'); return; }
      loginBusy.add(idx);
      // 翻到这一格所在的页(它可能在别的分页/别的 tab 上,那样根本没有 webview)
      try { gotoIdx(idx); } catch (e) {}
      // 每一步都写到格子头部的状态位,界面上能直接看到走到哪了(不用开设置弹窗)
      // 进度只写格子头部的状态位 —— 写进弹窗按钮会把「提交手机号…」这种长文字塞进小按钮,
      // 把整个弹窗撑歪;而且弹窗点完就关了,写了也看不见。
      const say = (t) => {
        loginSay.set(idx, t);
        if (listMode()) refreshRow(idx);
        const g = gcells.get(idx);
        if (g) { const st = g.el.querySelector('.ghead .st'); if (st) { st.textContent = t; st.style.color = '#f0a45a'; } }
      };
      const want = phone.replace(/\s+/g, '');
      const wantD = want.replace(/\D/g, '');
      const t0 = Date.now();
      say('准备中…');
      for (let i = 0; i < 40 && !tgView(idx); i++) await sleep(500);
      if (!tgView(idx)) { say('格子打不开'); loginBusy.delete(idx); return; }
      let baseCode = '', baseTime = '', code = '', twofa = '', baseRead = false, submitAt = 0;
      let lastAct = {}, screen = '', nextCodeAt = 0, gone = 0;
      // 同一个动作 N 秒内不重复做(点了按钮要给页面反应时间),但绝不无限等
      const cool = (k, ms) => { const now = Date.now(); if (now - (lastAct[k] || 0) < ms) return false; lastAct[k] = now; return true; };
      try {
        while (Date.now() - t0 < LOGIN_DEADLINE) {
          const wv = tgView(idx);
          // 重载那一下 webview 会被换掉,tgView 有几秒是 null —— 不能就此收摊。
          // 等它回来,连续 60 秒都没有才算真的打不开。
          if (!wv) {
            if (!gone) gone = Date.now();
            if (Date.now() - gone > 60000) { say('格子打不开'); return; }
            say('等格子加载…'); await sleep(1500); continue;
          }
          gone = 0;
          // 单轮探测失败不能让整个登录收摊:格子刚重载时 webview 还没挂回 DOM,
          // executeJavaScript 会抛 "The WebView must be attached to the DOM" ——
          // 那只是还没就绪,等两秒重来就好,原来它会一路冒到外层 catch 把登录直接结束掉。
          let st;
          try { st = await screenOf(wv); }
          catch (e1) { say('页面还没就绪,等一下…'); await sleep(2000); continue; }
          screen = st.s;

          if (st.s === 'done') { say('登录成功 id=' + st.id);
            setTimeout(() => { loginSay.delete(idx); renderGridCell(idx); if (listMode()) refreshRow(idx); }, 4000); 
            setTimeout(() => { const q = profiles.find((x) => x.accountIdx === idx);
              if (q && cfgP && cfgP.accountIdx === idx) document.getElementById('cfg-info').innerHTML = cfgInfoHtml(q); }, 1500);
            return; }

          if (st.s === 'qr') {
            if (cool('toPhone', 4000)) { say('切手机号登录…');
              await evalT(wv, "(function(){var b=[].slice.call(document.querySelectorAll('button')).filter(function(e){return e.getClientRects().length&&/log in by phone/i.test(e.textContent||'')})[0];if(b){b.click();return 1}return 0})()"); }
          } else if (st.s === 'phone') {
            const cur = String(st.val || '').replace(/\D/g, '');
            if (cur !== wantD) {
              if (cool('typePhone', 6000)) { say('填手机号…');
                const rest = await clearPhoneField(wv);
                if (rest === null) { say('号码框清不掉,重载这一格…'); try { wv.reload(); } catch (e) {} await sleep(5000); continue; }
                // 框里通常会留一个 "+",再打一个就成了 "++",所以留着 + 就只打数字
                await typeInto(wv, rest.indexOf('+') >= 0 ? want.replace(/^\+/, '') : want, 45);
                await sleep(400);
                const after = String(await evalT(wv, phoneFieldJs("return (e.textContent||'')")) || '').replace(/\D/g, '');
                if (after !== wantD) { say('号码填歪了(' + after + '),重填…'); continue; }
              }
            } else if (cool('submitPhone', 8000)) { say('提交手机号…');
              // 这一句返回 1 = 真的找到 Next 并点下去了,返回 0 = 根本没找到按钮。
              // 必须看这个返回值:点不到 Next 就绝不往下走,更不许开接码。
              // 判可见用 getClientRects().length,不用 offsetParent —— 登录页容器是
              // position:fixed,那种情况下 offsetParent 恒为 null,看得见的按钮也会被筛掉。
              const clicked = await evalT(wv, "(function(){var r=document.getElementById('auth-flow-root');var b=[].slice.call(r.querySelectorAll('button')).filter(function(e){return e.getClientRects().length&&/^next$/i.test((e.textContent||'').trim())})[0];if(b){b.click();return 1}return 0})()");
              if (Number(clicked) !== 1) { say('没找到「下一步」按钮,重试…'); await sleep(2000); continue; }
              // 点完「下一步」等 5 秒,再开接码读基线。这几行必须在**这个分支里面** ——
              // 上面那条 evalT 原本自带收尾的 "}",写在它后面就落到了「手机号屏」这一支上,
              // 变成填完号当场执行,下一步反而是下一轮才点,看着就是"号填完就弹接码"。
              await sleep(5000);
              submitAt = Date.now();
              if (!baseRead) { baseRead = true; say('读接码基线…');
                const base = await readCodePage(idx);
                if (base && base.dead) { say('接码卡已失效'); return; }
                if (base && base.rate) { nextCodeAt = Date.now() + 40000; }
                baseCode = (base && base.code) || ''; baseTime = (base && base.time) || ''; }
              continue; }
          } else if (st.s === 'code') {
            // 验证码屏会把刚才提交的号码显示出来 —— 对不上说明提交的是别人的号,
            // 再等下去也等不到码,必须退回去重填,而不是一直"等验证码…"。
            const shown = String(st.ph || '').replace(/\D/g, '');
            if (shown && shown !== wantD) {
              if (cool('backToPhone', 15000)) { say('提交的号不对(' + st.ph + '),退回重填…');
                // 重载没用:Telegram 会把验证码那一屏恢复回来。改号入口是点验证码屏上的号码本身。
                await evalT(wv, "(function(){var w=document.querySelector('[class*=phoneWrapper]');if(!w)return 0;(w.querySelector('span,i,svg,button')||w).click();return 1})()"); }
              await sleep(4000); continue;
            }
            if (!code || st.err === 'code') {
              // 接码站大约每分钟只让读一次,读太勤只会一直拿到"请求过于频繁",
              // 表现就是永远停在"等验证码"。撞到限流就退避,别把配额全浪费在重试上。
              if (submitAt && Date.now() >= nextCodeAt && cool('readCode', 12000)) { say('等验证码…');
                const c = await readCodePage(idx);
                // 第一次读到的就是基线:页面已经翻到验证码屏 = 「下一步」确实点成了,
                // 此刻页面上那个码必定是上一轮的残码,之后只认比它新的。
                if (!baseRead) { baseRead = true;
                  baseCode = (c && c.code) || ''; baseTime = (c && c.time) || ''; }
                if (c && c.rate) { nextCodeAt = Date.now() + 40000; say('接码限流,40 秒后再读…'); }
                else if (c && c.dead) { say('接码卡已失效'); return; }
                else if (c && c.code && c.code !== baseCode && (!baseTime || c.time > baseTime)) { code = c.code; twofa = c.twofa || twofa; }
                else if (baseCode && submitAt && Date.now() - submitAt > 75000) {
                  // 这个码是提交后第一次读到的,很可能就是刚到的那条,只是被当成了基线
                  say('没有更新的码,用刚才那个 ' + baseCode); code = baseCode; twofa = (c && c.twofa) || twofa; }
                else { nextCodeAt = Date.now() + 15000; } }
            }
            if (code && cool('typeCode', 12000)) { say('填验证码 ' + code + '…');
              await evalT(wv, "(function(){var r=document.getElementById('auth-flow-root');var ins=[].slice.call(r.querySelectorAll('input')).filter(function(e){return e.getClientRects().length&&!/stealthy/.test(e.className)});if(!ins[0])return 0;ins[0].focus();ins[0].value='';return 1})()");
              await typeInto(wv, code, 150); }
          } else if (st.s === '2fa') {
            if (!twofa && Date.now() >= nextCodeAt && cool('read2fa', 12000)) { say('读 2FA 密码…');
              const c2 = await readCodePage(idx);
              if (c2 && c2.rate) { nextCodeAt = Date.now() + 40000; say('接码限流,40 秒后再读…'); }
              else twofa = (c2 && c2.twofa) || ''; }
            if (!twofa) { if (Date.now() < nextCodeAt) { await sleep(2000); continue; } say('需要 2FA 但接码页没有密码'); return; }
            if (cool('type2fa', 14000)) { say(st.err === 'pw' ? '2FA 重填…' : '填 2FA…');
              // 诱饵框是 .stealthy;不清空会把上次内容拼上去(didididi),报 Incorrect password
              await evalT(wv, "(function(){var r=document.getElementById('auth-flow-root');var e=[].slice.call(r.querySelectorAll('input.input-field-input')).filter(function(x){return !/stealthy/.test(x.className)})[0];if(!e)return 0;e.focus();e.select&&e.select();return 1})()");
              for (let i = 0; i < 40; i++) { wv.sendInputEvent({ type: 'keyDown', keyCode: 'Backspace' }); wv.sendInputEvent({ type: 'keyUp', keyCode: 'Backspace' }); }
              await sleep(300);
              await typeInto(wv, twofa, 110);
              await sleep(400);
              // 输完立刻提交:2FA 页靠按钮,Enter 不一定触发
              await evalT(wv, "(function(){var r=document.getElementById('auth-flow-root');var bs=[].slice.call(r.querySelectorAll('button')).filter(function(e){return e.getClientRects().length&&(e.textContent||'').trim()});var b=bs[bs.length-1];if(b){b.click();return 1}return 0})()"); }
          } else if (st.s === 'loading' || st.s === 'unreadable') {
            if (cool('nudge', 45000)) { say('页面没响应,重载这一格…'); try { wv.reload(); } catch (e) {} }
          }
          await sleep(2000);
        }
        say('超时(停在 ' + screen + ')');
      } catch (e) { say('出错[' + screen + ']:' + String(e.message).slice(0, 40)); }
      finally { loginBusy.delete(idx); }
    }

    document.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('.cfg-login');
      if (!b) return;
      e.preventDefault(); e.stopPropagation();

      // 不重载的话,格子停在哪一屏就从哪一屏接着跑 —— 卡在半截的那些状态永远自己滚不回去。
      try { closeMode(idx); } catch (err) {}
      try { reloadProfile(idx); } catch (err) {}

      autoLogin(idx);
    });

    window.addEventListener('resize', syncPreview);
    document.addEventListener('visibilitychange', () => { if (document.hidden) { syncPreview(); return; } if (!document.hidden) { syncPreview(); setTimeout(syncPreview, 500); setTimeout(pullStates, 800); } });
    try { window.panelAPI.onCellState(applyCellState); } catch (e) {}
    pullStates({ adopt: true })
      .catch(() => {})
      .then(() => loadProfiles())
      // 打开面板即默认进批量网格:把所有 profile 的 webview 平铺出来。
      // 崩溃循环保护:若上次开机自动批量后没在几秒内清除标记(说明渲染进程崩溃重载了),
      // 这次跳过自动批量、停在列表,避免弱机反复「崩溃→自动批量→再崩」的刷新循环。
      .then(() => {
        try {
          const K = 'tg-matrix-autobatch-pending';
          let prev = null; try { prev = localStorage.getItem(K); } catch (e) {}
          if (prev && (Date.now() - Number(prev)) < 20000) {
            try { localStorage.removeItem(K); } catch (e) {}
            flash('上次疑似导致崩溃,已跳过自动平铺。点「全部重载」可手动平铺。', 6000);
            return;
          }
          try { localStorage.setItem(K, String(Date.now())); } catch (e) {}
          enterBatch();
          setTimeout(() => { try { localStorage.removeItem(K); } catch (e) {} }, 8000);
        } catch (e) {}
      })
      .catch((e) => { flash(e.message || String(e), 8000); render(); });

    // 自动更新:构建时给本页打了内容版本号(<meta name="pv">)。每 60s 拉一次自身
    // (同源 cicyui://panel,无跨域;cicyui handler 每次都从远端取最新),版本变了就 reload。
    // 这样服务端一部署,所有开着的面板自己就切到新版,不用手动逐台重载。DEV 态不轮询。
    (function autoUpdate() {
      const meta = document.querySelector('meta[name="pv"]');
      const PV = meta ? meta.content : '';
      if (!PV || PV === 'DEV') return;
      setInterval(async () => {
        try {
          const r = await fetch(location.href, { cache: 'no-store' });
          if (!r.ok) return;
          const t = await r.text();
          const mm = t.match(/<meta name="pv" content="([^"]*)">/);
          if (mm && mm[1] && mm[1] !== PV) location.reload();
        } catch (e) {}
      }, 60000);
    })();
  </script>
</body>
</html>
