<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="pv" content="ef701cefe8ea">
  <title>Telegram 矩阵</title>
  <style>
    :root { color-scheme: dark; --bg:#0A0A0A; --cell:#141416; --head:#1a1a1c; --line:rgba(255,255,255,.08); --fg:#e6e6e9; --muted:#8b8b92; --accent:#3b82f6; --hover:rgba(255,255,255,.06); font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
    /* 行高必须锁死在视口:只写 grid-template-columns 时隐式行按内容撑高,
       main 跟着长 → #grid 的 flex:1 永远不需要滚,内容直接被 body 的
       overflow:hidden 裁掉(格子一多就看不见后面的,还以为是没渲染)。 */
    body { display: grid; grid-template-columns: minmax(320px, 34%) 1fr; grid-template-rows: 100%; }
    aside { min-width: 0; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; }
    header { flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
    h1 small { color: var(--muted); font-weight: 500; font-size: 12px; }
    button { border: 0; border-radius: 8px; padding: 7px 12px; color: white; background: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; line-height: 1.2; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: wait; }
    button.ghost { background: var(--head); color: var(--fg); border: 1px solid var(--line); }
    button.sm { padding: 4px 8px; font-size: 12px; }
    .icon { background: transparent; color: #b4b4bb; padding: 3px 6px; font-size: 13px; border-radius: 6px; }
    .icon:hover { background: var(--hover); color: #fff; }
    .list { flex: 1; overflow: auto; padding: 8px; }
    #rows { display: flex; flex-direction: column; gap: 4px; }
    .row { padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
    .row:hover { background: var(--hover); }
    .row.active { background: var(--cell); border-color: rgba(59,130,246,.55); }
    .row.failed .name { color: #ff9e9e; }
    .line1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a40; flex: none; }
    .dot.loading { background: #f0b429; animation: pulse 1s infinite alternate; }
    .dot.ok { background: #3fb950; }
    .dot.failed { background: #ff5c5c; }
    @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
    .name { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .chip { flex: none; padding: 1px 6px; border-radius: 999px; background: var(--head); color: #b4b4bb; font: 11px ui-monospace, monospace; }
    .st { flex: none; color: var(--muted); font-size: 11px; white-space: nowrap; margin-left: auto; }
    .line2 { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-left: 16px; font-size: 11.5px; color: var(--muted); min-width: 0; }
    .line2 .tg { flex: none; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #b4b4bb; }
    .line2 .tg b { color: var(--fg); font-weight: 600; }
    .line2 .tg.none { color: #6b6b72; }
    /* 编辑态就地变成可输入,尺寸/位置与只读态完全一致,不发生位移 */
    .line2 .ip { flex: none; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; border-radius: 999px; background: var(--head); color: #b4b4bb; font: 11px ui-monospace, monospace; line-height: 16px; }
    .line2 .ip.none { display: none; }
    .line2 .phone { flex: none; color: #b4b4bb; font: 11px ui-monospace, monospace; white-space: nowrap; }
    .line2 .phone.none { display: none; }
    button.code { background: #1f6feb; padding: 3px 8px; font-size: 11px; }
    button.code.on { background: #c0142e; }
    .ghead .phone { color: #b4b4bb; font: 11px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    /* 代理设置弹窗 */
    /* 不再是全屏 modal:设置盖在那一格的 webview 上,位置和尺寸跟格子走,
       和接码 overlay 看到的效果一样。其余格子完全不受影响。 */
    .modal { position: fixed; inset: 0; z-index: 60; display: block; background: transparent; pointer-events: none; }
    .modal-card { position: absolute; overflow: auto; pointer-events: auto; }
    .modal[hidden] { display: none; }
    .cfg-info { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; background: #0f0f11; display: flex; flex-direction: column; gap: 4px; }
    .ci-row { display: flex; gap: 12px; font-size: 12px; line-height: 1.65; align-items: baseline; }
    .ci-row .ci-k { flex: none; width: 76px; color: var(--muted); }
    .ci-row .ci-v { flex: 1; min-width: 0; color: var(--fg); word-break: break-all; }
    .ci-row .ci-v .mono { font-family: ui-monospace, monospace; user-select: all; cursor: text; }
    .ci-row .ci-v .muted { color: var(--muted); }
    .ci-b { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .ci-b.ok { background: rgba(63,185,80,.16); color: #7ee787; }
    .ci-b.warn { background: rgba(240,180,41,.16); color: #f0c150; }
    .ci-b.mut { background: var(--line); color: var(--muted); }
    .cfg-info hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
    .modal-card { width: 380px; max-width: 92vw; background: var(--cell); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 15px; font-weight: 650; }
    .modal-head .icon { background: transparent; color: #b4b4bb; padding: 2px 6px; font-size: 14px; border-radius: 6px; }
    .modal-head .icon:hover { background: var(--hover); color: #fff; }
    .modal-label { display: block; font-size: 12px; color: var(--muted); margin: 4px 0 6px; }
    .modal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .modal-row input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: #111113; color: var(--fg); font: 12px ui-monospace, monospace; outline: 0; }
    .modal-row input:focus { border-color: var(--accent); }
    .modal-ip { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #b4b4bb; }
    .modal-err { color: #ff8a8a; font-size: 12px; min-height: 16px; margin-bottom: 4px; word-break: break-all; }
    .modal-danger { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
    button.del { background: #b3261e; }
    .row-err { padding: 4px 0 0 16px; color: #ff8a8a; font-size: 11px; display: none; }
    .row-err.on { display: block; }
    #empty { display: none; padding: 40px 24px; color: var(--muted); text-align: center; line-height: 1.8; }
    #empty.on { display: block; }
    .hint { flex: none; padding: 8px 16px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
    main { min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 14px 18px; background: var(--bg); }
    #preview-title { width: min(410px, calc(100% - 20px)); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #b4b4bb; font-size: 12px; }
    #preview-title .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #selected-name { color: var(--fg); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { color: var(--muted); white-space: nowrap; }
    .actions { display: flex; gap: 6px; flex: none; }
    .actions button { padding: 5px 9px; font-size: 12px; }
    #phone { position: relative; width: min(410px, calc(100% - 20px)); flex: 1 1 auto; min-height: 420px; padding: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 28px; background: var(--cell); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    #phone-preview { width: 100%; height: 100%; overflow: hidden; border-radius: 19px; background: #fff; }
    .overlay { position: absolute; inset: 10px; border-radius: 19px; display: none; place-items: center; text-align: center; padding: 28px; color: var(--fg); background: var(--head); z-index: 2; }
    .overlay.on { display: grid; }
    .overlay h2 { margin: 0 0 8px; font-size: 16px; color: #ff8a8a; }
    .overlay p { margin: 0 0 14px; font-size: 13px; line-height: 1.6; color: var(--muted); word-break: break-all; }
    .overlay code { color: var(--fg); font: 12px ui-monospace, monospace; }
    .overlay .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    /* 批量登录:未登录的会话一次全部铺开(最多 10 格),每格一个独立 BrowserView */
    #grid-title { display: none; width: 100%; margin-bottom: 6px; align-items: center; justify-content: space-between; gap: 8px; color: #b4b4bb; font-size: 12px; }
    #grid-title b { color: var(--fg); font-size: 13px; }
    /* 顶栏:外层 #grid-title 是 flex,但里面的 .left 是普通 block,徽章 / 「批量登录」/ 计数
       三段 inline 元素直接贴成一串。间距只在 #preview-title .left 上定义过,这条漏了。 */
    #grid-title { height: 34px; padding: 0 2px; }
    #grid-title .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #grid-title .mid { margin-right: 0; }
    #grid-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    /* 分页控件做成一个整体的胶囊,和 .chip / .icon 同一套语汇 —— 之前是三个
       各自带边框的原生控件散在工具栏里,和面板其它地方完全不是一个风格。 */
    .tabs { display: inline-flex; gap: 2px; padding: 1px; border-radius: 999px; background: var(--head); border: 1px solid var(--line); }
    .tabs button { padding: 2px 10px; border: none; border-radius: 999px; background: transparent; color: #b4b4bb; font-size: 11.5px; cursor: pointer; }
    .tabs button.on { background: var(--line); color: var(--fg); }
    .pager { display: inline-flex; align-items: center; gap: 2px; padding: 1px 3px; border-radius: 999px;
             background: var(--head); border: 1px solid var(--line); }
    .pager .icon { padding: 1px 5px; font-size: 14px; line-height: 18px; border-radius: 999px; }
    .pager #page-label { min-width: 96px; text-align: center; color: #b4b4bb; font: 11px ui-monospace, monospace; }
    .pager i { width: 1px; height: 14px; background: var(--line); margin: 0 3px; }
    .pager input { width: 34px; padding: 1px 2px; text-align: center; border: none; background: transparent;
                   color: var(--fg); font: 11px ui-monospace, monospace; }
    .pager input::-webkit-outer-spin-button, .pager input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #grid { display: none; width: 100%; flex: 1 1 auto; min-height: 0; gap: 8px; flex-direction: row; flex-wrap: wrap; align-content: flex-start; overflow-x: hidden; overflow-y: auto; }
    /* 批量模式 = 整页只有 webview:侧栏整个隐藏,顶部一条细工具栏,其余全是格子 */
    body.batch { grid-template-columns: 1fr; }
    body.batch aside { display: none; }
    main.batch { padding: 8px 10px 10px; }
    main.batch #preview-title, main.batch #phone { display: none; }
    main.batch #grid-title { display: flex; }
    main.batch #grid { display: flex; }
    /* 永久网格:去掉非批量(列表+单预览),默认且唯一 = 平铺全部 webview */
    aside { display: none !important; }
    body { grid-template-columns: 1fr !important; }
    main #preview-title, main #phone { display: none !important; }
    main #grid-title { display: flex !important; }
    main #grid { display: flex !important; }
    /* ── 非客服的两种看法:网格 / 列表 ───────────────────────────────────
       列表模式下整页是一张表,点一行把那个格子从右侧抽屉滑出来。
       抽屉直接复用 #grid 本体,只改定位,**不搬 DOM** —— <webview> 一旦在文档里被
       移动就会重新挂载:会话要重连、正在跑的登录进度会丢。 */
    #drawer { display: flex; flex-direction: column; width: 100%; flex: 1 1 auto; min-height: 0; }
    #drawer-close, #tglist, #drawer-scrim { display: none; }
    main.listmode #tglist { display: block; width: 100%; flex: 1 1 auto; min-height: 0; overflow: auto;
                            border: 1px solid var(--line); border-radius: 10px; background: var(--head); }
    main.listmode #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 66vw); z-index: 44;
                            background: var(--bg); border-left: 1px solid var(--line);
                            box-shadow: -18px 0 44px rgba(0,0,0,.5); padding: 8px 10px 10px;
                            transform: translateX(101%); transition: transform .18s ease; }
    main.listmode.drawer-open #drawer { transform: none; }
    /* 抽屉里只有一格,让它把抽屉撑满 —— .gcell 平时是固定 360px × 50vh 的网格砖,
       直接拿进抽屉会缩在左上角一小块。 */
    main.listmode #grid { display: block !important; }
    main.listmode #grid > .gcell { width: 100%; height: 100%; }
    main.listmode #drawer-close { display: flex; position: absolute; top: 14px; left: -15px; z-index: 2;
                                  width: 30px; height: 30px; align-items: center; justify-content: center;
                                  padding: 0; border-radius: 999px; background: var(--head);
                                  border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    main.listmode.drawer-open #drawer-scrim { display: block; position: fixed; inset: 0; z-index: 43;
                                              background: rgba(0, 0, 0, .45); }

    /* 表是一张卡片:定宽居中、四边有界。之前只给 table 设了 max-width,
       行的分隔线和 hover 底色照样铺到窗口边缘,左边空一大块、右边贴边,看着像没排版。 */
    /* 滚动条会把内容区挤窄几个像素,卡片就和上面那排按钮差了 5px 对不齐。
       两边都预留出滚动条的位置,居中才是真的居中。 */
    main.listmode #tglist { padding: 0 0 16px; scrollbar-gutter: stable both-edges; }
    #tblcard { width: 100%; max-width: 1000px; margin: 0 auto; border: 1px solid var(--line);
               border-radius: 12px; background: var(--cell); overflow: hidden; }
    #tglist table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #tglist th { position: sticky; top: 0; z-index: 1; background: var(--head); color: var(--muted);
                 font-weight: 500; text-align: left; padding: 0 12px; height: 34px;
                 border-bottom: 1px solid var(--line); white-space: nowrap; }
    #tglist td { padding: 0 12px; height: 36px; border-top: 1px solid rgba(255, 255, 255, .05);
                 color: #c9c9d1; white-space: nowrap; vertical-align: middle; }
    #tglist tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .018); }
    #tglist tr.row { cursor: pointer; }
    #tglist tr.row:hover td { background: rgba(255, 255, 255, .06); }
    #tglist tr.row.on td { background: rgba(240, 164, 90, .13); }
    #tglist col.c-num { width: 60px; } #tglist col.c-ph { width: 158px; }
    #tglist col.c-px { width: 80px; }  #tglist col.c-stt { width: 190px; }
    #tglist td.num, #tglist td.ph, #tglist td.px { font: 11px ui-monospace, monospace; color: var(--muted); }
    #tglist td.num { color: #8e8e98; }
    #tglist td.info { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    /* 状态 = 药丸 + 紧跟着的 id,不留空白列 */
    #tglist .pill { display: inline-block; min-width: 46px; text-align: center; padding: 1px 8px;
                    border-radius: 999px; font-size: 11px; line-height: 17px; border: 1px solid transparent; }
    #tglist .pill.ok  { background: rgba(60, 200, 130, .14); color: #4ed197; border-color: rgba(60,200,130,.28); }
    #tglist .pill.off { background: rgba(255, 255, 255, .06); color: var(--muted); border-color: var(--line); }
    #tglist .pill.run { background: rgba(240, 164, 90, .16); color: #f0a45a; border-color: rgba(240,164,90,.34); }
    #tglist .pill.bad { background: rgba(240, 90, 90, .14); color: #f08a8a; border-color: rgba(240,90,90,.3); }
    #tglist .uid { margin-left: 8px; color: #7f7f8a; font: 11px ui-monospace, monospace; }
    #tglist .warn { color: #f0a45a; }
    #tglist .empty { padding: 20px; text-align: center; color: var(--muted); }
    /* 视图切换放在内容区上方、和表格卡片左右对齐 —— 它只管下面这块内容,
       挤在顶栏那一排全局按钮里会被当成又一个全局动作。客服 tab 没有列表模式,整条不显示。 */
    #viewbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px;
               width: 100%; margin: 0 0 8px; flex: 0 0 auto; }
    #viewbar .vleft { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    /* 这一排里的东西尺寸要一致:.ghost 继承的是默认大按钮(13px / 圆角 8 / padding 7),
       和「网格|列表」那颗 11.5px 胶囊差一大截。统一成同一个高度和同一套字号圆角。 */
    #viewbar .tabs, #viewbar .pager, #viewbar .vleft > .ghost { height: 22px; box-sizing: border-box; }
    #viewbar .ghost { display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px;
                      font-size: 11.5px; font-weight: 500; line-height: 1; }
    #viewbar .ghost.on { background: var(--accent); border-color: transparent; color: #fff; }
    main.listmode #viewbar { max-width: 1000px; margin: 0 auto 8px; }
    /* 「自动开群」是个选择模式:点亮之后每个格子头上冒出一个勾选框,勾哪个开哪个。
       原来的「全部开/全部关」退化成这个模式里的全选/全不选。 */
    .ghead .autock { display: none; flex: none; width: 13px; height: 13px; margin: 0 1px 0 0;
                     accent-color: var(--accent); cursor: pointer; }
    body.autopick .ghead .autock { display: inline-block; }
    body.autopick .gcell { outline: 1px dashed rgba(255, 255, 255, .12); outline-offset: -1px; }
    /* 绿框 = 这个号的随机开群本来就开着;橙框 = 这一轮被勾中了。两回事,不能用同一个记号 */
    body.autopick .gcell.autoon { outline-color: rgba(60, 200, 130, .55); }
    body.autopick .gcell.autosel { outline: 2px solid rgba(240, 164, 90, .7); }
    #autobar { padding: 0 3px; }
    #autobar #auto-count { min-width: 52px; text-align: center; color: #b4b4bb; font: 11px ui-monospace, monospace; }
    #autobar .ghost { height: 18px; padding: 0 8px; font-size: 11px; background: transparent; border: none; color: #b4b4bb; }
    #autobar .ghost:hover { background: var(--hover); color: #fff; }
    #autobar .ghost.on { background: var(--line); color: var(--fg); }
    /* 顶栏的开关型按钮:亮起来 = 这台机器的随机开群是开着的 */
    /* [hidden] 对 .pager / .tabs 不起作用(它们自己写了 display:inline-flex),要显式关掉 */
    .is-off { display: none !important; }

    /* 单格最大化:全屏叠层显示当前 webview(其它 webview detach 保活,不受影响) */
    #maxview { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
    #maxview[hidden] { display: none; }
    .maxhead { flex: none; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .maxhead .name { font-weight: 650; font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .maxhead .chip { flex: none; padding: 1px 6px; border-radius: 999px; background: var(--head); color: #b4b4bb; font: 11px ui-monospace, monospace; }
    .maxhead .minfo { flex: none; display: inline-flex; align-items: center; gap: 5px; max-width: 30vw; padding: 2px 8px; border-radius: 8px; background: var(--head); color: #c9c9d1; font: 11px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .maxhead .minfo:empty { display: none; }
    /* 最大化后的 header 与未最大化的格子头保持一致:不显示名字,
       也不显示手机号 / 接码 URL 那两块信息。这些在 ⚙ 里都能看。 */
    .maxhead .name { display: none; }
    .maxhead .minfo { display: none; }
    .maxhead .minfo b { color: #8a8a93; font-weight: 500; user-select: none; }
    .maxhead .minfo span { color: #e9e9ee; user-select: all; overflow: hidden; text-overflow: ellipsis; }
    .maxhead .sp { flex: 1; }
    .maxhead .acts { flex: none; display: inline-flex; align-items: center; gap: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
    #maxbody { flex: 1 1 auto; min-height: 0; }
    .gcell { display: flex; flex-direction: column; flex: none; width: 360px; height: 50vh; min-height: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--cell); overflow: hidden; }
    .gbody .ph { display: flex; align-items: center; justify-content: center; height: 100%;
      color: var(--muted); font-size: 12px; background: var(--head); }
    /* .gcell 是 display:flex,会盖过 [hidden] 的 UA 默认 display:none ——
       不加这条,藏起来的格子照样占位(实测:每页 4 个,却铺了 10 格占位)。 */
    .gcell[hidden] { display: none !important; }
    .gcell.done { border-color: rgba(63,185,80,.6); }
    .gcell.failed { border-color: rgba(255,92,92,.6); }
    .ghead { flex: none; height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--head); min-width: 0; }
    .ghead .name { font-size: 12px; }
    /* 格子头不显示 profile 名字(只是不显示,profile 本身不动) */
    .ghead .name { display: none; }
    /* 格子头不显示手机号 */
    .ghead .phone { display: none; }
    .ghead .st { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
    /* 客服是**状态**不是开关。原来做成 .icon 按钮,一拿到 .on 就变成和「当前激活模式」
       一样的蓝色实心方块 —— 头部并排两个蓝块,分不清谁能点。改成紧挨编号的小标签。 */
    .ghead .cstag { flex: none; padding: 1px 6px; border-radius: 999px; font-size: 10.5px; line-height: 15px;
      background: rgba(240,164,90,.14); color: #f0a45a; border: 1px solid rgba(240,164,90,.3); white-space: nowrap; }
    .ghead .cstag[hidden] { display: none; }
    .ghead .acts { flex: none; display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding-left: 8px; }
    /* 格子头 / 最大化头部那一排图标:统一成 24×24 的盒子,里面 14px 的单色线条 SVG。
       之前 ⚙ ⤢ ⟳ 是文本符号、🌐 🔄 是彩色 emoji,两套字体画出来一大一小、一彩一灰。 */
    .ghead .icon, .maxhead .icon { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: #b4b4bb; border-radius: 6px; line-height: 1; }
    .ghead .icon svg, .maxhead .icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .ghead button.code { height: 22px; padding: 0 9px; display: inline-flex; align-items: center; }
    /* 上面把 .icon 统一成 inline-flex,会盖掉原来 .pingctl{display:none} —— 🔄 ✕ 只在
       ping 叠加层开着时才出现,这里把优先级补回来。 */
    .ghead .st ~ .acts { margin-left: 8px; }
    .gcell.done .ghead .st { color: #3fb950; font-weight: 600; }
    /* 打开弹窗时主进程会把所有格子视图摘下来(BrowserView 永远盖在 DOM 之上,
       不摘弹窗就看不见),露出来的就是这块占位。底色留白的话整屏变白板,
       看着像坏了 —— 改成和格子同色。视图贴回来后会盖住它,不影响显示。 */
    .gbody { flex: 1 1 auto; min-height: 0; width: 100%; background: var(--cell); }
    #grid-empty { grid-column: 1 / -1; display: grid; place-items: center; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 机器 id 徽章:机器多了一眼认出这是哪台。列表/批量两种模式都显示。 */
    .mid{display:inline-block;margin-right:8px;padding:2px 9px;border-radius:7px;font:700 13px ui-monospace,monospace;
         background:#1f6feb;color:#fff;letter-spacing:.5px;vertical-align:middle;box-shadow:0 1px 4px rgba(0,0,0,.4)}
    .gcell.pinging .ghead .icon.ping, .gcell.cfging .ghead .icon.gear { background: var(--accent); color: #fff; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #33363f; border-radius: 8px; border: 2px solid var(--bg); background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #454a57; }
  ::-webkit-scrollbar-corner { background: transparent; }
    .maxhead .icon.on, .ghead .icon.on { background: var(--accent); color: #fff; }
  /* 某个叠加层打开时,header 收起其余按钮,只留「当前这个」和一个关闭 ——
     一排图标全亮着看不出现在处于什么状态,也容易误点。 */
  .gcell.modeon .ghead .acts > button { display: none; }
  .gcell.modeon .ghead .acts > button.on,
  .gcell.modeon .ghead .acts > button.xclose { display: inline-flex; }
  .ghead .acts > button.xclose { display: none; margin-left: auto; }
  /* 进入模式后按钮要靠右。不能用 width:100% —— .acts 还带着 margin-left:auto,
     两者叠加会让容器比剩余空间还宽,右对齐的内容被推出可视区(实测:图标整个不见)。
     改成吃掉剩余空间 + 右对齐。 */
  .gcell.modeon .ghead .acts { flex: 1 1 auto; min-width: 0; justify-content: flex-end; }
  .gcell.modeon .ghead .acts > button.xclose { margin-left: 6px; }

  /* 格子上半的信息浮层。格子是盖在页面之上的 BrowserView,页面里的元素挡不住它 ——
     所以打开浮层时把格子矩形缩到下半(syncPreview 里做),上半空出来给这个 div。 */
  .gstat { padding: 8px 10px; background: var(--head); border-bottom: 1px solid var(--line); font-size: 12px; overflow: auto; }
  .gstat .l { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .gstat .l:last-child { margin-bottom: 0; }
  .gstat b { color: var(--fg); }
  .gstat .muted { color: var(--muted); }
  .gstat .ok { color: #5fd39b; }
  .gstat .warn { color: #e8a33d; }
  .gstat .sec { width: 52px; padding: 2px 4px; border-radius: 5px; background: var(--panel2, #1a1a20); color: var(--fg); border: 1px solid var(--line); font-size: 11px; }
  .gstat .go { padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-size: 11px; }
  .gstat .go.on { background: #2f6f4f; border-color: #2f6f4f; color: #fff; }
  </style>
</head>

      <label class="modal-label">代理地址</label>

  <script>
    const TELEGRAM_URL = 'https://web.telegram.org/k/';
    const rowsEl = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const addButton = document.getElementById('add-profile');
    const preview = document.getElementById('phone-preview');
    const selectedName = document.getElementById('selected-name');
    const selDot = document.getElementById('sel-dot');
    const statusEl = document.getElementById('status');
    const ov = { empty: document.getElementById('ov-empty'), loading: document.getElementById('ov-loading'), error: document.getElementById('ov-error') };
    const errDetail = document.getElementById('err-detail');
    let profiles = [];
    let selected = null;
    const openedProfiles = new Set();   // 打开过的会话保留在后台(登录态不丢),只有选中的贴到预览区
    const codeOpen = new Set(); const pingOpen = new Set(); const pingUrl = new Map();          // 已叠开接码 overlay 的 accountIdx(同 partition 的接码 webview 覆盖在格子上)
    const cellState = new Map();        // accountIdx -> { loading, failed, error, url, title }
    const rows = new Map();             // accountIdx -> row element
    // 建多少个格子(不是同时打开多少个)。格子改成 webview 后不再占主进程的 BrowserView
    // 名额,而且按页懒挂载 —— 当前页之外的只是个隐藏的空壳,所以这里可以铺全部账号。
    // 真正同时开几个由分页的「每页」控制。
    const BATCH_MAX = 200;
    const mainEl = document.querySelector('main');
    const gridEl = document.getElementById('grid');
    const gridCount = document.getElementById('grid-count');
    let batchMode = false;
    let maxedIdx = null;
    const batch = new Set();            // 批量模式下铺开的 accountIdx
    const gcells = new Map();
    // 打开了加群浮层的格子;以及每格当前要显示的 URL(随机开群时改它,syncPreview 会带下去)
    const statOpen = new Set();
    const cellUrl = new Map();
    const autoOn = new Set();          // 正在自动随机开群的格子
    const autoStats = new Map();       // idx -> {assigned,joined,remaining}
    const onceAt = new Map();          // idx -> 上次点「开一个」的时间(只为按钮反馈)
    const TGSOU_SEC_KEY = 'tgmatrix.autosec';           // accountIdx -> { el, body }

    const esc = (value) => String(value || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    // 机器 id:app 打开面板时把本机 id 拼进 URL(?team=xs-3007)。两处徽章都填上。
    (function(){ try {
      const t = new URLSearchParams(location.search).get('team');
      if (t) for (const id of ['mid-list','mid-batch']) {
        const el = document.getElementById(id); if (el) { el.textContent = t; el.hidden = false; el.title = '本机: ' + t; }
      }
      if (t) document.title = t + ' · Telegram 矩阵';
    } catch (e) {} })();
    const cellId = (idx) => `telegram-preview-${idx}`;
    const stateOf = (idx) => cellState.get(Number(idx)) || {};
    const dotClass = (st) => st.loading ? 'loading' : st.failed ? 'failed' : (st.url ? 'ok' : '');
    const stateText = (st, opened) => st.loading ? '加载中…' : st.failed ? '连接失败' : st.url ? '已加载' : (opened ? '' : '未打开');
    const fmtAgo = (iso) => { const t = Date.parse(iso || ''); if (!t) return ''; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? '刚刚' : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`; };
    // 列表只显示一个简短地区(取最具体的一段:优先省/州,否则国家),完整信息在 tooltip。
    const shortArea = (area) => { const seg = String(area || '').split('·').map((x) => x.trim()).filter(Boolean); return seg[1] || seg[0] || ''; };
    function renderIp(p) {
      const row = rows.get(p.accountIdx); if (!row) return;
      const el = row.querySelector('.ip'); el.className = 'ip';
      const info = p.ipInfo;
      if (info && info.ip) {
        const a = shortArea(info.area);
        el.textContent = a || info.ip;
        el.title = `出口 IP ${info.ip}${info.area ? '，' + info.area : ''}，${fmtAgo(info.probedAt) || '未知时间'}探测`;
      } else { el.classList.add('none'); el.textContent = ''; el.title = ''; }
    }
    // 经该 Profile 的代理探测出口 IP;成功后更新它的列表地区。返回 {ok, info|error}。
    async function probeIp(p) {
      try {
        const r = await window.panelAPI.probeIp(p.accountIdx);
        if (r && r.ipInfo) { p.ipInfo = r.ipInfo; renderIp(p); return { ok: true, info: r.ipInfo }; }
        return { ok: false, error: (r && r.error) || '探测失败' };
      } catch (e) { return { ok: false, error: e.message || String(e) }; }
    }
    // 身份:优先用本次会话探到的(cellState.identity),否则用 profile 里存的(上次登录)。
    const identityOf = (p) => stateOf(p.accountIdx).identity || p.telegram || null;
    const phoneOf = (p) => (p.login && p.login.phone) || '';
    const codeUrlOf = (p) => (p.login && p.login.codeUrl) || '';
    function renderPhone(p) {
      const row = rows.get(p.accountIdx); if (!row) return;
      const el = row.querySelector('.phone'); const ph = phoneOf(p);
      el.classList.toggle('none', !ph); el.textContent = ph; el.title = codeUrlOf(p) ? `接码：${codeUrlOf(p)}` : '';
      const g = gcells.get(p.accountIdx); if (g) { g.el.querySelector('.phone').textContent = ph; g.el.querySelector('.code').disabled = !codeUrlOf(p); }
    }
    // 接码 = 在当前格子的 Telegram webview 上方叠一个同尺寸、同 partition(persist:sandbox-idx,
    // 走该 profile 的代理出口)、更高 z 层的接码 webview。再点一次关闭。与 tg-autologin 自动化里
    // 的 overlay 完全一致的呈现,只是重载/关闭放在格子 header(BrowserView 之上无法放页面按钮)。
    function openCode(p) {
      if (!codeUrlOf(p)) { flash(`#${p.accountIdx} 还没有接码 URL,点 ⚙ 填写`, 4000); return; }
      if (!openedProfiles.has(p.accountIdx)) { openedProfiles.add(p.accountIdx); cellState.set(p.accountIdx, { loading: true }); }
      if (codeOpen.has(p.accountIdx)) { codeOpen.delete(p.accountIdx); flash(`#${p.accountIdx} 已关闭接码`); }
      else { codeOpen.add(p.accountIdx); flash(`#${p.accountIdx} 接码已叠加在格子上`); }
      updateCodeButtons(p.accountIdx);
      syncPreview();
    }
    function updateCodeButtons(idx) {
      const on = codeOpen.has(idx);
      const g = gcells.get(idx);
      if (g) { const b = g.el.querySelector('.code'); if (b) { b.classList.toggle('on', on); b.textContent = on ? '关闭接码' : '接码'; } }
      if (selected && selected.accountIdx === idx) { const b = document.getElementById('open-code'); if (b) { b.classList.toggle('on', on); b.textContent = on ? '关闭接码' : '接码'; } }
      if (maxedIdx === idx) renderMaxHead();
    }
    function renderIdentity(p) {
      renderPhone(p);
      const row = rows.get(p.accountIdx); if (!row) return;
      const el = row.querySelector('.tg');
      const it = identityOf(p);
      if (it && (it.username || it.displayName || it.phone)) {
        el.classList.remove('none');
        el.innerHTML = (it.username ? `<b>@${esc(it.username)}</b>` : '') + (it.displayName ? `${it.username ? ' · ' : ''}${esc(it.displayName)}` : '') + (!it.username && !it.displayName && it.phone ? `+${esc(it.phone)}` : '');
        el.title = [it.username && `@${it.username}`, it.displayName, it.phone && `+${it.phone}`].filter(Boolean).join('  ');
      } else {
        el.classList.add('none');
        el.textContent = openedProfiles.has(p.accountIdx) && stateOf(p.accountIdx).url ? '未登录' : '—';
        el.title = '';
      }
    }

    function flash(text, ms = 2500) {
      statusEl.textContent = text; statusEl.dataset.sticky = '1';
      clearTimeout(flash.t);
      flash.t = setTimeout(() => { delete statusEl.dataset.sticky; renderPreviewState(); }, ms);
    }

    function syncPreview() {
      if (!window.panelAPI) return;
      const rect = preview.getBoundingClientRect();
      const mv = document.getElementById('maxview'); if (mv) mv.hidden = (maxedIdx == null);
      const box = (r) => ({ x: r.x, y: r.y, w: r.width, h: r.height });
      // 设置弹窗打开时:只让被「弹窗卡片」盖住的格子让位(detach),其余 webview 保持显示 —— 方便对照。
      // 和 facebook-matrix.html 同一套做法,不再一次性把整组收起来。
      const cardEl = (cfgModal && !cfgModal.hidden) ? document.querySelector('.modal-card') : null;
      const cardR = cardEl ? cardEl.getBoundingClientRect() : null;
      const hitsCard = (r) => !!(cardR && r && !(r.x + r.w <= cardR.left || r.x >= cardR.right || r.y + r.h <= cardR.top || r.y >= cardR.bottom));
      // 面板在后台标签里时,一格都不显示。
      // 同一台机器可能开着多个矩阵面板,各自的格子坐标是一样的,后台那份会原样贴在
      // 前台那份上面:前台开弹窗只让自己的格子让位,后台的照样盖住弹窗(实测 2026-09-11,
      // xs-1001 上两组 6 格叠在同一批坐标上)。visible:false 只是不画,会话照常活着,保活不受影响。
      const __bg = document.hidden;
      if (cfgModal && !cfgModal.hidden && cfgP) placeCfgOverCell(cfgP);
      const cells = []; const overlays = [];
      for (const profileId of openedProfiles) {
        let visible = false, r = null, ovVisible = false;
        if (maxedIdx != null) {
          if (profileId === maxedIdx) { visible = true; r = box(document.getElementById('maxbody').getBoundingClientRect()); }
        } else if (batchMode) {
          // 网格里的 Telegram 本体已经是页面内的 <webview>,不再需要主进程贴 BrowserView。
          // 这里只算矩形给叠加层(接码/ping)定位,格子自身 visible 恒为 false。
          const g = gcells.get(profileId);
          if (g && batch.has(profileId)) {
            r = box(g.body.getBoundingClientRect());
            const gr = gridEl.getBoundingClientRect();
            ovVisible = r.h > 0 && r.y >= gr.top - 1 && (r.y + r.h) <= gr.bottom + 1;
          }
        } else if (selected && profileId === selected.accountIdx) { visible = true; r = box(rect); }
        if (__bg) { visible = false; ovVisible = false; }   // 后台标签:不画,但会话留着
        if (visible && hitsCard(r)) visible = false;       // 被弹窗盖住 → 临时 detach
        if (ovVisible && hitsCard(r)) ovVisible = false;
        // 浮层不用手动缩矩形:.gcell 是 flex 列、.gbody 是 flex:1,插入 .gstat 后
        // .gbody 的 boundingRect 已经自动让出了那块高度。再减一次 = 黑色空隙(踩过)。
        cells.push({ id: cellId(profileId), url: (cellUrl.get(profileId) || TELEGRAM_URL), profile: profileId, visible, rect: r });
        // 接码叠加层:同 rect、同 profile(=同 partition/代理),排在 tg 格子之后 → attach 更晚 → 叠最上层
        // 叠加层已经改成格子内的 webview(见 syncOverlay),不再交给主进程贴 BrowserView。
      }
      try { window.panelAPI.sync(cells.concat(overlays)); } catch (e) {}
    }

    function describeError(p, st) {
      const e = st.error || {};
      const desc = e.description ? `<code>${esc(e.description)}</code>` : '';
      if (p.proxy) return `代理 <code>${esc(p.proxy)}</code> 不可用或无法访问 Telegram。${desc}<br>点 ⚙ 检查或更换该 Profile 的代理，可用「测 IP」验证。`;
      return `当前为直连，网络无法访问 Telegram。${desc}<br>点 ⚙ 为该 Profile 设置代理。`;
    }

    function renderPreviewState() {
      const st = selected ? stateOf(selected.accountIdx) : {};
      ov.empty.classList.toggle('on', !selected);
      ov.loading.classList.toggle('on', !!selected && !!st.loading && !st.url);
      ov.error.classList.toggle('on', !!selected && !st.loading && !!st.failed);
      if (selected && st.failed) errDetail.innerHTML = describeError(selected, st);
      selDot.className = `dot ${selected ? dotClass(st) : ''}`;
      if (selected && !statusEl.dataset.sticky) statusEl.textContent = stateText(st, true);
      if (selected) updateCodeButtons(selected.accountIdx);
    }

    function renderRowState(idx) {
      const row = rows.get(idx); if (!row) return;
      const st = stateOf(idx);
      row.classList.toggle('failed', !!st.failed && !st.loading);
      row.querySelector('.dot').className = `dot ${dotClass(st)}`;
      row.querySelector('.st').textContent = stateText(st, openedProfiles.has(idx));
      renderGridCell(idx);
    }

    // ── 批量登录:把未登录的 Profile 一次全部铺开 ──
    const hasIdentity = (p) => { const it = identityOf(p); return !!(it && (it.username || it.displayName || it.phone)); };
    const gridCols = (n) => n <= 1 ? 1 : n <= 4 ? 2 : n <= 6 ? 3 : n <= 8 ? 4 : 5;
    function buildGridCell(p) {
      const el = document.createElement('div');
      el.className = 'gcell'; el.dataset.id = String(p.accountIdx);
      el.innerHTML = `<div class="ghead"><input type="checkbox" class="autock" title="随机开群:勾上这个号就开始自动换群"><span class="dot"></span><span class="name">${esc(p.name)}</span><span class="chip">#${p.accountIdx}</span><span class="cstag" hidden title="客服号:常驻不卸载,归到「客服」tab。归属在 agg 台账(agg.fm558.com/#/tg)里改">客服</span><span class="phone">${esc(phoneOf(p))}</span><span class="st"></span><span class="acts"><button class="code" title="在格子上叠加/关闭接码 webview(同代理出口)">接码</button><button class="icon stat" title="加群面板:分配/已加入、脚本版本、限流,自动随机开群"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></button><button class="icon tgsou" title="单独打开这个账号的搜群"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><button class="icon gear" title="手机号 / 接码 URL / 代理设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="icon ping" title="用本 Profile 代理打开 ping0.cc(验 IP/指纹)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button><button class="icon max" title="最大化 / 还原"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button><button class="icon xclose" title="关闭当前叠加层"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></span></div><div class="gstat" hidden></div><div class="gbody"></div>`;
      el.querySelector('.max').onclick = (e) => { e.stopPropagation(); toggleMax(p.accountIdx); };
      // ping / 接码 也走互斥:先关掉别的叠加层,再用它们原本的开关(各自管自己的集合)
      el.querySelector('.ping').onclick = (e) => { e.stopPropagation(); closeOthers(p.accountIdx, 'ping'); togglePing(p.accountIdx); setTimeout(() => syncMode(p.accountIdx), 0); };
      el.querySelector('.code').onclick = (e) => { e.stopPropagation(); closeOthers(p.accountIdx, 'code'); openCode(p); setTimeout(() => syncMode(p.accountIdx), 0); };
      el.querySelector('.code').disabled = !codeUrlOf(p);
      // 加群面板:分配/已加入、注入脚本版本、限流剩余、随机开群开关。
      // 版本和限流不另外取 —— 注入脚本把它们写进了 document.title,主进程通过
      // state.title 推给面板,这是面板唯一能看到格子内部状态的通道。
      el.querySelector('.stat').onclick = (e) => {
        e.stopPropagation();
        if (openMode(p.accountIdx, 'stat')) refreshStat(p.accountIdx);
      };
      el.querySelector('.xclose').onclick = (e) => { e.stopPropagation(); closeMode(p.accountIdx); };
      // 单独打开这个账号的搜群:tgsou 后端用桌面控制 token 在本机开 tab(已开着就切前台)。
      // 和顶部「打开搜群」的区别是它只管这一格,不会把全部账号都开出来。
      el.querySelector('.tgsou').onclick = async (e) => {
        e.stopPropagation();
        const b = e.currentTarget; b.disabled = true;
        try {
          const team = new URLSearchParams(location.search).get('team') || '';
          const r = await fetch('https://tgsou.cicy-ai.com/api/open1?t=' + TGSOU_TOKEN
            + '&team=' + encodeURIComponent(team) + '&n=' + p.accountIdx);
          const j = await r.json().catch(() => ({}));
          flash(j.error ? ('搜群打开失败:' + j.error) : (j.activated ? '已切到已开的搜群' : '已打开 #' + p.accountIdx + ' 的搜群'));
        } catch (err) { flash('搜群打开失败:' + err.message); }
        finally { b.disabled = false; }
      };
      el.querySelector('.gear').onclick = (e) => { e.stopPropagation(); if (cfgP && cfgP.accountIdx === p.accountIdx && !cfgModal.hidden) closeCfgModal(); else openCfgModal(p); };
      el.querySelector('.ghead').onclick = (e) => { if (!e.target.closest('button')) { selectProfile(p.accountIdx); } };
      const body = el.querySelector('.gbody');
      // 本体是 <webview>,但**不在这里建** —— 一个 Telegram 会话实测能吃到 2.5GB,
      // 22 个全开在 32GB 的机器上也撑不住。只有当前这一页的格子才真正挂载,
      // 翻页时把离开的卸掉(内存立刻还回去)。登录态在 partition 里,卸了不丢。
      body.innerHTML = '<div class="ph">未加载 · 翻到这一页自动打开</div>';
      return { el, body, stat: el.querySelector('.gstat'), wv: null };
    }
    // ── 按需挂载 + 分页 ─────────────────────────────────────
    // 客服的 TG 在 social-hub 那边常开,矩阵这些非客服账号按需开:一次只让
    // PAGE_SIZE 个格子有活的 webview,其余是占位。翻页 = 卸旧挂新。
    // 钉住(📌)的格子不受翻页影响,一直活着。
    const PAGE_KEY = 'tgmx.pageSize', CS_KEY = 'tgmx.cs', TAB_KEY = 'tgmx.tab';
    let pageNo = 0;
    // 客服号:常驻,不参与分页。切 tab 只是把另一组藏起来(hidden),**webview 不卸载** ——
    // 客服要随时能收消息,卸了就掉线;非客服才按需开。
    // 客服名单来自 agg 台账(tg_accounts.is_cs),同步写进 profile:新版走 panelAPI 的 cs 字段,
    // 旧版客户端没这个字段,回落到 note 里的 [客服] 前缀。面板不再自己存一份。
    const csSet = new Set();
    const refreshCs = () => {
      csSet.clear();
      for (const p of profiles) {
        if (p.cs || /^\s*\[客服\]/.test(p.note || '')) csSet.add(p.accountIdx);
      }
    };
    let curTab = (() => { try { return localStorage.getItem(TAB_KEY) || 'other'; } catch (e) { return 'other'; } })();
    // 非客服有两种看法:grid = 现在的平铺格子;list = 一张表,点一行从抽屉里打开那一个。
    // 客服不参与 —— 客服号要常驻收消息,只能是平铺。
    const VIEW_KEY = 'tgmx.view';
    let curView = (() => { try { return localStorage.getItem(VIEW_KEY) === 'list' ? 'list' : 'grid'; } catch (e) { return 'grid'; } })();
    let drawerIdx = null;                       // 列表模式下抽屉里开着哪一格
    const listMode = () => curView === 'list' && curTab !== 'cs';
    const setView = (v) => {
      curView = v === 'list' ? 'list' : 'grid';
      try { localStorage.setItem(VIEW_KEY, curView); } catch (e) {}
      if (curView !== 'list') drawerIdx = null;
      applyPage();
    };
    function openDrawer(idx) { if (!gcells.has(idx) || csSet.has(idx)) return; drawerIdx = idx; applyPage(); }
    function closeDrawer() { drawerIdx = null; applyPage(); }
    const setTab = (t) => { curTab = t; try { localStorage.setItem(TAB_KEY, t); } catch (e) {} applyPage(); };
    function pageSize() { const v = Number(localStorage.getItem(PAGE_KEY)) || 4; return Math.max(1, Math.min(24, v)); }

    function mountCell(idx) {
      const g = gcells.get(idx); if (!g || g.wv) return;
      const wv = document.createElement('webview');
      wv.setAttribute('partition', 'persist:sandbox-' + idx);
      wv.setAttribute('src', cellUrl.get(idx) || TELEGRAM_URL);
      wv.setAttribute('allowpopups', '');
      wv.style.cssText = 'width:100%;height:100%;display:flex;background:#fff';
      // 状态转成主进程那套 state 形状,交给原有的 applyCellState,下游一行不用改
      const push = (patch) => applyCellState(Object.assign({ id: cellId(idx) }, patch));
      wv.addEventListener('did-start-loading', () => push({ loading: true }));
      wv.addEventListener('did-stop-loading', () => { let u = ''; try { u = wv.getURL(); } catch (e) {} push({ loading: false, url: u, title: wv.getTitle ? wv.getTitle() : '' }); });
      wv.addEventListener('page-title-updated', (e) => { let u = ''; try { u = wv.getURL(); } catch (er) {} push({ loading: false, url: u, title: e.title || '' }); });
      wv.addEventListener('did-navigate', (e) => push({ loading: false, url: e.url || '' }));
      wv.addEventListener('did-navigate-in-page', (e) => push({ loading: false, url: e.url || '' }));
      wv.addEventListener('did-fail-load', (e) => { if (e.errorCode !== -3) push({ loading: false, failed: true, error: { code: e.errorCode, desc: e.errorDescription } }); });
      g.body.innerHTML = '';
      g.body.appendChild(wv);
      g.wv = wv;
      openedProfiles.add(idx);
    }
    function unmountCell(idx) {
      const g = gcells.get(idx); if (!g || !g.wv) return;
      // 记住当前停在哪个群,下次挂回来接着看
      try { const u = g.wv.getURL(); if (u && /web\.telegram\.org/.test(u)) cellUrl.set(idx, u); } catch (e) {}
      try { g.wv.remove(); } catch (e) {}
      g.wv = null;
      if (g.ov) { try { g.ov.remove(); } catch (e) {} g.ov = null; g.ovKind = ''; }
      g.body.innerHTML = '<div class="ph">未加载 · 翻到这一页自动打开</div>';
      cellState.set(idx, {});
      renderGridCell(idx);
    }
    function pageIdxList() {
      const all = [...gcells.keys()].filter((i) => !csSet.has(i));
      const n = pageSize(), maxPage = Math.max(0, Math.ceil(all.length / n) - 1);
      if (pageNo > maxPage) pageNo = maxPage;
      return { list: all.slice(pageNo * n, pageNo * n + n), total: all.length, maxPage };
    }
    // 自动登录要用这一格的 webview,可它可能不在当前页/不在当前 tab 上 —— 没挂载就是
    // 没有 webview,流程会立刻空转退出。先把它翻到眼前,再开始。
    function gotoIdx(idx) {
      if (!gcells.has(idx)) return false;
      if (csSet.has(idx)) { if (curTab !== 'cs') setTab('cs'); return true; }
      if (listMode()) { openDrawer(idx); return true; }
      const all = [...gcells.keys()].filter((i) => !csSet.has(i));
      const pos = all.indexOf(idx); if (pos < 0) return false;
      const want = Math.floor(pos / pageSize());
      const need = (curTab !== 'other') || (pageNo !== want);
      curTab = 'other'; pageNo = want;
      try { localStorage.setItem(TAB_KEY, 'other'); } catch (e) {}
      if (need) applyPage();
      const g = gcells.get(idx);
      if (g && g.el && g.el.scrollIntoView) { try { g.el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
      return true;
    }

    function applyPage() {
      const { list, total, maxPage } = pageIdxList();
      const onPage = new Set(list);
      const lm = listMode();
      if (lm && drawerIdx != null && (!gcells.has(drawerIdx) || csSet.has(drawerIdx))) drawerIdx = null;
      if (lm && cfgModal && !cfgModal.hidden) { try { closeCfgModal(); } catch (e) {} }
      mainEl.classList.toggle('listmode', lm);
      mainEl.classList.toggle('drawer-open', lm && drawerIdx != null);
      for (const idx of gcells.keys()) {
        const g = gcells.get(idx);
        const isCs = csSet.has(idx);
        // 挂载规则:客服一直挂着;非客服只有翻到它那一页才挂。
        // 显示规则:只显示当前 tab 的那一组 —— 两组的 webview 都还在,只是藏起来。
        // 列表模式:非客服只挂抽屉里打开的那一个,其余一律卸掉(表格里不需要活页面)
        const mounted = isCs || (lm ? idx === drawerIdx : onPage.has(idx));
        const visible = mounted && (curTab === 'cs' ? isCs : !isCs) && (!lm || idx === drawerIdx);
        if (mounted) mountCell(idx); else unmountCell(idx);
        g.el.hidden = !visible;
        const tag = g.el.querySelector('.cstag');
        if (tag) tag.hidden = !isCs;
      }
      const csN = csSet.size, otherN = total;
      const tc = document.getElementById('tab-cs'), to = document.getElementById('tab-other');
      if (tc) { tc.classList.toggle('on', curTab === 'cs'); tc.textContent = '客服 ' + csN; }
      if (to) { to.classList.toggle('on', curTab !== 'cs'); to.textContent = '非客服 ' + otherN; }
      const pager = document.getElementById('pager');
      // 客服常驻、列表模式按需开单个 —— 两种情况都没有「本页开几个」这回事
      if (pager) pager.classList.toggle('is-off', (curTab === 'cs') || lm);
      const vbar = document.getElementById('viewbar');
      if (vbar) vbar.classList.toggle('is-off', curTab === 'cs');
      // 「自动开群」是对着一屏格子做的全局动作,列表模式下一个格子都没开,放着只会误导
      const vleft = document.querySelector('#viewbar .vleft');
      if (vleft) vleft.classList.toggle('is-off', lm);
      if (lm && autoPick) { autoPick = false; autoSel.clear(); syncAutoBtn(); }
      const vg = document.getElementById('view-grid'), vl = document.getElementById('view-list');
      if (vg) vg.classList.toggle('on', curView !== 'list');
      if (vl) vl.classList.toggle('on', curView === 'list');
      if (lm) renderList();
      const lab = document.getElementById('page-label');
      if (lab) {
        lab.textContent = (total ? (pageNo + 1) : 0) + '/' + (maxPage + 1) + ' · ' + list.length + ' 开';
        lab.title = '第 ' + (pageNo + 1) + ' 页,共 ' + (maxPage + 1) + ' 页 · 本页 ' + list.length + ' 个';
      }
      requestAnimationFrame(syncPreview);
    }
    // 列表模式的表:一行一个非客服 profile。这里只画「不用开页面就能知道」的东西
    // (配置 + 格子状态 + 登录进度),真正的会话要点开抽屉才挂载。
    // 这一列要回答的是「这个号登没登录」,不是「webview 挂没挂载」——
    // 列表模式下页面本来就一个都不开,拿挂载状态当状态,整张表只会写满「未加载」。
    // 登录身份是登录时落进 profile 的 logins[telegram],不开页面也读得到。
    // 身份有两个来源:格子开着时探针实测到的(有昵称/真实手机号),和登录时落盘的
    // logins[telegram](只有 id,但不开页面也读得到)。两个都用上,实测优先。
    const tgId = (p) => {
      const lv = stateOf(p.accountIdx).identity;
      if (lv && lv.id) return String(lv.id);
      return (String(((p.telegram || {}).displayName) || '').match(/id=(\d+)/) || [, ''])[1] || '';
    };
    function rowStatus(idx, p) {
      if (loginSay.get(idx)) return { cls: 'run', text: '登录中', uid: '' };
      const id = tgId(p), sv = p.telegram, lv = stateOf(idx).identity;
      if (id || (lv && (lv.username || lv.phone)) || (sv && (sv.username || sv.phone))) {
        return { cls: 'ok', text: '已登录', uid: id ? 'id ' + id : '' };
      }
      if (!phoneOf(p)) return { cls: 'off', text: '空闲', uid: '未配号' };
      if (!codeUrlOf(p)) return { cls: 'bad', text: '未登录', uid: '无接码卡' };
      return { cls: 'off', text: '未登录', uid: '' };
    }
    const statusHtml = (idx, p) => { const r = rowStatus(idx, p);
      return '<span class="pill ' + r.cls + '">' + esc(r.text) + '</span>'
           + (r.uid ? '<span class="uid">' + esc(r.uid) + '</span>' : ''); };
    // 「备注 / 实况」:登录跑着就显示当前这一步,格子开着就显示页面实况,
    // 都没有就显示 profile 备注 —— 这一列本来是空的,空着才显得像没做完。
    // 已经登录的行再摆一个「登录」按钮是噪音 —— 只有还没登、而且号和接码卡都齐的
    // 那几行才需要这个动作;正在跑的显示不可点的「登录中」。
    function rowInfo(idx, p) {
      const say = loginSay.get(idx);
      if (say) return { text: say, warn: false, full: say };
      const lv = stateOf(idx).identity, g = gcells.get(idx), st = stateOf(idx);
      const bits = [];
      if (lv && lv.displayName) bits.push(lv.displayName);
      else if (lv && lv.username) bits.push('@' + lv.username);
      // 台账写的号和实际登录的号对不上 —— #23/#24 就是这么被发现的,这里直接标出来
      let warn = false;
      if (lv && lv.phone) {
        const a = String(lv.phone).replace(/\D/g, ''), b = String(phoneOf(p)).replace(/\D/g, '');
        if (a && b && a !== b) { bits.push('⚠ 实际 +' + a); warn = true; }
      }
      if (g && g.wv) {
        if (st.loading) bits.push('加载中…');
        else if (st.failed) bits.push('加载失败 ' + ((st.error && (st.error.desc || st.error.code)) || ''));
        else if (st.title) bits.push(st.title);
      }
      // 备注是 profile 里的整段说明(几十上百字),原样塞进单元格会把这一列撑爆。
      // 只取开头的方括号标记([弃用]/[空闲]/[客服]…),没有就截断,全文放 title。
      if (!bits.length && p.note) {
        const tag = (String(p.note).match(/^\s*(\[[^\]]{1,8}\])/) || [, ''])[1];
        bits.push(tag || (p.note.length > 22 ? p.note.slice(0, 22) + '…' : p.note));
      }
      return { text: bits.join(' · '), warn, full: p.note || '' };
    }
    function renderList() {
      const tb = document.getElementById('tglist-body'); if (!tb) return;
      const rows = profiles.filter((p) => gcells.has(p.accountIdx) && !csSet.has(p.accountIdx));
      if (!rows.length) { tb.innerHTML = '<tr><td class="empty" colspan="5">没有非客服 Profile</td></tr>'; return; }
      tb.innerHTML = rows.map((p) => {
        const i = p.accountIdx;
        const port = (String(p.proxy || '').match(/:(\d+)\s*$/) || [, ''])[1];
        const info = rowInfo(i, p);
        return '<tr class="row' + (i === drawerIdx ? ' on' : '') + '" data-idx="' + i + '">'
          + '<td class="num">#' + i + '</td>'
          + '<td class="ph">' + esc(phoneOf(p) || '—') + '</td>'
          + '<td class="px">' + esc(port || '—') + '</td>'
          + '<td class="stt">' + statusHtml(i, p) + '</td>'
          + '<td class="info' + (info.warn || loginSay.get(i) ? ' warn' : '') + '" title="' + esc(info.text) + '">'
          + esc(info.text) + '</td>'
          + '</tr>';
      }).join('');
    }
    function refreshRow(idx) {
      const tb = document.getElementById('tglist-body'); if (!tb) return;
      const tr = tb.querySelector('tr.row[data-idx="' + idx + '"]'); if (!tr) return;
      const p = profiles.find((x) => x.accountIdx === idx); if (!p) return;
      const td = tr.querySelector('td.stt'), ti = tr.querySelector('td.info');
      if (td) td.innerHTML = statusHtml(idx, p);
      if (ti) { const info = rowInfo(idx, p); ti.textContent = info.text; ti.title = info.full || info.text;
                ti.classList.toggle('warn', !!info.warn || !!loginSay.get(idx)); }
      tr.classList.toggle('on', idx === drawerIdx);
    }

    function gotoPage(n) { const { maxPage } = pageIdxList(); pageNo = Math.max(0, Math.min(maxPage, n)); applyPage(); }

    // 同一格同一时刻只开一个叠加层(接码 / ping / 加群面板)。
    // 打开后 header 只留当前按钮和关闭键 —— 一排图标全亮着看不出状态,也容易误点。
    // 叠加层(接码 / ping)也用格子内的 webview,不再走主进程的 BrowserView。
    // BrowserView 由主进程按视口坐标贴:面板在后台标签时 syncPreview 一律 visible=false,
    // 浮层就整个不画,而格子(已经是页面内 webview)照样在 —— 表现就是「按钮亮着、浮层不见」。
    function syncOverlay(idx) {
      const g = gcells.get(idx); if (!g) return;
      const want = codeOpen.has(idx) ? 'code' : pingOpen.has(idx) ? 'ping' : '';
      const cur = g.ovKind || '';
      if (want === cur) return;
      if (g.ov) { try { g.ov.remove(); } catch (e) {} g.ov = null; g.ovKind = ''; }
      if (!want) return;
      const p = profiles.find((x) => x.accountIdx === idx);
      let url = want === 'code' ? codeUrlOf(p) : (pingUrl.get(idx) || 'https://ping0.cc/');
      if (!url) { flash('#' + idx + ' 没有接码 URL'); codeOpen.delete(idx); updateCodeButtons(idx); return; }
      // 接码页每次都要拿最新的:分区缓存里可能是上一轮的旧码,甚至旧的「设备已掉线」。
      // 在 URL 上带时间戳,一次请求就是新鲜的,不用打开后再刷一遍(那会撞接码站的限流)。
      if (want === 'code') url += (url.indexOf('?') < 0 ? '?' : '&') + '_ts=' + Date.now();
      const wv = document.createElement('webview');
      // 同 partition = 同代理出口,接码页看到的 IP 和这个号一致
      wv.setAttribute('partition', 'persist:sandbox-' + idx);
      wv.setAttribute('src', url);
      wv.setAttribute('allowpopups', '');
      wv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:flex;background:#fff;z-index:3';
      g.body.style.position = 'relative';
      g.body.appendChild(wv);
      g.ov = wv; g.ovKind = want;
    }

    function syncMode(idx) {
      syncOverlay(idx);
      const g = gcells.get(idx); if (!g) return;
      const mode = codeOpen.has(idx) ? 'code' : pingOpen.has(idx) ? 'ping' : statOpen.has(idx) ? 'stat' : '';
      g.el.classList.toggle('modeon', !!mode);
      const q = (sel) => g.el.querySelector('.ghead .acts ' + sel);
      const map = { code: '.code', ping: '.ping', stat: '.stat' };
      for (const k of Object.keys(map)) { const b = q(map[k]); if (b) b.classList.toggle('on', k === mode); }
    }
    function closeMode(idx) { closeOthers(idx, null); }
    // 只关掉"除了 keep 之外"的叠加层。ping / 接码 有自己的开关函数(closePing / openCode),
    // 这里不碰它们的内部状态,只负责让同一格里同时最多开一个。
    function closeOthers(idx, keep) {
      if (keep !== 'code' && codeOpen.has(idx)) { codeOpen.delete(idx); updateCodeButtons(idx); }
      if (keep !== 'ping' && pingOpen.has(idx)) { try { closePing(idx); } catch (e) { pingOpen.delete(idx); } }
      if (keep !== 'stat' && statOpen.has(idx)) { statOpen.delete(idx); renderStat(idx); }
      syncMode(idx); syncPreview();
    }
    // 加群面板的开关(它没有独立的 open/close 函数,状态就是 statOpen)
    function openMode(idx, mode) {
      const already = statOpen.has(idx);
      closeOthers(idx, null);
      if (already) return false;              // 再点一次 = 关掉
      statOpen.add(idx);
      renderStat(idx); syncMode(idx); syncPreview();
      return true;
    }

    // ── 加群浮层 ────────────────────────────────────────────────
    const TGSOU_API = 'https://tgsou.cicy-ai.com';
    function autoSec() { const v = Number(localStorage.getItem(TGSOU_SEC_KEY)) || 20; return Math.max(5, Math.min(600, v)); }

    // 注入脚本(v1.9.0+)把这些写进了页面标题,这是面板唯一能看到格子内部的通道:
    //   "⏳ 4分47秒 · v1.9.0 · 已加 12/465 · 在群 138 · +573108335085"
    // 「已加 j/n」是脚本**实时**从会话列表读出真群、POST 给 tgsou 对账后的回值 ——
    // 比面板自己问 tgsou 更新,也是 tgsou 那边计数会动的原因(joins 只有这一个写入口)。
    // 标题会**周期性地读不到**:格子每次导航,主进程都会推一条 state,而 applyCellState 里
    // `next.title = state.title || ''` —— 导航途中 getTitle() 是空的,于是版本/已加/手机号
    // 全被抹掉,浮层闪「读不到版本」。这些值是脚本的属性、不是这一瞬间的属性,所以记住最后
    // 一次读到的,标题空了就沿用(限流 ⏳ 例外:那个必须是当下的实时值)。
    const titleCache = new Map();   // idx -> {ver, joined, assigned, live, mobile}
    function titleInfo(idx) {
      const t = String(stateOf(idx).title || '').trim();
      const mj = /已加 (\d+)\/(\d+)/.exec(t);
      const info = {
        t,
        ver: (/v[0-9][0-9.]*/.exec(t) || [''])[0],
        flooding: t.indexOf('⏳') === 0,
        joined: mj ? Number(mj[1]) : null,
        assigned: mj ? Number(mj[2]) : null,
        live: (/在群 (\d+)/.exec(t) || [])[1],
        mobile: (/\+\d{6,}/.exec(t) || [''])[0],
        stale: false,
      };
      if (info.ver) { titleCache.set(idx, { ver: info.ver, joined: info.joined, assigned: info.assigned, live: info.live, mobile: info.mobile }); return info; }
      const c = titleCache.get(idx);
      if (c) { info.ver = c.ver; info.joined = c.joined; info.assigned = c.assigned; info.live = c.live; info.mobile = c.mobile; info.stale = true; }
      return info;
    }
    // 手机号:fleet.json / profile 里那份常年过期,页面里脚本从 Telegram 自己读出来的才是真的。
    function mobileOf(p) { return phoneOf(p) || titleInfo(p.accountIdx).mobile || ''; }

    // 浮层每秒都要刷新(倒计时/计数),但**不能每秒重建 DOM**:按钮被换掉时
    // mousedown 和 mouseup 会落在不同的节点上,click 根本不触发 —— 表现就是
    // 「开一个点了没反应」。所以骨架只建一次、事件只绑一次,每秒只改文字。
    function buildStat(g, idx) {
      g.stat.innerHTML =
        '<div class="l r1"></div>' +
        '<div class="l"><span class="muted">脚本</span><b class="ver"></b><span class="flood"></span></div>' +
        '<div class="l">' +
          '<button class="go auto" data-act="auto"></button>' +
          '<input class="sec" type="number" min="5" max="600" data-act="sec" title="每隔多少秒换一个群">' +
          '<span class="muted">秒</span>' +
          '<button class="go one" data-act="one">开一个</button>' +
        '</div>';
      g.statEls = {
        r1: g.stat.querySelector('.r1'),
        ver: g.stat.querySelector('.ver'),
        flood: g.stat.querySelector('.flood'),
        auto: g.stat.querySelector('.auto'),
        one: g.stat.querySelector('.one'),
        sec: g.stat.querySelector('.sec'),
      };
      g.statEls.sec.value = String(autoSec());
      g.statEls.one.onclick = (ev) => {
        ev.stopPropagation();
        onceAt.set(idx, Date.now());
        setAuto(idx, { once: true });
        renderStat(idx);
      };
      g.statEls.auto.onclick = (ev) => {
        ev.stopPropagation();
        const next = !autoOn.has(idx);
        if (next) autoOn.add(idx); else autoOn.delete(idx);
        setAuto(idx, { on: next, sec: autoSec() });
        renderStat(idx);
        flash('#' + idx + (next ? ' 开始随机开群' : ' 已停止随机开群'));
      };
      g.statEls.sec.onclick = (ev) => ev.stopPropagation();
      g.statEls.sec.onchange = (ev) => {
        const v = Math.max(5, Math.min(600, Number(ev.target.value) || 20));
        ev.target.value = String(v);
        try { localStorage.setItem(TGSOU_SEC_KEY, String(v)); } catch (e) {}
        if (autoOn.has(idx)) setAuto(idx, { sec: v });
      };
    }

    function renderStat(idx) {
      const g = gcells.get(idx); if (!g || !g.stat) return;
      const open = statOpen.has(idx);
      g.stat.hidden = !open;
      if (!open) return;
      if (!g.statEls) buildStat(g, idx);
      const e = g.statEls;
      const p = profiles.find((x) => x.accountIdx === idx);
      const s = autoStats.get(idx);
      const ti = titleInfo(idx);
      const t = ti.t, flooding = ti.flooding, ver = ti.ver;
      // 已加入用脚本实时对账的;分配/剩余以 tgsou 为准 —— 标题里那个分母只是「分配给该号且有
      // 用户名的群」,和 tgsou 按 status=active 算的分配数能差不少(实测 381 vs 465),
      // 混着显示会出现「剩余 440 / 分配 381」这种自相矛盾的数。tgsou 还没回来时才用标题那对。
      const assigned = s ? s.assigned : (ti.assigned != null ? ti.assigned : null);
      const joined = ti.joined != null ? ti.joined : (s ? s.joined : null);
      const remaining = s ? s.remaining : (ti.assigned != null && ti.joined != null ? ti.assigned - ti.joined : null);

      // 第一行没有可点的东西,整块换掉没关系。
      e.r1.innerHTML = assigned != null
        ? ('<span class="muted">分配</span><b>' + assigned + '</b>' +
           '<span class="muted">已加入</span><b class="ok" title="脚本实时从该账号的会话列表读出的真实已加入数">' + (joined == null ? '—' : joined) + '</b>' +
           '<span class="muted">/ ' + assigned + '</span>' +
           '<span class="muted">剩余</span><b>' + (remaining == null ? '—' : remaining) + '</b>' +
           (ti.live ? ('<span class="muted" title="会话列表里有用户名的群/频道总数(含未分配的)">在群 ' + ti.live + '</span>') : ''))
        : (mobileOf(p) ? '<span class="muted">读取中…</span>'
                       : '<span class="muted warn" title="profile 没配手机号,脚本也还没报上来(页面没登录或刚打开)">没有手机号</span>');

      // 读不到 ≠ 没注入:面板够不到格子的 window,只能从 document.title 认版本。
      e.ver.textContent = ver || '读不到版本';
      e.ver.className = ver ? (ti.stale ? 'ver muted' : 'ver') : 'ver warn';
      e.ver.title = ver
        ? (ti.stale ? '标题这一刻是空的(格子正在导航),显示的是上次读到的值' : '')
        : '面板只能从页面标题读版本;脚本没写标题时就读不到(1.7.0 就不写),不代表没注入';
      e.flood.textContent = flooding ? t.replace(/ · v.*$/, '') : '未限流';
      e.flood.className = flooding ? 'flood warn' : 'flood muted';

      const on = autoOn.has(idx);
      e.auto.textContent = on ? '停止随机开群' : '随机开群';
      e.auto.className = 'go auto' + (on ? ' on' : '');
      // 「开一个」是写到 tgsou 的一次性标记,格子里的脚本下次轮询(≤5 秒)才会去开。
      // 不给反馈的话点完看着像没反应,所以这几秒里把按钮改成「已下发…」。
      const sent = Date.now() - (onceAt.get(idx) || 0) < 8000;
      e.one.textContent = sent ? '已下发…' : '开一个';
      e.one.disabled = sent;
      e.one.title = sent ? '已写到 tgsou,格子里的脚本最多 5 秒后开群' : '立刻开一个还没加入的群';
      if (document.activeElement !== e.sec) e.sec.value = String(autoSec());
    }

    async function refreshStat(idx) {
      const p = profiles.find((x) => x.accountIdx === idx); if (!p) return;
      const mob = mobileOf(p); if (!mob) { autoStats.set(idx, null); renderStat(idx); return; }
      try {
        const r = await fetch(TGSOU_API + '/api/random-unjoined?n=0&t=' + TGSOU_TOKEN + '&mobile=' + encodeURIComponent(mob));
        const j = await r.json();
        if (j && j.ok) autoStats.set(idx, { assigned: j.assigned, joined: j.joined, remaining: j.remaining });
      } catch (e) {}
      // 开关在服务端,不在这个页面 —— 刷新页面、换台机器看,状态都一致。
      // peek=1:只看不取,别把「开一个」那个一次性标记吃掉。
      try {
        const a = await (await fetch(TGSOU_API + '/api/autojoin?peek=1&t=' + TGSOU_TOKEN + '&mobile=' + encodeURIComponent(mob))).json();
        if (a && a.ok) { if (a.on) autoOn.add(idx); else autoOn.delete(idx); }
      } catch (e) {}
      renderStat(idx);
    }

    // 开关写到 tgsou(按手机号存),格子里的注入脚本每 10s 来取。
    // **面板不再自己导航格子** —— 面板只能把 URL 交给主进程 loadURL,那是整页重载
    // (先 about:blank 再加载),每 20 秒一次 Telegram 根本初始化不完,格子就是一片白。
    // 换群交给脚本用 Web K 的内部路由(resolveUsername → setInnerPeer)做,零重载。
    async function setAuto(idx, patch) {
      const p = profiles.find((x) => x.accountIdx === idx); if (!p) return;
      const mob = mobileOf(p);
      if (!mob) { flash('#' + idx + ' 没有手机号(profile 里没配,脚本也还没报上来)'); autoOn.delete(idx); renderStat(idx); return; }
      try {
        await fetch(TGSOU_API + '/api/autojoin?t=' + TGSOU_TOKEN, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: mob, ...patch }),
        });
      } catch (e) { flash('#' + idx + ' 写开关失败:' + e.message); }
    }

    // 面板这里只负责显示:换群的节奏(限流等待、间隔)全在格子里的脚本手里。
    let statTick = 0;
    setInterval(() => {
      for (const idx of statOpen) renderStat(idx);                 // 浮层里的倒计时每秒刷新
      // 「剩余」只有 tgsou 知道(要拿分配表和 joins 做差),每 15s 问一次。
      // 脚本那边每 30s 上报一次真实已加入,所以这个数会跟着往下走。
      if (++statTick % 15 === 0) for (const idx of statOpen) refreshStat(idx);
      // 主进程只在有事件时推 state;标题在两次事件之间可能一直是空的,每 10s 主动兜一次底。
      if (statTick % 10 === 0) pullStates();
    }, 1000);

    function renderGridCell(idx) {
      const g = gcells.get(idx); if (!g) return;
      const p = profiles.find((x) => x.accountIdx === idx); const st = stateOf(idx);
      const done = !!p && hasIdentity(p);
      g.el.classList.toggle('done', done);
      g.el.classList.toggle('failed', !!st.failed && !st.loading);
      g.el.querySelector('.dot').className = `dot ${dotClass(st)}`;
      // 平时格子头不显示状态文字;但自动登录跑着的时候要一直看得见走到哪一步,
      // 否则 webview 随便来个 did-stop-loading 就把进度冲掉,界面上看着像"卡死"。
      const _st = g.el.querySelector('.st');
      const _lg = loginSay.get(idx);
      if (_lg) { _st.textContent = _lg; _st.style.color = '#f0a45a'; }
      else { _st.textContent = ''; _st.style.color = ''; }
      renderStat(idx);                              // 浮层里的版本/限流跟着 state.title 走
      updateCodeButtons(idx);
      syncAutoCheck(idx);
      if (listMode()) refreshRow(idx);   // 列表模式下状态也要跟着走
      if (batchMode) { const n = [...batch].filter((i) => { const q = profiles.find((x) => x.accountIdx === i); return q && hasIdentity(q); }).length; gridCount.textContent = `${batch.size} 个会话 · ${n} 已登录`; }
    }
    function enterBatch() {
      // 默认网格 = 平铺全部 profile 的会话(不再只挑未登录的);仍受 BATCH_MAX 上限保护。
      const todo = profiles.slice(0, BATCH_MAX);
      if (!todo.length) { flash('没有 Profile'); return; }
      batch.clear(); gridEl.innerHTML = ''; gcells.clear();
      for (const p of todo) {
        batch.add(p.accountIdx);
        const g = buildGridCell(p); gcells.set(p.accountIdx, g); gridEl.appendChild(g.el);
        renderRowState(p.accountIdx);
      }
