<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="pv" content="932053f6a229">
  <title>Facebook 矩阵</title>
  <style>
    :root { color-scheme: dark; --bg:#0A0A0A; --cell:#141416; --head:#1a1a1c; --line:rgba(255,255,255,.08); --fg:#e6e6e9; --muted:#8b8b92; --accent:#3b82f6; --hover:rgba(255,255,255,.06); font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
    body { display: grid; grid-template-columns: minmax(320px, 34%) 1fr; }
    aside { min-width: 0; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; }
    header { flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
    h1 small { color: var(--muted); font-weight: 500; font-size: 12px; }
    button { border: 0; border-radius: 8px; padding: 7px 12px; color: white; background: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; line-height: 1.2; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: wait; }
    button.ghost { background: var(--head); color: var(--fg); border: 1px solid var(--line); }
    button.sm { padding: 4px 8px; font-size: 12px; }
    .icon { background: transparent; color: #b4b4bb; padding: 3px 6px; font-size: 13px; border-radius: 6px; }
    .icon:hover { background: var(--hover); color: #fff; }
    .list { flex: 1; overflow: auto; padding: 8px; }
    #rows { display: flex; flex-direction: column; gap: 4px; }
    .row { padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
    .row:hover { background: var(--hover); }
    .row.active { background: var(--cell); border-color: rgba(59,130,246,.55); }
    .row.failed .name { color: #ff9e9e; }
    .line1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a40; flex: none; }
    .dot.loading { background: #f0b429; animation: pulse 1s infinite alternate; }
    .dot.ok { background: #3fb950; }
    .dot.failed { background: #ff5c5c; }
    @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
    .name { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .chip { flex: none; padding: 1px 6px; border-radius: 999px; background: var(--head); color: #b4b4bb; font: 11px ui-monospace, monospace; }
    .st { flex: none; color: var(--muted); font-size: 11px; white-space: nowrap; margin-left: auto; }
    .line2 { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-left: 16px; font-size: 11.5px; color: var(--muted); min-width: 0; }
    .line2 .tg { flex: none; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #b4b4bb; }
    .line2 .tg b { color: var(--fg); font-weight: 600; }
    .line2 .tg.none { color: #6b6b72; }
    /* 编辑态就地变成可输入,尺寸/位置与只读态完全一致,不发生位移 */
    .line2 .ip { flex: none; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; border-radius: 999px; background: var(--head); color: #b4b4bb; font: 11px ui-monospace, monospace; line-height: 16px; }
    .line2 .ip.none { display: none; }
    .line2 .phone { flex: none; color: #b4b4bb; font: 11px ui-monospace, monospace; white-space: nowrap; }
    .line2 .phone.none { display: none; }
    button.code { background: #1f6feb; padding: 3px 8px; font-size: 11px; }
    button.code.on { background: #c0142e; }
    .ghead .phone { color: #b4b4bb; font: 11px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    /* 代理设置弹窗 */
    /* 不再是全屏 modal:设置盖在那一格的 webview 上,位置和尺寸跟格子走,
       和接码 overlay 看到的效果一样。其余格子完全不受影响。 */
    .modal { position: fixed; inset: 0; z-index: 60; display: block; background: transparent; pointer-events: none; }
    .modal-card { position: absolute; overflow: auto; pointer-events: auto; }
    .modal[hidden] { display: none; }
    .modal-card { width: 380px; max-width: 92vw; background: var(--cell); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 15px; font-weight: 650; }
    .modal-head .icon { background: transparent; color: #b4b4bb; padding: 2px 6px; font-size: 14px; border-radius: 6px; }
    .modal-head .icon:hover { background: var(--hover); color: #fff; }
    .modal-label { display: block; font-size: 12px; color: var(--muted); margin: 4px 0 6px; }
    .modal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .modal-row input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: #111113; color: var(--fg); font: 12px ui-monospace, monospace; outline: 0; }
    .modal-row input:focus { border-color: var(--accent); }
    .modal-ip { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #b4b4bb; }
    .modal-err { color: #ff8a8a; font-size: 12px; min-height: 16px; margin-bottom: 4px; word-break: break-all; }
    .cfg-info { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; background: #0f0f11; display: flex; flex-direction: column; gap: 4px; }
    .ci-row { display: flex; gap: 12px; font-size: 12px; line-height: 1.65; align-items: baseline; }
    .ci-row .ci-k { flex: none; width: 76px; color: var(--muted); }
    .ci-row .ci-v { flex: 1; min-width: 0; color: var(--fg); word-break: break-all; }
    .ci-row .ci-v .mono { font-family: ui-monospace, monospace; user-select: all; cursor: text; }
    .ci-row .ci-v .muted { color: var(--muted); }
    .ci-b { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .ci-b.ok { background: rgba(63,185,80,.16); color: #7ee787; }
    .ci-b.warn { background: rgba(240,180,41,.16); color: #f0c150; }
    .ci-b.mut { background: var(--line); color: var(--muted); }
    .cfg-info hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
    .fblogin-btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .fblogin-btn:hover { filter: brightness(1.08); }
    .modal-danger { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
    button.del { background: #b3261e; }
    .row-err { padding: 4px 0 0 16px; color: #ff8a8a; font-size: 11px; display: none; }
    .row-err.on { display: block; }
    #empty { display: none; padding: 40px 24px; color: var(--muted); text-align: center; line-height: 1.8; }
    #empty.on { display: block; }
    .hint { flex: none; padding: 8px 16px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
    main { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 14px 18px; background: var(--bg); }
    #preview-title { width: min(410px, calc(100% - 20px)); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #b4b4bb; font-size: 12px; }
    #preview-title .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #selected-name { color: var(--fg); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { color: var(--muted); white-space: nowrap; }
    .actions { display: flex; gap: 6px; flex: none; }
    .actions button { padding: 5px 9px; font-size: 12px; }
    #phone { position: relative; width: min(410px, calc(100% - 20px)); flex: 1 1 auto; min-height: 420px; padding: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 28px; background: var(--cell); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    #phone-preview { width: 100%; height: 100%; overflow: hidden; border-radius: 19px; background: #fff; }
    .overlay { position: absolute; inset: 10px; border-radius: 19px; display: none; place-items: center; text-align: center; padding: 28px; color: var(--fg); background: var(--head); z-index: 2; }
    .overlay.on { display: grid; }
    .overlay h2 { margin: 0 0 8px; font-size: 16px; color: #ff8a8a; }
    .overlay p { margin: 0 0 14px; font-size: 13px; line-height: 1.6; color: var(--muted); word-break: break-all; }
    .overlay code { color: var(--fg); font: 12px ui-monospace, monospace; }
    .overlay .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    /* 批量登录:未登录的会话一次全部铺开(最多 10 格),每格一个独立 BrowserView */
    #grid-title { display: none; width: 100%; margin-bottom: 6px; align-items: center; justify-content: space-between; gap: 8px; color: #b4b4bb; font-size: 12px; }
    #grid-title b { color: var(--fg); font-size: 13px; }
    #grid { display: none; width: 100%; flex: 1 1 auto; min-height: 0; gap: 8px; flex-direction: row; flex-wrap: wrap; align-content: flex-start; overflow-x: hidden; overflow-y: auto; }
    /* 批量模式 = 整页只有 webview:侧栏整个隐藏,顶部一条细工具栏,其余全是格子 */
    body.batch { grid-template-columns: 1fr; }
    body.batch aside { display: none; }
    main.batch { padding: 8px 10px 10px; }
    main.batch #preview-title, main.batch #phone { display: none; }
    main.batch #grid-title { display: flex; }
    main.batch #grid { display: flex; }
    /* 永久网格:去掉非批量(列表+单预览),默认且唯一 = 平铺全部 webview */
    aside { display: none !important; }
    body { grid-template-columns: 1fr !important; }
    main #preview-title, main #phone { display: none !important; }
    main #grid-title { display: flex !important; }
    main #grid { display: flex !important; }
    /* 单格最大化:全屏叠层显示当前 webview(其它 webview detach 保活,不受影响) */
    #maxview { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
    #maxview[hidden] { display: none; }
    .maxhead { flex: none; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .maxhead .name { font-weight: 650; font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .maxhead .chip { flex: none; padding: 1px 6px; border-radius: 999px; background: var(--head); color: #b4b4bb; font: 11px ui-monospace, monospace; }
    .maxhead .minfo { flex: none; display: inline-flex; align-items: center; gap: 5px; max-width: 30vw; padding: 2px 8px; border-radius: 8px; background: var(--head); color: #c9c9d1; font: 11px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .maxhead .minfo:empty { display: none; }
    /* 最大化后的 header 与未最大化的格子头保持一致:不显示名字,
       也不显示手机号 / 接码 URL 那两块信息。这些在 ⚙ 里都能看。 */
    .maxhead .name { display: none; }
    .maxhead .minfo { display: none; }
    .maxhead .minfo b { color: #8a8a93; font-weight: 500; user-select: none; }
    .maxhead .minfo span { color: #e9e9ee; user-select: all; overflow: hidden; text-overflow: ellipsis; }
    .maxhead .sp { flex: 1; }
    .maxhead .acts { flex: none; display: inline-flex; align-items: center; gap: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
    #maxbody { flex: 1 1 auto; min-height: 0; }
    .gcell .pingctl { display: none; }
    .gcell.pinging .pingctl { display: inline-block; }
    .gcell.pinging .code, .gcell.pinging .gear, .gcell.pinging .max { display: none; }
    .gcell { display: flex; flex-direction: column; flex: none; width: 360px; height: 50vh; min-height: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--cell); overflow: hidden; }
    .gcell.done { border-color: rgba(63,185,80,.6); }
    .gcell.failed { border-color: rgba(255,92,92,.6); }
    .ghead { flex: none; height: 30px; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--head); min-width: 0; }
    .ghead .name { font-size: 12px; }
    /* 格子头不显示 profile 名字(只是不显示,profile 本身不动) */
    .ghead .name { display: none; }
    .ghead .st { margin-left: auto; }
    .ghead .acts { flex: none; display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding-left: 8px; }
    /* 格子头 / 最大化头部那一排图标:统一成 24×24 的盒子,里面 14px 的单色线条 SVG。
       之前 ⚙ ⤢ ⟳ 是文本符号、🌐 🔄 是彩色 emoji,两套字体画出来一大一小、一彩一灰。 */
    .ghead .icon, .maxhead .icon { width: 24px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: #b4b4bb; border-radius: 6px; line-height: 1; }
    .ghead .icon svg, .maxhead .icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .ghead .acts { gap: 2px; }
    .ghead button.code { height: 22px; padding: 0 9px; display: inline-flex; align-items: center; }
    /* 上面把 .icon 统一成 inline-flex,会盖掉原来 .pingctl{display:none} —— 🔄 ✕ 只在
       ping 叠加层开着时才出现,这里把优先级补回来。 */
    .ghead .icon.pingctl { display: none; }
    .gcell.pinging .ghead .icon.pingctl { display: inline-flex; }
    .ghead .st ~ .acts { margin-left: 8px; }
    .gcell.done .ghead .st { color: #3fb950; font-weight: 600; }
    /* 打开弹窗时主进程会把所有格子视图摘下来(BrowserView 永远盖在 DOM 之上,
       不摘弹窗就看不见),露出来的就是这块占位。底色留白的话整屏变白板,
       看着像坏了 —— 改成和格子同色。视图贴回来后会盖住它,不影响显示。 */
    .gbody { flex: 1 1 auto; min-height: 0; width: 100%; background: var(--cell); }
    #grid-empty { grid-column: 1 / -1; display: grid; place-items: center; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Facebook 矩阵:接码/手机号是 Telegram 专属,这里隐藏 */
    button.code, .line2 .phone, .ghead .phone, #cfg-login, #open-code { display: none !important; }
    /* 机器 id 徽章:机器多了一眼认出这是哪台。列表/批量两种模式都显示。 */
    .mid{display:inline-block;margin-right:8px;padding:2px 9px;border-radius:7px;font:700 13px ui-monospace,monospace;
         background:#1f6feb;color:#fff;letter-spacing:.5px;vertical-align:middle;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  </style>
</head>
<body>
  <aside>
    <header>
      <h1><span id="mid-list" class="mid" hidden></span>Facebook 矩阵 <small id="count"></small></h1>
      <div class="actions"><button id="add-profile" title="新建一个独立会话（persist:sandbox-N）">+ 添加 Profile</button></div>
    </header>
    <div class="list">
      <div id="rows"></div>
      <div id="empty">还没有 Profile<br>点击右上角「添加 Profile」创建第一个 Facebook 会话</div>
    </div>
    <div class="hint">点击行切换预览；点 ⚙ 设置代理 / 测 IP / 删除。已打开过的会话会在后台保持登录。</div>
  </aside>
  <main>
    <div id="grid-title">
      <div class="left"><span id="mid-batch" class="mid" hidden></span><b>批量登录</b><span id="grid-count"></span></div>
      <div class="actions"><button class="ghost" id="grid-reload" title="重新加载所有格子">全部重载</button></div>
    </div>
    <div id="grid"></div>
    <div id="preview-title">
      <div class="left"><span class="dot" id="sel-dot"></span><span id="selected-name">未选择 Profile</span><span id="status"></span></div>
      <div class="actions"><button class="code" id="open-code" title="在格子上叠加/关闭接码 webview(同代理出口)">接码</button><button class="ghost" id="probe-ip" title="经该 Profile 的代理探测出口 IP / 地区">测 IP</button><button class="ghost" id="reload" title="重新加载 Facebook">重新加载</button></div>
    </div>
    <div id="phone">
      <div id="phone-preview"></div>
      <div class="overlay on" id="ov-empty"><div>选择左侧一个 Profile 预览 Facebook</div></div>
      <div class="overlay" id="ov-loading"><div><div class="spinner"></div><div>正在加载 Facebook…</div></div></div>
      <div class="overlay" id="ov-error">
        <div>
          <h2>无法连接 Facebook</h2>
          <p id="err-detail"></p>
          <div class="btns"><button id="err-retry">重试</button><button class="ghost" id="err-cfg">代理设置</button></div>
        </div>
      </div>
    </div>
  </main>
  <div id="maxview" hidden><div class="maxhead"><span class="dot" id="max-dot"></span><span class="name" id="max-name"></span><span class="chip" id="max-chip"></span><span class="minfo" id="max-acct"></span><span class="sp"></span><span class="acts"><button class="icon" id="max-gear" title="Profile 信息 / 设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="icon" id="max-ping" title="ipcheck 出口 IP"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button><button class="icon" id="max-reload" title="重新加载"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button><button class="ghost" id="max-restore">还原</button></span></div><div id="maxbody"></div></div>
  <div id="cfg-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="cfg-title">Profile 设置</span><button class="icon" id="cfg-x" title="关闭">✕</button></div>
      <div class="cfg-info" id="cfg-info"></div>
      <div id="cfg-login">
      <label class="modal-label">手机号</label>
      <div class="modal-row"><input id="cfg-phone" placeholder="+8801700000000" spellcheck="false"></div>
      <label class="modal-label">接码 URL</label>
      <div class="modal-row"><input id="cfg-code" placeholder="https://…/getcode?id=…" spellcheck="false"><button class="ghost" id="cfg-code-open" title="在该 Profile 的 tab 里打开">打开</button></div>
      </div>
      <label class="modal-label">账号资料（存在本机浏览器，不写文件）</label>
      <div class="modal-row"><input id="cred-pwd" placeholder="FB 密码" spellcheck="false"></div>
      <div class="modal-row"><input id="cred-twofa" placeholder="2FA 密钥" spellcheck="false"></div>
      <div class="modal-row"><input id="cred-email" placeholder="邮箱" spellcheck="false"></div>
      <div class="modal-row"><input id="cred-mailpwd" placeholder="邮箱密码" spellcheck="false"></div>
      <div class="modal-row"><input id="cred-second" placeholder="备用邮箱" spellcheck="false"></div>
      <label class="modal-label">代理地址</label>
      <div class="modal-row"><input id="cfg-proxy" placeholder="留空 = 直连，例如 http://127.0.0.1:20001" spellcheck="false"><button id="cfg-save">保存</button></div>
      <div class="modal-row"><button class="ghost" id="cfg-test">测 IP</button><span class="modal-ip" id="cfg-ip"></span></div>
      <div class="modal-err" id="cfg-err"></div>
      <div class="modal-danger"><button class="ghost del" id="cfg-del">删除此 Profile</button></div>
    </div>
  </div>
  <script>
    const SITE_URL = 'https://www.facebook.com/';
    const rowsEl = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const addButton = document.getElementById('add-profile');
    const preview = document.getElementById('phone-preview');
    const selectedName = document.getElementById('selected-name');
    const selDot = document.getElementById('sel-dot');
    const statusEl = document.getElementById('status');
    const ov = { empty: document.getElementById('ov-empty'), loading: document.getElementById('ov-loading'), error: document.getElementById('ov-error') };
    const errDetail = document.getElementById('err-detail');
    let profiles = [];
    let selected = null;
    const openedProfiles = new Set();   // 打开过的会话保留在后台(登录态不丢),只有选中的贴到预览区
    const codeOpen = new Set(); const pingOpen = new Set(); const pingUrl = new Map();          // 已叠开接码 overlay 的 accountIdx(同 partition 的接码 webview 覆盖在格子上)
    const cellState = new Map();        // accountIdx -> { loading, failed, error, url, title }
    const rows = new Map();             // accountIdx -> row element
    const BATCH_MAX = 10;               // 一次最多铺开多少个登录格
    const mainEl = document.querySelector('main');
    const gridEl = document.getElementById('grid');
    const gridCount = document.getElementById('grid-count');
    let batchMode = false;
    let maxedIdx = null;
    const batch = new Set();            // 批量模式下铺开的 accountIdx
    const gcells = new Map();           // accountIdx -> { el, body }

    const esc = (value) => String(value || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    // 机器 id:app 打开面板时把本机 id 拼进 URL(?team=xs-3007)。两处徽章都填上。
    (function(){ try {
      const t = new URLSearchParams(location.search).get('team');
      if (t) for (const id of ['mid-list','mid-batch']) {
        const el = document.getElementById(id); if (el) { el.textContent = t; el.hidden = false; el.title = '本机: ' + t; }
      }
      if (t) document.title = t + ' · Facebook 矩阵';
    } catch (e) {} })();
    const cellId = (idx) => `facebook-preview-${idx}`;
    const stateOf = (idx) => cellState.get(Number(idx)) || {};
    const dotClass = (st) => st.loading ? 'loading' : st.failed ? 'failed' : (st.url ? 'ok' : '');
    const stateText = (st, opened) => st.loading ? '加载中…' : st.failed ? '连接失败' : st.url ? '已加载' : (opened ? '' : '未打开');
    const fmtAgo = (iso) => { const t = Date.parse(iso || ''); if (!t) return ''; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? '刚刚' : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`; };
    // 列表只显示一个简短地区(取最具体的一段:优先省/州,否则国家),完整信息在 tooltip。
    const shortArea = (area) => { const seg = String(area || '').split('·').map((x) => x.trim()).filter(Boolean); return seg[1] || seg[0] || ''; };
    function renderIp(p) {
      const row = rows.get(p.accountIdx); if (!row) return;
      const el = row.querySelector('.ip'); el.className = 'ip';
      const info = p.ipInfo;
      if (info && info.ip) {
        const a = shortArea(info.area);
        el.textContent = a || info.ip;
        el.title = `出口 IP ${info.ip}${info.area ? '，' + info.area : ''}，${fmtAgo(info.probedAt) || '未知时间'}探测`;
      } else { el.classList.add('none'); el.textContent = ''; el.title = ''; }
    }
    // 经该 Profile 的代理探测出口 IP;成功后更新它的列表地区。返回 {ok, info|error}。
    async function probeIp(p) {
      try {
        const r = await window.panelAPI.probeIp(p.accountIdx);
        if (r && r.ipInfo) { p.ipInfo = r.ipInfo; renderIp(p); return { ok: true, info: r.ipInfo }; }
        return { ok: false, error: (r && r.error) || '探测失败' };
      } catch (e) { return { ok: false, error: e.message || String(e) }; }
    }
    // 身份:优先用本次会话探到的(cellState.identity),否则用 profile 里存的(上次登录)。
    const identityOf = (p) => stateOf(p.accountIdx).identity || p.facebook || null;
    const phoneOf = (p) => (p.login && p.login.phone) || '';
    const codeUrlOf = (p) => (p.login && p.login.codeUrl) || '';
    function renderPhone(p) {
      const row = rows.get(p.accountIdx); if (!row) return;
      const el = row.querySelector('.phone'); const ph = phoneOf(p);
      el.classList.toggle('none', !ph); el.textContent = ph; el.title = codeUrlOf(p) ? `接码：${codeUrlOf(p)}` : '';
      const g = gcells.get(p.accountIdx); if (g) { g.el.querySelector('.phone').textContent = ph; g.el.querySelector('.code').disabled = !codeUrlOf(p); }
    }
    // 接码 = 在当前格子的 Telegram webview 上方叠一个同尺寸、同 partition(persist:sandbox-idx,
    // 走该 profile 的代理出口)、更高 z 层的接码 webview。再点一次关闭。与 tg-autologin 自动化里
    // 的 overlay 完全一致的呈现,只是重载/关闭放在格子 header(BrowserView 之上无法放页面按钮)。
    function openCode(p) {
      if (!codeUrlOf(p)) { flash(`#${p.accountIdx} 还没有接码 URL,点 ⚙ 填写`, 4000); return; }
      if (!openedProfiles.has(p.accountIdx)) { openedProfiles.add(p.accountIdx); cellState.set(p.accountIdx, { loading: true }); }
      if (codeOpen.has(p.accountIdx)) { codeOpen.delete(p.accountIdx); flash(`#${p.accountIdx} 已关闭接码`); }
      else { codeOpen.add(p.accountIdx); flash(`#${p.accountIdx} 接码已叠加在格子上`); }
      updateCodeButtons(p.accountIdx);
      syncPreview();
    }
    function updateCodeButtons(idx) {
      const on = codeOpen.has(idx);
      const g = gcells.get(idx);
      if (g) { const b = g.el.querySelector('.code'); if (b) { b.classList.toggle('on', on); b.textContent = on ? '关闭接码' : '接码'; } }
      if (selected && selected.accountIdx === idx) { const b = document.getElementById('open-code'); if (b) { b.classList.toggle('on', on); b.textContent = on ? '关闭接码' : '接码'; } }
    }
    function renderIdentity(p) {
      renderPhone(p);
      const row = rows.get(p.accountIdx); if (!row) return;
      const el = row.querySelector('.tg');
      const it = identityOf(p);
      if (it && (it.username || it.displayName || it.phone)) {
        el.classList.remove('none');
        el.innerHTML = (it.username ? `<b>@${esc(it.username)}</b>` : '') + (it.displayName ? `${it.username ? ' · ' : ''}${esc(it.displayName)}` : '') + (!it.username && !it.displayName && it.phone ? `+${esc(it.phone)}` : '');
        el.title = [it.username && `@${it.username}`, it.displayName, it.phone && `+${it.phone}`].filter(Boolean).join('  ');
      } else {
        el.classList.add('none');
        el.textContent = openedProfiles.has(p.accountIdx) && stateOf(p.accountIdx).url ? '未登录' : '—';
        el.title = '';
      }
    }

    function flash(text, ms = 2500) {
      statusEl.textContent = text; statusEl.dataset.sticky = '1';
      clearTimeout(flash.t);
      flash.t = setTimeout(() => { delete statusEl.dataset.sticky; renderPreviewState(); }, ms);
    }

    function syncPreview() {
      if (!window.panelAPI) return;
      const rect = preview.getBoundingClientRect();
      const mv = document.getElementById('maxview'); if (mv) mv.hidden = (maxedIdx == null);
      const box = (r) => ({ x: r.x, y: r.y, w: r.width, h: r.height });
      // 设置弹窗打开时:只让被"弹窗卡片"盖住的格子让位(detach),其余 webview 保持显示 —— 方便对照。
      const cardEl = (cfgModal && !cfgModal.hidden) ? document.querySelector('.modal-card') : null;
      const cardR = cardEl ? cardEl.getBoundingClientRect() : null;
      const hitsCard = (r) => !!(cardR && r && !(r.x + r.w <= cardR.left || r.x >= cardR.right || r.y + r.h <= cardR.top || r.y >= cardR.bottom));
      // 面板在后台标签里时,一格都不显示。
      // 同一台机器可能开着多个矩阵面板,各自的格子坐标是一样的,后台那份会原样贴在
      // 前台那份上面:前台开弹窗只让自己的格子让位,后台的照样盖住弹窗(实测 2026-09-11,
      // xs-1001 上两组 6 格叠在同一批坐标上)。visible:false 只是不画,会话照常活着,保活不受影响。
      const __bg = document.hidden;
      if (cfgModal && !cfgModal.hidden && cfgP) placeCfgOverCell(cfgP);
      const cells = []; const overlays = [];
      for (const profileId of openedProfiles) {
        let visible = false, r = null;
        if (maxedIdx != null) {
          if (profileId === maxedIdx) { visible = true; r = box(document.getElementById('maxbody').getBoundingClientRect()); }
        } else if (batchMode) {
          const g = gcells.get(profileId);
          if (g && batch.has(profileId)) { visible = true; r = box(g.body.getBoundingClientRect()); }
        } else if (selected && profileId === selected.accountIdx) { visible = true; r = box(rect); }
        if (__bg) visible = false;                    // 后台标签:不画,但会话留着
        if (visible && hitsCard(r)) visible = false;  // 被弹窗盖住 → 临时 detach
        cells.push({ id: cellId(profileId), url: SITE_URL, profile: profileId, visible, rect: r });
        // 接码叠加层:同 rect、同 profile(=同 partition/代理),排在 tg 格子之后 → attach 更晚 → 叠最上层
        if (visible && codeOpen.has(profileId)) {
          const p = profiles.find((x) => x.accountIdx === profileId); const cu = p && codeUrlOf(p);
          if (cu) overlays.push({ id: 'code-' + profileId, url: cu, profile: profileId, visible: true, rect: r });
        }
        if (visible && pingOpen.has(profileId)) overlays.push({ id: 'ping-' + profileId, url: (pingUrl.get(profileId) || 'https://ping0.cc/'), profile: profileId, visible: true, rect: r });
      }
      try { window.panelAPI.sync(cells.concat(overlays)); } catch (e) {}
    }

    function describeError(p, st) {
      const e = st.error || {};
      const desc = e.description ? `<code>${esc(e.description)}</code>` : '';
      if (p.proxy) return `代理 <code>${esc(p.proxy)}</code> 不可用或无法访问 Facebook。${desc}<br>点 ⚙ 检查或更换该 Profile 的代理，可用「测 IP」验证。`;
      return `当前为直连，网络无法访问 Facebook。${desc}<br>点 ⚙ 为该 Profile 设置代理。`;
    }

    function renderPreviewState() {
      const st = selected ? stateOf(selected.accountIdx) : {};
      ov.empty.classList.toggle('on', !selected);
      ov.loading.classList.toggle('on', !!selected && !!st.loading && !st.url);
      ov.error.classList.toggle('on', !!selected && !st.loading && !!st.failed);
      if (selected && st.failed) errDetail.innerHTML = describeError(selected, st);
      selDot.className = `dot ${selected ? dotClass(st) : ''}`;
      if (selected && !statusEl.dataset.sticky) statusEl.textContent = stateText(st, true);
      if (selected) updateCodeButtons(selected.accountIdx);
    }

    function renderRowState(idx) {
      const row = rows.get(idx); if (!row) return;
      const st = stateOf(idx);
      row.classList.toggle('failed', !!st.failed && !st.loading);
      row.querySelector('.dot').className = `dot ${dotClass(st)}`;
      row.querySelector('.st').textContent = stateText(st, openedProfiles.has(idx));
      renderGridCell(idx);
    }

    // ── 批量登录:把未登录的 Profile 一次全部铺开 ──
    const hasIdentity = (p) => { const it = identityOf(p); return !!(it && (it.username || it.displayName || it.phone)); };
    const gridCols = (n) => n <= 1 ? 1 : n <= 4 ? 2 : n <= 6 ? 3 : n <= 8 ? 4 : 5;
    function buildGridCell(p) {
      const el = document.createElement('div');
      el.className = 'gcell'; el.dataset.id = String(p.accountIdx);
      el.innerHTML = `<div class="ghead"><span class="dot"></span><span class="name">${esc(p.name)}</span><span class="chip">#${p.accountIdx}</span><span class="phone">${esc(phoneOf(p))}</span><span class="st"></span><span class="acts"><button class="code" title="在格子上叠加/关闭接码 webview(同代理出口)">接码</button><button class="icon gear" title="Profile 信息 / 代理设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="icon ping" title="用本 Profile 代理打开 ping0.cc(验 IP/指纹)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button><button class="icon pingctl reloadping" title="重载 ping0"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button><button class="icon pingctl closeping" title="关闭 ping0"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><button class="icon max" title="最大化 / 还原"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button><button class="icon reload" title="重新加载"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button></span></div><div class="gbody"></div>`;
      el.querySelector('.gear').onclick = (e) => { e.stopPropagation(); openCfgModal(p); };
      el.querySelector('.reload').onclick = () => reloadProfile(p.accountIdx);
      el.querySelector('.max').onclick = (e) => { e.stopPropagation(); toggleMax(p.accountIdx); };
      el.querySelector('.ping').onclick = (e) => { e.stopPropagation(); togglePing(p.accountIdx); };
      el.querySelector('.reloadping').onclick = (e) => { e.stopPropagation(); reloadPing(p.accountIdx); };
      el.querySelector('.closeping').onclick = (e) => { e.stopPropagation(); closePing(p.accountIdx); };
      el.querySelector('.code').onclick = () => openCode(p);
      el.querySelector('.code').disabled = !codeUrlOf(p);
      el.querySelector('.ghead').onclick = (e) => { if (!e.target.closest('button')) { selectProfile(p.accountIdx); } };
      return { el, body: el.querySelector('.gbody') };
    }
    function renderGridCell(idx) {
      const g = gcells.get(idx); if (!g) return;
      const p = profiles.find((x) => x.accountIdx === idx); const st = stateOf(idx);
      const done = !!p && hasIdentity(p);
      g.el.classList.toggle('done', done);
      g.el.classList.toggle('failed', !!st.failed && !st.loading);
      g.el.querySelector('.dot').className = `dot ${dotClass(st)}`;
      g.el.querySelector('.st').textContent = '';   // 格子头不显示状态文字
      updateCodeButtons(idx);
      if (batchMode) { const n = [...batch].filter((i) => { const q = profiles.find((x) => x.accountIdx === i); return q && hasIdentity(q); }).length; gridCount.textContent = `${batch.size} 个会话 · ${n} 已登录`; }
    }
    function enterBatch() {
      // 默认网格 = 只平铺“配置了 FB 账号(有 facebook 绑定)”的 profile,未配置的隐藏。
      const todo = profiles.filter((p) => p.facebook).slice(0, BATCH_MAX);
      if (!todo.length) { flash('本机没有配置 FB 账号的 Profile'); return; }
      batch.clear(); gridEl.innerHTML = ''; gcells.clear();
      for (const p of todo) {
        batch.add(p.accountIdx);
        const g = buildGridCell(p); gcells.set(p.accountIdx, g); gridEl.appendChild(g.el);
        if (!openedProfiles.has(p.accountIdx)) { openedProfiles.add(p.accountIdx); cellState.set(p.accountIdx, { loading: true }); }
        renderRowState(p.accountIdx);
      }
      gridEl.style.gridTemplateColumns = `repeat(${gridCols(todo.length)}, minmax(0, 1fr))`;
      batchMode = true; mainEl.classList.add('batch'); document.body.classList.add('batch');
      render();
      syncPreview();                       // 后台 tab 里 rAF 不会触发,先直接同步一次把格子建出来
      requestAnimationFrame(syncPreview);
      setTimeout(pullStates, 300);
    }
    function exitBatch() {
      if (!batchMode) return;
      batchMode = false; mainEl.classList.remove('batch'); document.body.classList.remove('batch');
      batch.clear(); gcells.clear(); gridEl.innerHTML = '';
      render(); renderPreviewState(); syncPreview();   // 会话留在后台,登录态不丢
    }
    document.getElementById('grid-reload').onclick = () => { if (!batch.size) { enterBatch(); return; } for (const idx of batch) reloadProfile(idx); };
    function toggleMax(idx) {
      maxedIdx = (maxedIdx === idx) ? null : idx;
      renderMaxHead();
      syncPreview();
    }
    // 最大化顶栏:恢复完整 action bar,并把当前绑定的 FB 账号直接摊在栏上(⚙ 看完整信息)。
    function renderMaxHead() {
      if (maxedIdx == null) return;
      const p = profiles.find((x) => x.accountIdx === maxedIdx); if (!p) return;
      document.getElementById('max-dot').className = `dot ${dotClass(stateOf(maxedIdx))}`;
      document.getElementById('max-name').textContent = p.name;
      document.getElementById('max-chip').textContent = '#' + p.accountIdx;
      const acct = (p.facebook && p.facebook.id) || '';
      const ael = document.getElementById('max-acct'); ael.innerHTML = acct ? `<b>FB</b><span>${esc(acct)}</span>` : ''; ael.title = acct || '';
    }
    document.getElementById('max-restore').onclick = () => { maxedIdx = null; syncPreview(); };
    document.getElementById('max-gear').onclick = () => { if (maxedIdx != null) { const p = profiles.find((x) => x.accountIdx === maxedIdx); if (p) openCfgModal(p); } };
    document.getElementById('max-ping').onclick = () => { if (maxedIdx != null) togglePing(maxedIdx); };
    document.getElementById('max-reload').onclick = () => { if (maxedIdx != null) reloadProfile(maxedIdx); };
    async function togglePing(idx) {
      if (pingOpen.has(idx)) { closePing(idx); return; }
      const cp = profiles.find((x) => x.accountIdx === idx);
      const IPCHECK = location.href.split('/panel/')[0] + '/panel/ipcheck.html';
      let ip = cp && cp.ipInfo && cp.ipInfo.ip;
      // overlay 立刻打开(全程 UI 可见):ipcheck 页自己经本 Profile 代理读浏览器真实出口 IP + 查 ping0。
      pingUrl.set(idx, IPCHECK + '?idx=' + idx + (ip ? '&proxyip=' + encodeURIComponent(ip) : ''));
      pingOpen.add(idx);
      const g = gcells.get(idx); if (g) g.el.classList.add('pinging');
      syncPreview();
      // 缓存只作即时占位,随后无论有无缓存都现场重探一次:住宅代理 sticky 出口会轮换,
      // 缓存过期会与浏览器真实出口不一致(误报“不一致”)。每次开 🌐 都刷新“代理探测出口”。
      try {
        const r = await window.panelAPI.probeIp(idx);
        if (r && r.ipInfo && r.ipInfo.ip && pingOpen.has(idx)) { if (cp) cp.ipInfo = r.ipInfo; pingUrl.set(idx, IPCHECK + '?idx=' + idx + '&proxyip=' + encodeURIComponent(r.ipInfo.ip)); syncPreview(); }
      } catch (e) {}
    }
    function reloadPing(idx) { if (!pingOpen.has(idx)) return; const base = (pingUrl.get(idx) || 'https://ping0.cc/').split('?_r=')[0]; pingUrl.set(idx, base + (base.indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now()); syncPreview(); }
    function closePing(idx) { pingOpen.delete(idx); pingUrl.delete(idx); const g = gcells.get(idx); if (g) g.el.classList.remove('pinging'); syncPreview(); }
    new ResizeObserver(() => requestAnimationFrame(syncPreview)).observe(gridEl);

    function buildRow(p) {
      const row = document.createElement('div');
      row.className = 'row'; row.dataset.id = String(p.accountIdx); row.title = `persist:sandbox-${p.accountIdx}`;
      row.innerHTML = `
        <div class="line1"><span class="dot"></span><span class="name">${esc(p.name)}</span><span class="chip">#${p.accountIdx}</span><span class="st"></span><button class="icon gear" title="代理设置">⚙</button><button class="icon reload" title="重新加载">⟳</button></div>
        <div class="line2"><span class="tg none">—</span><span class="phone none"></span><span class="ip none"></span></div>`;
      // ⚙ 打开设置弹窗(代理 / 测 IP / 删除),不再 inline。
      row.querySelector('.gear').onclick = (e) => { e.stopPropagation(); openCfgModal(p); };
      row.onclick = () => { selectProfile(p.accountIdx); };
      row.querySelector('.reload').onclick = (e) => { e.stopPropagation(); reloadProfile(p.accountIdx); };
      return row;
    }

    function reloadProfile(idx) {
      // 接码 overlay 开着时,重载指向接码 webview(用户看到的最上层就是它)
      if (codeOpen.has(idx)) { try { window.panelAPI.reload('code-' + idx); } catch (e) {} return; }
      const fresh = !openedProfiles.has(idx);
      openedProfiles.add(idx);
      cellState.set(idx, { loading: true }); renderRowState(idx);
      if (selected && selected.accountIdx === idx) renderPreviewState();
      syncPreview();
      // 首次打开:上面的 sync() 已经会建视图并加载 URL,再 reload 只是白加载一次。
      if (!fresh) { try { window.panelAPI.reload(cellId(idx)); } catch (e) {} }
    }

    function render() {
      empty.classList.toggle('on', profiles.length === 0);
      countEl.textContent = profiles.length ? `${profiles.length} 个会话` : '';
      for (const p of profiles) {
        if (!rows.has(p.accountIdx)) { const row = buildRow(p); rows.set(p.accountIdx, row); rowsEl.appendChild(row); }
        rows.get(p.accountIdx).classList.toggle('active', !!selected && selected.accountIdx === p.accountIdx);
        renderRowState(p.accountIdx);
        renderIdentity(p);
        renderIp(p);
      }
    }

    function selectProfile(accountIdx) {
      selected = profiles.find((p) => p.accountIdx === Number(accountIdx)) || null;
      if (selected) { openedProfiles.add(selected.accountIdx); localStorage.setItem('facebook-matrix-profile', String(selected.accountIdx)); }
      selectedName.textContent = selected ? `${selected.name} · #${selected.accountIdx}` : '未选择 Profile';
      selectedName.title = selected ? `persist:sandbox-${selected.accountIdx}` : '';
      delete statusEl.dataset.sticky;
      render();
      renderPreviewState();
      syncPreview();
      if (selected && !cellState.has(selected.accountIdx)) setTimeout(pullStates, 300);
    }

    function applyCellState(state) {
      const m = /^facebook-preview-(\d+)$/.exec(state.id || '');
      if (!m) return;
      const idx = Number(m[1]);
      const prev = stateOf(idx);
      const failed = !!state.failed || /^chrome-error:/.test(state.url || '');
      const next = { ...prev, loading: !!state.loading };
      if (state.url !== undefined) { next.url = failed ? '' : state.url; next.title = state.title || ''; }
      if (!state.loading) { next.failed = failed; next.error = state.error || (failed ? prev.error : null); }
      if (state.identity) next.identity = state.identity;
      cellState.set(idx, next);
      renderRowState(idx);
      { const p = profiles.find((x) => x.accountIdx === idx); if (p) renderIdentity(p); }
      renderGridCell(idx);
      if (selected && selected.accountIdx === idx) renderPreviewState();
    }
    async function pullStates({ adopt = false } = {}) {
      let list = [];
      try { list = await window.panelAPI.states(); } catch (e) { return; }
      for (const st of list || []) {
        // 面板页刷新后 openedProfiles 是空的,而主进程里那些会话视图还活着。
        // 不先认领回来,第一次 syncPreview() 就会把它们当多余格子销毁,后台
        // 登录着的会话全没(实测:刷新后 #1 的 webContents 被销毁)。
        if (adopt) {
          const m = /^facebook-preview-(\d+)$/.exec(st.id || '');
          if (m) openedProfiles.add(Number(m[1]));
        }
        applyCellState(st);
      }
    }

    async function loadProfiles(preferredId) {
      profiles = await window.panelAPI.profiles();
      profiles.sort((a, b) => a.accountIdx - b.accountIdx);
      const remembered = Number(localStorage.getItem('facebook-matrix-profile'));
      const target = preferredId || (profiles.some((p) => p.accountIdx === remembered) ? remembered : 0) || (profiles[0] && profiles[0].accountIdx);
      selectProfile(target);
    }

    async function removeProfile(p) {
      const idx = p.accountIdx;
      await window.panelAPI.removeProfile(idx);
      openedProfiles.delete(idx); cellState.delete(idx);
      const row = rows.get(idx); if (row) row.remove(); rows.delete(idx);
      profiles = profiles.filter((x) => x.accountIdx !== idx);
      if (selected && selected.accountIdx === idx) {
        const next = profiles[0] ? profiles[0].accountIdx : 0;
        if (next) selectProfile(next); else { selected = null; localStorage.removeItem('facebook-matrix-profile'); selectedName.textContent = '未选择 Profile'; render(); renderPreviewState(); syncPreview(); }
      } else render();
      flash(`Profile #${idx} 已删除`);
    }

    addButton.onclick = async () => {
      addButton.disabled = true; flash('正在创建…', 60000);
      try {
        const profile = await window.panelAPI.addProfile();
        await loadProfiles(profile.accountIdx);
        flash(`Profile #${profile.accountIdx} 已创建`);
        const row = rows.get(profile.accountIdx); if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (e) { flash(e.message || String(e), 6000); }
      finally { addButton.disabled = false; }
    };
    document.getElementById('reload').onclick = () => { if (selected) reloadProfile(selected.accountIdx); };
    document.getElementById('open-code').onclick = () => { if (selected) openCode(selected); };
    document.getElementById('err-retry').onclick = () => { if (selected) reloadProfile(selected.accountIdx); };
    document.getElementById('err-cfg').onclick = () => { if (selected) openCfgModal(selected); };
    document.getElementById('probe-ip').onclick = async () => {
      if (!selected) { flash('先选择一个 Profile'); return; }
      const b = document.getElementById('probe-ip'); const o = b.textContent; b.disabled = true; b.textContent = '测 IP…';
      const r = await probeIp(selected);
      b.disabled = false; b.textContent = o;
      flash(r.ok ? `#${selected.accountIdx} 出口：${shortArea(selected.ipInfo.area) || selected.ipInfo.ip}` : `IP 探测失败：${r.error}`, 6000);
    };
    // ── 设置弹窗(代理 / 测 IP / 删除) ──
    const cfgModal = document.getElementById('cfg-modal');
    const cfgProxy = document.getElementById('cfg-proxy');
    const cfgErr = document.getElementById('cfg-err');
    const cfgIp = document.getElementById('cfg-ip');
    const cfgDel = document.getElementById('cfg-del');
    let cfgP = null, delArmed = false;
    const cfgPhone = document.getElementById('cfg-phone');
    const cfgCode = document.getElementById('cfg-code');
    document.getElementById('cfg-code-open').onclick = () => { if (cfgP) openCode({ ...cfgP, login: { phone: cfgPhone.value, codeUrl: cfgCode.value.trim() } }); };
    // 账号资料(密码 / 2FA / 邮箱 / 邮箱密码 / 备用邮箱)存在浏览器本地,不写文件。
    // 原来这些只能从 logins[].note 那个备注串里解析,而身份识别每次加载都会把 note
    // 覆盖成抓到的真实昵称,于是一台台丢光(实测:全队 19 个 FB profile 只剩 2 个还留着)。
    // localStorage 按「机器 + profile 编号」存,身份识别碰不到它。
    const CRED_KEYS = ['pwd', 'twofa', 'email', 'mailpwd', 'second'];
    const credKey = (idx) => 'fbcred:' + (new URLSearchParams(location.search).get('team') || 'local') + ':' + idx;
    function readCred(idx) {
      try { return JSON.parse(localStorage.getItem(credKey(idx)) || '{}') || {}; } catch (e) { return {}; }
    }
    // 台账才是源头:social-hub 的 fb_accounts 按 home_host + home_idx 下发到每一格,
    // 密码 / 邮箱密码 / 2FA / 辅助邮箱都在那里。服务端按机器真实 IP 校验,只给它自己那份。
    // 拉到就缓存进 localStorage,离线或接口不通时仍然看得到。
    async function pullCred(idx) {
      const team = new URLSearchParams(location.search).get('team') || '';
      if (!team) return null;
      try {
        const r = await fetch(`/api/fbcred?team=${encodeURIComponent(team)}&idx=${idx}`, { cache: 'no-store' });
        if (!r.ok) return null;
        const a = await r.json();
        if (!a || a.error || !Object.keys(a).length) return null;
        const c = {
          pwd: String(a.fb_password || ''), twofa: String(a.twofa || ''),
          email: String(a.email || ''), mailpwd: String(a.email_password || ''),
          second: String(a.recovery || ''),
        };
        writeCred(idx, c);
        return c;
      } catch (e) { return null; }
    }
    function writeCred(idx, obj) {
      try {
        const cur = readCred(idx);
        for (const k of CRED_KEYS) if (obj[k] !== undefined) cur[k] = String(obj[k] || '');
        localStorage.setItem(credKey(idx), JSON.stringify(cur));
        return true;
      } catch (e) { return false; }
    }
    const cfgIpText = (p) => p && p.ipInfo && p.ipInfo.ip ? (p.ipInfo.area ? `${p.ipInfo.area} · ${p.ipInfo.ip}` : p.ipInfo.ip) : '未探测';
    // 当前 profile / 代理 / FB 账号身份的只读概览,放在设置弹窗顶部。
    const cfgInfoHtml = (p) => {
      // p.facebook = { id:邮箱, displayName:备注(格式: "<号ID> · FB密码:x · 2FA:y · 邮箱密码:z · 备用:w") }。
      // 绑定 = p.facebook 存在;真实登录 = 本次会话实际探到的 identity(stateOf.identity)。
      const fb = p.facebook || {};
      const live = stateOf(p.accountIdx).identity;
      const loggedIn = !!(live && (live.username || live.displayName || live.phone));
      const bound = !!(fb.id || fb.username || fb.displayName);
      // 解析备注(displayName)成键值,首段是号 ID。
      const meta = {}; let acctId = '';
      String(fb.displayName || '').split('·').forEach((seg, i) => {
        seg = seg.trim(); if (!seg) return;
        const m = seg.match(/^([^:：]+)[:：]([\s\S]*)$/);
        if (m) meta[m[1].trim()] = m[2].trim(); else if (i === 0) acctId = seg;
      });
      const cr = readCred(p.accountIdx);
      const mono = (v) => v ? `<span class="mono">${esc(v)}</span>` : '<span class="muted">—</span>';
      const badge = loggedIn ? '<span class="ci-b ok">✓ 已登录</span>'
        : (bound ? '<span class="ci-b warn">已绑定 · 未登录</span>' : '<span class="ci-b mut">未绑定</span>');
      // 只列卡片里别处没有的。标题写了 Profile 名和编号;FB 密码 / 2FA / 邮箱 /
      // 邮箱密码 / 备用邮箱下面就是对应的输入框;代理地址有输入框;出口 IP 在
      // 「测 IP」那一行。这些不在这里重复第二遍。
      const rows = [
        ['状态', badge],
        ['FB 账号', mono(fb.id || fb.username)],
        ['分区', mono(`persist:sandbox-${p.accountIdx}`)],
      ];
      const html = rows.map(([k, v]) => k === '__hr__' ? '<hr>' : `<div class="ci-row"><span class="ci-k">${k}</span><span class="ci-v">${v}</span></div>`).join('');
      const btn = (!loggedIn && bound) ? `<div class="ci-row" style="margin-top:10px"><span class="ci-k"></span><span class="ci-v"><button class="fblogin-btn" onclick="__fbLoginClick(${p.accountIdx})">登录（自动填账密 + 提交）</button></span></div>` : '';
      return html + btn;
    };
    // 未登录时点"登录":经 panelAPI.reload 特殊 id 触发主进程 fbLogin(填账密→提交→两步自动 TOTP→reCAPTCHA 停)。
    window.__fbLoginClick = (idx) => {
      try { window.panelAPI.reload('fblogin-' + idx); } catch (e) {}
      flash('#' + idx + ' 已触发登录：填账密 → 提交 → 两步自动 TOTP → 若 reCAPTCHA 需真人点', 7000);
    };
    // 把设置卡片摆到这一格 webview 的位置上(接码 overlay 也是用 .gbody 的矩形)。
    // 格子不在网格里就退回屏幕居中。摆好之后 syncPreview 的重叠判定会正好把这一格让出来。
    function placeCfgOverCell(p) {
      const card = document.querySelector('.modal-card');
      if (!card) return;
      // 最大化时宿主是 #maxbody(整块),否则是这一格的 .gbody。
      const mb = document.getElementById('maxbody');
      const maxOn = typeof maxedIdx !== 'undefined' && maxedIdx != null && mb && !document.getElementById('maxview').hidden;
      const g = p && gcells.get(p.accountIdx);
      const host = maxOn ? mb : (g && g.body && g.body.isConnected ? g.body : null);
      if (!host) {
        card.style.left = ''; card.style.top = ''; card.style.width = ''; card.style.height = '';
        card.style.maxHeight = ''; card.style.margin = 'auto'; card.style.inset = '0';
        return;
      }
      // 在宿主区域里居中,保持卡片自然尺寸 —— 拉伸撑满会把内容顶出去、上下被切掉。
      const r = host.getBoundingClientRect();
      const w = Math.min(380, Math.max(240, r.width - 12));
      const maxH = Math.max(160, r.height - 12);
      card.style.inset = 'auto'; card.style.margin = '0';
      card.style.width = w + 'px';
      card.style.height = 'auto';
      card.style.maxHeight = maxH + 'px';
      card.style.left = Math.round(r.left + (r.width - w) / 2) + 'px';
      const h = Math.min(card.offsetHeight || maxH, maxH);
      card.style.top = Math.round(r.top + (r.height - h) / 2) + 'px';
    }
    function openCfgModal(p) {
      if (!p) return; cfgP = p; delArmed = false;
      document.getElementById('cfg-title').textContent = `${p.name} · #${p.accountIdx} 设置`;
      document.getElementById('cfg-info').innerHTML = cfgInfoHtml(p);
      pullCred(p.accountIdx).then((c) => {
        if (!c || !cfgP || cfgP.accountIdx !== p.accountIdx) return;
        document.getElementById('cfg-info').innerHTML = cfgInfoHtml(p);
        const set = (id, v) => { const e = document.getElementById(id); if (e && !e.value) e.value = v || ''; };
        set('cred-pwd', c.pwd); set('cred-twofa', c.twofa); set('cred-email', c.email);
        set('cred-mailpwd', c.mailpwd); set('cred-second', c.second);
      });
      { const c = readCred(p.accountIdx);
        document.getElementById('cred-pwd').value = c.pwd || '';
        document.getElementById('cred-twofa').value = c.twofa || (p.facebook && p.facebook.twofa) || '';
        document.getElementById('cred-email').value = c.email || (p.facebook && p.facebook.email) || '';
        document.getElementById('cred-mailpwd').value = c.mailpwd || '';
        document.getElementById('cred-second').value = c.second || (p.facebook && p.facebook.secondEmail) || ''; }
      cfgProxy.value = p.proxy || ''; cfgErr.textContent = ''; cfgIp.textContent = cfgIpText(p);
      cfgPhone.value = phoneOf(p); cfgCode.value = codeUrlOf(p);
      cfgDel.textContent = '删除此 Profile'; cfgDel.disabled = false;
      cfgModal.hidden = false;
      placeCfgOverCell(p);
      cfgProxy.focus();
      // 只让被弹窗卡片盖住的格子让位(syncPreview 里按重叠判定 detach),其余 webview 保持不动。
      syncPreview();
    }
    function closeCfgModal() {
      cfgModal.hidden = true; cfgP = null; delArmed = false;
      syncPreview();
    }
    cfgModal.onclick = (e) => { if (e.target === cfgModal) closeCfgModal(); };
    document.getElementById('cfg-x').onclick = closeCfgModal;
    document.getElementById('cfg-save').onclick = async () => {
      if (!cfgP) return; const b = document.getElementById('cfg-save'); b.disabled = true; cfgErr.textContent = '';
      try {
        writeCred(cfgP.accountIdx, {
          pwd: document.getElementById('cred-pwd').value.trim(),
          twofa: document.getElementById('cred-twofa').value.trim(),
          email: document.getElementById('cred-email').value.trim(),
          mailpwd: document.getElementById('cred-mailpwd').value.trim(),
          second: document.getElementById('cred-second').value.trim(),
        });
        document.getElementById('cfg-info').innerHTML = cfgInfoHtml(cfgP);
        const lg = await window.panelAPI.setProfileLogin(cfgP.accountIdx, cfgPhone.value.trim(), cfgCode.value.trim());
        cfgP.login = lg.login; renderPhone(cfgP);
        const u = await window.panelAPI.setProfileProxy(cfgP.accountIdx, cfgProxy.value.trim());
        cfgP.proxy = u.proxy; cfgP.ipInfo = null; renderIp(cfgP);
        if (openedProfiles.has(cfgP.accountIdx)) { reloadProfile(cfgP.accountIdx); flash(`#${cfgP.accountIdx} 代理已应用，重新加载中`); }
        else flash(`#${cfgP.accountIdx} 代理已保存，打开时生效`);
        closeCfgModal();
      } catch (e) { cfgErr.textContent = e.message || String(e); } finally { b.disabled = false; }
    };
    cfgProxy.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('cfg-save').onclick(); if (e.key === 'Escape') closeCfgModal(); };
    document.getElementById('cfg-test').onclick = async () => {
      if (!cfgP) return; const b = document.getElementById('cfg-test'); const o = b.textContent; b.disabled = true; b.textContent = '测 IP…'; cfgErr.textContent = '';
      const r = await probeIp(cfgP);
      b.disabled = false; b.textContent = o;
      if (r.ok) cfgIp.textContent = cfgIpText(cfgP); else cfgErr.textContent = '探测失败：' + r.error;
    };
    cfgDel.onclick = async () => {
      if (!cfgP) return;
      if (!delArmed) { delArmed = true; cfgDel.textContent = '确认删除（不可恢复）'; setTimeout(() => { if (delArmed) { delArmed = false; cfgDel.textContent = '删除此 Profile'; } }, 4000); return; }
      delArmed = false; cfgDel.disabled = true; cfgErr.textContent = '';
      try { await removeProfile(cfgP); closeCfgModal(); }
      catch (e) { cfgErr.textContent = e.message || String(e); cfgDel.disabled = false; cfgDel.textContent = '删除此 Profile'; }
    };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !cfgModal.hidden) closeCfgModal(); });

    new ResizeObserver(() => requestAnimationFrame(syncPreview)).observe(preview);
    window.addEventListener('resize', syncPreview);
    document.addEventListener('visibilitychange', () => { if (document.hidden) { syncPreview(); return; } if (!document.hidden) { syncPreview(); setTimeout(syncPreview, 500); setTimeout(pullStates, 800); } });
    try { window.panelAPI.onCellState(applyCellState); } catch (e) {}
    pullStates({ adopt: true })
      .catch(() => {})
      .then(() => loadProfiles())
      // 打开面板即默认进批量网格:把所有 profile 的 webview 平铺出来。
      // 崩溃循环保护:若上次开机自动批量后没在几秒内清除标记(说明渲染进程崩溃重载了),
      // 这次跳过自动批量、停在列表,避免弱机反复「崩溃→自动批量→再崩」的刷新循环。
      .then(() => {
        try {
          const K = 'fb-matrix-autobatch-pending';
          let prev = null; try { prev = localStorage.getItem(K); } catch (e) {}
          if (prev && (Date.now() - Number(prev)) < 20000) {
            try { localStorage.removeItem(K); } catch (e) {}
            flash('上次疑似导致崩溃,已跳过自动平铺。点「全部重载」可手动平铺。', 6000);
            return;
          }
          try { localStorage.setItem(K, String(Date.now())); } catch (e) {}
          enterBatch();
          setTimeout(() => { try { localStorage.removeItem(K); } catch (e) {} }, 8000);
        } catch (e) {}
      })
      .catch((e) => { flash(e.message || String(e), 8000); render(); });

    // 自动更新:构建时给本页打了内容版本号(<meta name="pv">)。每 60s 拉一次自身
    // (同源 cicyui://panel,无跨域;cicyui handler 每次都从远端取最新),版本变了就 reload。
    // 这样服务端一部署,所有开着的面板自己就切到新版,不用手动逐台重载。DEV 态不轮询。
    (function autoUpdate() {
      const meta = document.querySelector('meta[name="pv"]');
      const PV = meta ? meta.content : '';
      if (!PV || PV === 'DEV') return;
      setInterval(async () => {
        try {
          const r = await fetch(location.href, { cache: 'no-store' });
          if (!r.ok) return;
          const t = await r.text();
          const mm = t.match(/<meta name="pv" content="([^"]*)">/);
          if (mm && mm[1] && mm[1] !== PV) location.reload();
        } catch (e) {}
      }, 60000);
    })();
  </script>
</body>
</html>
