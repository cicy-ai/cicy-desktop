<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>CiCy Desktop</title>
  <style>
    :root {
      --bg: #0c0d10;
      --bg-2: #111317;
      --panel: #14171c;
      --panel-strong: #1a1e25;
      --hairline: rgba(255,255,255,0.06);
      --hairline-strong: rgba(255,255,255,0.10);
      --fg: #ececf0;
      --fg-dim: #a0a4ad;
      --fg-mute: #5b5f69;
      --local: #6c8cff;
      --cloud: #f4b860;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --gray: #6b7280;
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", "Menlo", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    button {
      transition: background 120ms ease, color 120ms ease, filter 120ms ease,
                  border-color 120ms ease, transform 80ms ease, opacity 120ms ease;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:focus { outline: none; }
    button:focus-visible {
      outline: 2px solid var(--local);
      outline-offset: 1px;
    }

    /* svg base */
    svg.icon { display: inline-block; vertical-align: -2px; fill: currentColor; }
    svg.icon.sm { width: 12px; height: 12px; vertical-align: -1px; }
    svg.icon.md { width: 14px; height: 14px; vertical-align: -2px; }
    svg.icon.lg { width: 16px; height: 16px; vertical-align: -3px; }

    /* topbar */
    .topbar {
      -webkit-app-region: drag;
      display: flex; align-items: center;
      padding: 8px 16px 8px 84px;
      height: 38px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--hairline);
      user-select: none;
    }
    .topbar .brand {
      font-weight: 600; font-size: 12px; letter-spacing: 0.3px;
      display: flex; align-items: center; gap: 8px;
    }
    .topbar .brand .mark {
      width: 14px; height: 14px; border-radius: 4px;
      background: linear-gradient(135deg, var(--local), var(--cloud));
    }
    .topbar .spacer { flex: 1; }
    .topbar button {
      -webkit-app-region: no-drag;
      background: transparent; border: 0; color: var(--fg-mute);
      padding: 5px 8px; font: inherit; font-size: 12px;
      border-radius: 4px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .topbar button:hover { color: var(--fg); background: var(--hairline); }

    main {
      flex: 1; padding: 24px 24px 40px;
      max-width: 820px; width: 100%; margin: 0 auto;
    }

    /* section header */
    .section { margin-bottom: 18px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 2px 8px;
    }
    .section-head .label {
      display: flex; align-items: center; gap: 7px;
      font-size: 10px; font-weight: 600; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--fg-mute);
    }
    .section-head.local .label { color: var(--local); }
    .section-head.cloud .label { color: var(--cloud); }
    .section-head .btn-add {
      -webkit-app-region: no-drag;
      background: transparent; border: 0;
      color: var(--fg-mute); padding: 4px 10px; font: inherit; font-size: 11px;
      border-radius: 4px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .section-head.cloud .btn-add:hover { color: var(--cloud); background: rgba(244,184,96,0.06); }
    .section-head.local .btn-add:hover { color: var(--local); background: rgba(108,140,255,0.06); }

    /* list container */
    .list {
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
      position: relative;
      transition: background 120ms ease;
    }
    .row::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: transparent;
      transition: background 120ms ease;
    }
    .row:last-child { border-bottom: 0; }
    .row.local-row:hover::before { background: var(--local); }
    .row.cloud-row:hover::before { background: var(--cloud); }
    .row:hover { background: rgba(255,255,255,0.025); }

    .row .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gray); flex-shrink: 0;
    }
    .row .dot.s-up   { background: var(--green); }
    .row .dot.s-warn { background: var(--yellow); }
    .row .dot.s-down { background: var(--red); }

    .row .plat {
      width: 16px; height: 16px; flex-shrink: 0;
      color: var(--fg-mute);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .row .plat svg { width: 14px; height: 14px; fill: currentColor; }
    .row.cloud-row .plat { color: var(--cloud); }
    .row.local-row .plat { color: var(--local); }

    .row .name {
      font-size: 13px; font-weight: 500; color: var(--fg);
      flex: 0 0 auto; min-width: 0; max-width: 230px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .url {
      flex: 1; min-width: 0;
      font-family: var(--mono); font-size: 11px; color: var(--fg-mute);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .meta {
      font-family: var(--mono); font-size: 10px; color: var(--fg-mute);
      flex-shrink: 0;
    }
    .row .status {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-family: var(--mono);
      flex-shrink: 0; min-width: 95px; justify-content: flex-end;
    }
    .row .status svg { width: 11px; height: 11px; fill: currentColor; }
    .row .status.up { color: var(--green); }
    .row .status.warn { color: var(--yellow); }
    .row .status.down { color: var(--red); }

    .row .acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; margin-left: 4px; }
    .row .acts button {
      -webkit-app-region: no-drag;
      background: transparent; color: var(--fg-mute);
      border: 0; padding: 4px 9px; border-radius: 4px;
      font: inherit; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .row .acts button:hover { background: var(--hairline-strong); color: var(--fg); }
    /* Make the primary "Open" action stand out from the row of icon buttons. */
    .row .acts button.open {
      background: var(--hairline-strong);
      color: var(--fg);
      font-weight: 500;
      padding: 0 14px;
      height: 26px;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .row .acts button.open.local {
      background: var(--local);
      color: #fff;
    }
    .row .acts button.open.cloud {
      background: var(--cloud);
      color: #1a1a1a;
    }
    .row .acts button.open.local:hover { filter: brightness(1.12); color: #fff; }
    .row .acts button.open.cloud:hover { filter: brightness(1.08); color: #1a1a1a; }
    .row .acts button.open:disabled,
    .row .acts button.open:disabled:hover {
      background: var(--hairline-strong);
      color: var(--fg-mute);
      cursor: not-allowed;
      filter: none;
    }
    .row .acts button.open.loading {
      cursor: wait;
      pointer-events: none;
    }
    .row .acts button.open.loading::before {
      content: "";
      display: inline-block;
      width: 10px; height: 10px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 4px;
      vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row .acts .more-wrap { position: relative; display: inline-flex; align-items: center; }
    .row .acts .btn-more {
      background: var(--hairline-strong); color: var(--fg-dim);
      display: inline-flex; align-items: center; justify-content: center;
      height: 26px; width: 26px; padding: 0;
      position: relative;
    }
    .row .acts .btn-more:hover { color: var(--fg); }
    .row .acts .btn-more.active { background: var(--local); color: #fff; }
    .row .acts .btn-more.has-update::after {
      content: "";
      position: absolute; top: 4px; right: 4px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--cloud);
      box-shadow: 0 0 0 2px var(--panel);
    }
    .row .acts .more-menu {
      position: fixed; z-index: 999;
      background: var(--panel-strong); border: 1px solid var(--hairline-strong);
      border-radius: 6px; padding: 4px 0; min-width: 130px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
      transform-origin: top right;
      animation: menu-in 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .row .acts .more-menu[hidden] { display: none; }
    @keyframes menu-in {
      from { opacity: 0; transform: scale(0.92) translateY(-4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .row .acts .more-item {
      padding: 8px 14px; font-size: 12px; color: var(--fg); cursor: pointer;
      -webkit-app-region: no-drag;
      display: flex; align-items: center; gap: 8px;
      transition: background 80ms ease;
    }
    .row .acts .more-item:hover { background: var(--hairline-strong); }
    .row .acts .more-item .icon { color: var(--fg-dim); }
    .row .acts .more-item:hover .icon { color: var(--fg); }
    .row .acts .more-divider {
      height: 1px; background: var(--hairline); margin: 3px 0;
    }
    .row .acts button.del:hover { color: var(--red); }
    .row .acts button.icon-only { padding: 4px 6px; }

    .empty {
      padding: 14px; color: var(--fg-mute); font-size: 12px;
      font-style: italic; text-align: center;
    }

    /* add form */
    .add-form {
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 8px;
      display: none;
    }
    .add-form.open { display: block; }
    .add-form .grid {
      display: grid; grid-template-columns: 60px 1fr;
      gap: 8px 12px; align-items: center;
    }
    .add-form label { font-size: 11px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: 0.4px; }
    .add-form input {
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--hairline-strong);
      border-radius: 5px;
      padding: 6px 9px;
      font: inherit; font-size: 12px;
    }
    .add-form input:focus { outline: none; border-color: var(--cloud); }
    .add-form .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .add-form .status-text { font-size: 11px; color: var(--fg-mute); }
    .add-form .status-text.ok { color: var(--green); }
    .add-form .status-text.err { color: var(--red); }
    .add-form .btns { display: flex; gap: 6px; }
    .add-form button {
      -webkit-app-region: no-drag;
      background: transparent; color: var(--fg-dim);
      border: 1px solid var(--hairline-strong);
      padding: 5px 12px; border-radius: 4px;
      font: inherit; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .add-form button.submit { background: var(--cloud); color: #1a1410; border-color: var(--cloud); font-weight: 500; }
    .add-form button.submit:hover { filter: brightness(1.08); }

    /* update banner */
    .update-banner {
      margin: 10px 2px 0;
      padding: 8px 12px;
      background: rgba(250,204,21,0.06); border: 1px solid rgba(250,204,21,0.20);
      border-radius: 6px;
      font-size: 12px; color: var(--yellow);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .update-banner button {
      -webkit-app-region: no-drag;
      background: transparent; color: var(--yellow);
      border: 1px solid rgba(250,204,21,0.30);
      padding: 3px 10px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 11px;
      display: inline-flex; align-items: center; gap: 5px;
    }

    /* sidecar (cicy-code) install / update card */
    .sidecar-card {
      margin: 10px 2px 0;
      padding: 12px 14px;
      background: var(--panel-strong);
      border: 1px solid var(--hairline-strong);
      border-radius: 8px;
      animation: card-in 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .sidecar-card .row1 {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .sidecar-card .ico {
      width: 28px; height: 28px; border-radius: 6px;
      background: rgba(108,140,255,0.10);
      color: var(--local);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .sidecar-card .ico svg { width: 16px; height: 16px; fill: currentColor; }
    .sidecar-card .ttl {
      flex: 1; min-width: 0;
    }
    .sidecar-card .ttl .t1 { color: var(--fg); font-size: 13px; font-weight: 500; }
    .sidecar-card .ttl .t2 { color: var(--fg-dim); font-size: 11px; margin-top: 2px; font-family: var(--mono); }
    .sidecar-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .sidecar-card .actions button {
      -webkit-app-region: no-drag;
      background: var(--local); color: #fff;
      border: 0; padding: 6px 16px; border-radius: 5px;
      font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .sidecar-card .actions button:hover { filter: brightness(1.12); }
    .sidecar-card .actions button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
    .sidecar-card .actions button.ghost {
      background: transparent; color: var(--fg-dim);
      border: 1px solid var(--hairline-strong);
      padding: 5px 14px;
    }
    .sidecar-card .actions button.ghost:hover { color: var(--fg); border-color: var(--fg-dim); background: var(--hairline); }
    .sidecar-card.error .actions button { background: var(--red); }
    .sidecar-card.success .actions button { background: var(--green); color: #0c0d10; }

    .sidecar-card .progress { margin-top: 4px; }
    .sidecar-card .progress .stage {
      display: flex; align-items: center; justify-content: space-between;
      color: var(--fg-dim); font-size: 11px; margin-bottom: 5px;
    }
    .sidecar-card .progress .stage .pct { color: var(--fg); font-family: var(--mono); }
    .sidecar-card .bar {
      height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden;
      position: relative;
    }
    .sidecar-card .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--local), var(--cloud));
      width: 0%;
      transition: width 0.18s ease;
    }
    .sidecar-card.indeterminate .bar-fill {
      width: 30% !important;
      animation: sc-slide 1.2s linear infinite;
    }
    .sidecar-card.error .ico { background: rgba(248,113,113,0.10); color: var(--red); }
    .sidecar-card.error .ttl .t1 { color: var(--red); }
    .sidecar-card.success .ico { background: rgba(74,222,128,0.10); color: var(--green); }
    .sidecar-card.success .ttl .t1 { color: var(--green); }
    .sidecar-card.error .bar-fill, .sidecar-card.success .bar-fill {
      background: currentColor;
    }
    @keyframes sc-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--panel-strong); border: 1px solid var(--hairline-strong);
      padding: 8px 16px; border-radius: 6px;
      color: var(--fg); font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0; transition: opacity 160ms;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.err { border-color: rgba(248,113,113,0.4); color: var(--red); }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span> CiCy Desktop</div>
  <div class="spacer"></div>
  <button id="btn-refresh" title="Refresh"><svg class="icon md"><use href="#i-refresh"/></svg></button>
</header>

<main>
  <!-- Local first (you live here every day) -->
  <section class="section">
    <div class="section-head local">
      <div class="label">
        <svg class="icon md"><use href="#i-laptop"/></svg> Local
      </div>
    </div>
    <div id="local-list"></div>
    <div id="update-banner-slot"></div>
    <div id="sidecar-card-slot"></div>
  </section>

  <section class="section">
    <div class="section-head cloud">
      <div class="label">
        <svg class="icon md"><use href="#i-cloud"/></svg> Cloud
      </div>
      <button class="btn-add" id="btn-toggle-add">
        <svg class="icon sm"><use href="#i-add"/></svg> Add
      </button>
    </div>
    <div class="add-form" id="add-form">
      <div class="grid">
        <label>Name</label><input id="f-name" placeholder="e.g. Staging" />
        <label>URL</label><input id="f-url" placeholder="https://cicy.example.com:8008" />
        <label>Token</label><input id="f-token" placeholder="(optional bearer)" />
      </div>
      <div class="footer">
        <span class="status-text" id="f-status"></span>
        <div class="btns">
          <button id="f-cancel" type="button">Cancel</button>
          <button class="submit" id="f-submit" type="button">
            <svg class="icon sm"><use href="#i-add"/></svg> Add
          </button>
        </div>
      </div>
    </div>
    <div id="cloud-list"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  const $local = document.getElementById("local-list");
  const $cloud = document.getElementById("cloud-list");
  const $addForm = document.getElementById("add-form");
  const $fStatus = document.getElementById("f-status");
  const $toast = document.getElementById("toast");
  const $banner = document.getElementById("update-banner-slot");
  const $sidecarCard = document.getElementById("sidecar-card-slot");

  // ---- sidecar (cicy-code) install / update card ----
  // State machine:
  //   "checking"   — querying GitHub release
  //   "missing"    — not installed, "Install" button
  //   "outdated"   — installed but newer available, "Update" button
  //   "uptodate"   — installed and current
  //   "installing" — install in progress, progress bar + Cancel
  //   "error"      — transient error, "Retry" button
  const sidecarUI = {
    state: "checking",
    info: null,
    progress: null,
    error: null,
    tunnelLimit: 0,   // zero-trust tunnel tier cap: 0 = free (hide 开启隧道), >0 = paid
    gwEnabled: false, // whether a tunnel is currently on for this machine

    async refresh() {
      this.state = "checking";
      this.render();
      try {
        const status = await window.cicy.sidecar.status();
        if (status.userInstalled) {
          // Already installed — show as up-to-date without hitting GitHub.
          this.state = "uptodate";
          this.info = { installedVersion: status.userVersion };
        } else {
          // Not installed — need to hit GitHub to show what's available.
          const check = await window.cicy.sidecar.checkLatest();
          if (!check.ok) { this.state = "error"; this.error = check.error; }
          else { this.state = "missing"; this.info = check; }
        }
      } catch (e) {
        this.state = "error";
        this.error = e.message;
      }
      this.render();
    },

    fmtBytes(n) {
      if (n == null) return "?";
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / 1048576).toFixed(1) + " MB";
    },

    render() {
      // Cases that need a card:
      //   missing    — not installed, big install card
      //   installing — show progress
      //   error      — show retry
      //   done       — brief success indicator
      // outdated/uptodate/checking don't render a card; the row's "更多" menu
      // surfaces "更新到 vX" when outdated. Avoid noisy banners during normal use.
      if (this.state === "outdated" || this.state === "uptodate" || this.state === "checking") {
        $sidecarCard.innerHTML = "";
        if (typeof refreshLocalRows === "function") refreshLocalRows();
        return;
      }
      // For installing state, do an in-place update rather than re-creating the
      // DOM each progress tick (which caused the bar to flicker).
      if (this.state === "installing" && this._mounted === "installing") {
        this.updateProgress();
        return;
      }

      let modifier = "";
      let title = "";
      let subtitle = "";
      let actions = "";

      if (this.state === "missing") {
        title = "需要安装 cicy-code";
        subtitle = `最新版本 v${this.info.latest} · ${this.info.network === "cn" ? "国内镜像" : "GitHub 直连"}`;
        actions = `<button data-sc="install">安装</button>`;
      } else if (this.state === "installing") {
        const p = this.progress || {};
        title = p.message || "安装中";
        subtitle = "";
        actions = `<button class="ghost" data-sc="cancel">取消</button>`;
      } else if (this.state === "error") {
        modifier = "error";
        title = "操作失败";
        subtitle = this.error || "unknown";
        actions = `<button data-sc="install">重试</button>`;
      } else if (this.state === "done") {
        modifier = "success";
        title = `已安装 v${this.info && this.info.latest || "?"}`;
        subtitle = "";
      }

      const showProgress = this.state === "installing";
      $sidecarCard.innerHTML = `
        <div class="sidecar-card ${modifier}">
          <div class="row1">
            <div class="ico">${iconUse("i-laptop","sm")}</div>
            <div class="ttl">
              <div class="t1" data-sc-title>${esc(title)}</div>
              <div class="t2" data-sc-subtitle>${esc(subtitle)}</div>
            </div>
            <div class="actions">${actions}</div>
          </div>
          ${showProgress ? `
            <div class="progress">
              <div class="stage">
                <span data-sc-stage></span>
                <span class="pct" data-sc-pct></span>
              </div>
              <div class="bar"><div class="bar-fill" data-sc-bar></div></div>
            </div>` : ""}
        </div>
      `;
      this._mounted = this.state;
      $sidecarCard.querySelectorAll("[data-sc]").forEach(btn => {
        btn.onclick = () => this.action(btn.getAttribute("data-sc"));
      });
      if (showProgress) this.updateProgress();
      if (typeof refreshLocalRows === "function") refreshLocalRows();
    },

    // In-place update of installing-card fields. No innerHTML churn → no
    // flicker on the progress bar.
    updateProgress() {
      const p = this.progress || {};
      const card = $sidecarCard.querySelector(".sidecar-card");
      if (!card) return;
      const $title = card.querySelector("[data-sc-title]");
      const $sub   = card.querySelector("[data-sc-subtitle]");
      const $stage = card.querySelector("[data-sc-stage]");
      const $pct   = card.querySelector("[data-sc-pct]");
      const $bar   = card.querySelector("[data-sc-bar]");
      const ver = p.version ? `v${p.version}` : "";
      const sub = (p.phase === "downloading" && p.total)
        ? `${this.fmtBytes(p.received)} / ${this.fmtBytes(p.total)} · ${ver}`
        : ver;
      const pct = (typeof p.progress === "number") ? Math.round(p.progress * 100) : null;
      if ($title) $title.textContent = p.message || "安装中";
      if ($sub)   $sub.textContent   = sub;
      if ($stage) $stage.textContent = p.phase || "";
      if ($pct)   $pct.textContent   = pct == null ? "" : pct + "%";
      if ($bar) {
        if (pct == null) {
          card.classList.add("indeterminate");
          $bar.style.width = "";
        } else {
          card.classList.remove("indeterminate");
          $bar.style.width = pct + "%";
        }
      }
    },

    async action(act) {
      if (act === "cancel") {
        await window.cicy.sidecar.cancel();
        return;
      }
      if (act === "install") {
        this.state = "installing";
        this.progress = { phase: "init", message: "正在准备…" };
        this.render();
        try {
          const r = await window.cicy.sidecar.install();
          if (!r.ok) {
            this.state = "error";
            this.error = r.error || "unknown";
          } else {
            this.state = "done";
            this.info = { latest: r.version };
          }
        } catch (e) {
          this.state = "error";
          this.error = e.message;
        }
        this.render();
        await refreshHealth();
        // Auto-hide success state after a few seconds.
        if (this.state === "done") {
          setTimeout(() => this.refresh(), 3500);
        }
      }
    },

    onProgress(p) {
      // While installing, take live progress updates.
      if (this.state === "installing") {
        this.progress = p;
        if (p.phase === "error") {
          this.state = "error";
          this.error = p.error || p.message;
        } else if (p.phase === "cancelled") {
          this.state = "checking";
          this.progress = null;
          this.refresh();
          return;
        }
        this.render();
      }
    },
  };

  window.cicy.sidecar.onProgress((p) => sidecarUI.onProgress(p));

  const HOST_PLATFORM = (window.cicy && window.cicy.platform) || "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
  function dur(sec) { if (!sec || sec<0) return "—"; const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60); if(d) return `${d}d`; if(h) return `${h}h${m}m`; if(m) return `${m}m`; return `${sec}s`; }

  function platformIconId(plat) {
    if (!plat) return "i-laptop";
    const p = plat.toLowerCase();
    if (p === "darwin" || p === "mac" || p === "macos") return "i-mac";
    if (p === "win" || p === "win32" || p === "windows") return "i-win";
    if (p === "linux") return "i-linux";
    return "i-laptop";
  }
  function iconUse(id, cls = "md") { return `<svg class="icon ${cls}"><use href="#${id}"/></svg>`; }

  function dotClass(health) {
    if (!health) return "";
    if (health.ok && health.status === "ok") return "s-up";
    if (health.ok) return "s-warn";
    return "s-down";
  }
  function statusInfo(health) {
    if (!health) return { cls: "", txt: "—", icon: "" };
    if (health.ok && health.status === "ok") return { cls: "up", txt: "healthy", icon: "i-check" };
    if (health.ok) return { cls: "warn", txt: "degraded", icon: "i-warn" };
    return { cls: "down", txt: "unreachable", icon: "i-x" };
  }

  function showToast(msg, isErr = false) {
    $toast.textContent = msg;
    $toast.className = "toast show" + (isErr ? " err" : "");
    setTimeout(() => { $toast.className = "toast"; }, 2200);
  }

  let healthByBackend = {};
  let updateInfo = null;

  function renderLocal(backend) {
    const h = healthByBackend[backend.id] || null;
    const dot = dotClass(h);
    const st = statusInfo(h);
    const verTxt = h && h.version ? `v${esc(h.version)}` : "";
    const upTxt = h && h.uptime_sec != null ? dur(h.uptime_sec) : "";
    const meta = [verTxt, upTxt].filter(Boolean).join(" · ");
    const portTxt = backend.port || "8008";
    const platId = platformIconId(HOST_PLATFORM);
    // Local Open is only meaningful when the sidecar is up. Disable when:
    //   - sidecar is being installed/upgraded (cicy-code is being replaced)
    //   - sidecar is missing (cicy-code never installed)
    //   - health is down (sidecar crashed)
    const sState = sidecarUI.state;
    // Only hide the row when the sidecar isn't installed at all. During
    // checking/installing/error we keep the row visible so the user retains
    // context (cicy-code is still running on :8008 in those cases).
    if (sState === "missing") return "";
    let openDisabled = false;
    let disabledReason = "";
    if (sState === "installing") { openDisabled = true; disabledReason = "更新中…"; }
    else if (h && h.ok === false) { openDisabled = true; disabledReason = "cicy-code 未运行"; }

    const updateAvailable = sState === "outdated" && sidecarUI.info && sidecarUI.info.latest;
    const updateMenuItem = updateAvailable
      ? `<div class="more-item" data-act="update">
           ${iconUse("i-refresh","sm")} 更新到 v${esc(sidecarUI.info.latest)}
         </div>
         <div class="more-divider"></div>`
      : "";

    return `
      <div class="row local-row" data-backend="${esc(backend.id)}">
        <span class="dot ${dot}"></span>
        <span class="plat" title="${esc(HOST_PLATFORM)}">${iconUse(platId, "md")}</span>
        <div class="name">${esc(backend.name)}</div>
        <div class="url">127.0.0.1:${esc(String(portTxt))}</div>
        <div class="meta">${esc(meta)}</div>
        <div class="status ${st.cls}">${st.icon ? iconUse(st.icon, "sm") : ""} ${esc(st.txt)}</div>
        <div class="acts">
          <div class="more-wrap">
            <button class="btn-more icon-only ${updateAvailable ? "has-update" : ""}" data-act="more" title="更多">
              <svg class="icon sm" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </button>
            <div class="more-menu" hidden>
              ${updateMenuItem}
              <div class="more-item" data-act="restart">
                ${iconUse("i-restart","sm")} 重启
              </div>
              <div class="more-item" data-act="check-update">
                ${iconUse("i-refresh","sm")} 检查更新
              </div>
            </div>
          </div>
          <button class="open local" data-act="open" ${openDisabled ? `disabled title="${esc(disabledReason)}"` : ""}>${iconUse("i-open","sm")} Open</button>
        </div>
      </div>
    `;
  }

  function renderCloud(backend) {
    const h = healthByBackend[backend.id] || null;
    const dot = dotClass(h);
    const st = statusInfo(h);
    const verTxt = h && h.version ? `v${esc(h.version)}` : "";
    const latencyTxt = h && h.latencyMs != null ? `${h.latencyMs}ms` : "";
    const meta = [verTxt, latencyTxt].filter(Boolean).join(" · ");
    const url = backend.url || backend.resolvedUrl || "";
    // Remote platform isn't reliably reported; show the cloud glyph.
    const platId = "i-cloud";

    return `
      <div class="row cloud-row" data-backend="${esc(backend.id)}">
        <span class="dot ${dot}"></span>
        <span class="plat" title="cloud">${iconUse(platId, "md")}</span>
        <div class="name">${esc(backend.name)}</div>
        <div class="url">${esc(url)}</div>
        <div class="meta">${esc(meta)}</div>
        <div class="status ${st.cls}">${st.icon ? iconUse(st.icon, "sm") : ""} ${esc(st.txt)}</div>
        <div class="acts">
          <button class="open cloud" data-act="open">${iconUse("i-open","sm")} Open</button>
          <button class="del icon-only" data-act="remove" title="Remove">${iconUse("i-trash","sm")}</button>
        </div>
      </div>
    `;
  }

  function renderList(rows) {
    return rows.length
      ? `<div class="list">${rows.join("")}</div>`
      : `<div class="list"><div class="empty">No backend.</div></div>`;
  }

  function renderUpdateBanner() {
    if (!updateInfo || !updateInfo.hasUpdate) return "";
    return `<div class="update-banner">
      <span>${iconUse("i-warn","sm")} Update available · v${esc(updateInfo.latestVersion)} (you have v${esc(updateInfo.currentVersion || "?")})</span>
      <button id="banner-open-update">${iconUse("i-open","sm")} Open release</button>
    </div>`;
  }

  async function refreshBackends() {
    const list = await window.cicy.backends.list();
    lastBackendList = list;
    const local = list.filter(b => b.kind === "local");
    const cloud = list.filter(b => b.kind !== "local");
    $local.innerHTML = renderList(local.map(renderLocal));
    $cloud.innerHTML = renderList(cloud.map(renderCloud));
    $banner.innerHTML = renderUpdateBanner();
    wireAll(list);
    await refreshHealth(list);
  }

  // Re-render only the local rows (cheap; no list fetch). Used by sidecarUI
  // when its state changes so the Open button reflects sidecar availability.
  let lastBackendList = [];
  function refreshLocalRows() {
    if (!lastBackendList.length) return;
    const local = lastBackendList.filter(b => b.kind === "local");
    $local.innerHTML = renderList(local.map(renderLocal));
    wireAll(lastBackendList);
  }

  async function refreshHealth(list) {
    try {
      const results = await window.cicy.backends.healthAll();
      // Skip updating local backend health when sidecar is not ready —
      // probing it would only produce "Unreachable" noise.
      const sState = sidecarUI.state;
      const skipLocal = sState === "missing" || sState === "installing" || sState === "checking";
      results.forEach(r => {
        if (skipLocal && r.id === "local") return;
        healthByBackend[r.id] = r.health;
      });
    } catch (e) {}
    if (!list) list = await window.cicy.backends.list();
    lastBackendList = list;
    const local = list.filter(b => b.kind === "local");
    const cloud = list.filter(b => b.kind !== "local");
    $local.innerHTML = renderList(local.map(renderLocal));
    $cloud.innerHTML = renderList(cloud.map(renderCloud));
    $banner.innerHTML = renderUpdateBanner();
    wireAll(list);
  }

  function wireAll(list) {
    document.querySelectorAll(".row[data-backend]").forEach(row => {
      const id = row.getAttribute("data-backend");
      const backend = list.find(b => b.id === id);
      if (!backend) return;
      // Row click no longer opens — use the Open button.
      row.querySelectorAll("[data-act]").forEach(btn => {
        const act = btn.getAttribute("data-act");
        if (act === "more") {
          btn.onclick = (e) => {
            e.stopPropagation();
            const menu = btn.closest(".more-wrap").querySelector(".more-menu");
            const isOpen = !menu.hidden;
            // Reset all states.
            document.querySelectorAll(".more-menu").forEach(m => { m.hidden = true; });
            document.querySelectorAll(".btn-more").forEach(b => b.classList.remove("active"));
            if (!isOpen) {
              const r = btn.getBoundingClientRect();
              menu.style.top  = (r.bottom + 4) + "px";
              menu.style.left = (r.right - 130) + "px"; // min-width 130
              menu.hidden = false;
              btn.classList.add("active");
              // After paint, lock to actual width for crisp alignment.
              requestAnimationFrame(() => {
                menu.style.left = (r.right - menu.offsetWidth) + "px";
              });
            }
          };
        } else if (act === "restart") {
          btn.onclick = async (e) => {
            e.stopPropagation();
            btn.closest(".more-menu").hidden = true;
            showToast("Restarting…");
            const r = await window.cicy.backends.restartSidecar();
            if (r && r.ok) showToast(`Restarted (pid ${r.pid})`);
            else showToast(`Restart failed: ${r && r.error || "unknown"}`, true);
          };
        } else if (act === "check-update") {
          btn.onclick = async (e) => {
            e.stopPropagation();
            btn.closest(".more-menu").hidden = true;
            document.querySelectorAll(".btn-more").forEach(b => b.classList.remove("active"));
            showToast("正在检查更新…");
            const check = await window.cicy.sidecar.checkLatest();
            if (!check.ok) {
              showToast(`检查失败: ${check.error || "unknown"}`, true);
              return;
            }
            if (check.installedVersion === check.latest) {
              sidecarUI.state = "uptodate";
              sidecarUI.info = check;
              showToast(`已是最新版本 v${check.latest}`);
            } else {
              sidecarUI.state = "outdated";
              sidecarUI.info = check;
              showToast(`发现新版本 v${check.latest}`);
            }
            // Re-render local rows so the more menu reflects the new state.
            if (typeof refreshLocalRows === "function") refreshLocalRows();
          };
        } else if (act === "update") {
          btn.onclick = (e) => {
            e.stopPropagation();
            btn.closest(".more-menu").hidden = true;
            document.querySelectorAll(".btn-more").forEach(b => b.classList.remove("active"));
            sidecarUI.action("install");
          };
        } else {
          btn.onclick = async (e) => {
            e.stopPropagation();
            // Visual feedback for slow actions like Open (window may take a moment).
            if (act === "open") {
              btn.classList.add("loading");
              btn.disabled = true;
            }
            try {
              await handleAction(act, backend);
            } finally {
              if (act === "open") {
                btn.classList.remove("loading");
                btn.disabled = false;
              }
            }
          };
        }
      });
    });
    // Close menus when clicking outside.
    document.addEventListener("click", () => {
      document.querySelectorAll(".more-menu").forEach(m => { m.hidden = true; });
      document.querySelectorAll(".btn-more").forEach(b => b.classList.remove("active"));
    }, { once: false, capture: true });
    const upBtn = document.getElementById("banner-open-update");
    if (upBtn && updateInfo && updateInfo.releaseUrl) {
      upBtn.onclick = () => window.cicy.updates.openReleasePage(updateInfo.releaseUrl);
    }
  }

  async function handleAction(act, backend) {
    switch (act) {
      case "open": {
        const url = backend.resolvedUrl || backend.url;
        if (window.electronRPC && url) {
          try {
            // 1. find an existing window matching this backend's URL origin
            const winsRes = await window.electronRPC("get_windows", {});
            let wins = [];
            try {
              const txt = (winsRes.content || []).map(c => c.text).join("");
              wins = JSON.parse(txt);
            } catch {}
            const targetOrigin = new URL(url).origin;
            const existing = (Array.isArray(wins) ? wins : []).find(w => {
              try { return w.url && new URL(w.url).origin === targetOrigin; } catch { return false; }
            });
            if (existing) {
              await window.electronRPC("control_electron_BrowserWindow", {
                win_id: existing.id,
                code: "(win.isMinimized() && win.restore(), win.show(), win.focus(), 'focused')",
              });
              showToast(`Focused ${backend.name}`);
              break;
            }
            // 2. no existing window — open a new one
            await window.electronRPC("open_window", { url, reuseWindow: false });
            showToast(`Opened ${backend.name}`);
            break;
          } catch (e) {
            console.error("[open] electronRPC failed:", e);
          }
        }
        const r = await window.cicy.backends.open(backend.id);
        if (r && r.ok) showToast(`Opened ${backend.name}`);
        else showToast(`Open failed: ${r && r.error || "unknown"}`, true);
        break;
      }
      case "remove": {
        if (!confirm(`Remove ${backend.name}?`)) return;
        await window.cicy.backends.remove(backend.id);
        await refreshBackends();
        showToast(`Removed ${backend.name}`);
        break;
      }
    }
  }

  document.getElementById("btn-toggle-add").onclick = () => {
    $addForm.classList.toggle("open");
    if ($addForm.classList.contains("open")) document.getElementById("f-name").focus();
  };
  document.getElementById("f-cancel").onclick = () => {
    $addForm.classList.remove("open");
    $fStatus.className = "status-text"; $fStatus.textContent = "";
  };
  document.getElementById("f-submit").onclick = async () => {
    const name = document.getElementById("f-name").value.trim();
    const url = document.getElementById("f-url").value.trim();
    const token = document.getElementById("f-token").value.trim() || undefined;
    if (!url) { $fStatus.className = "status-text err"; $fStatus.textContent = "URL required"; return; }
    $fStatus.className = "status-text"; $fStatus.textContent = "Probing…";
    try {
      const probe = await window.cicy.backends.probe({ url, token });
      if (probe && probe.ok) { $fStatus.className = "status-text ok"; $fStatus.textContent = `Probe OK (${probe.statusCode})`; }
      else { $fStatus.className = "status-text err"; $fStatus.textContent = `Probe ${probe && probe.error || probe && probe.statusCode || "failed"} (saved anyway)`; }
      await window.cicy.backends.add({ name, url, token });
      document.getElementById("f-name").value = "";
      document.getElementById("f-url").value = "";
      document.getElementById("f-token").value = "";
      $addForm.classList.remove("open");
      await refreshBackends();
      showToast(`Added ${name || url}`);
    } catch (e) { $fStatus.className = "status-text err"; $fStatus.textContent = `Error: ${e.message}`; }
  };

  document.getElementById("btn-refresh").onclick = () => refreshBackends();

  // local IPs (unchanged: feeds frp-server install drawer)
  async function probeLocalIPs() {
    const platform = (window.cicy && window.cicy.platform) || "";
    let cmd;
    if (platform === "win32") {
      cmd = `powershell -NoProfile -Command "Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.IPAddress -notmatch '^(127|169\\.254)'} | Select-Object -ExpandProperty IPAddress"`;
    } else if (platform === "darwin") {
      cmd = `ifconfig | awk '/inet / && $2 !~ /^127/ {print $2}'`;
    } else {
      cmd = `hostname -I 2>/dev/null | tr ' ' '\\n' | grep -v '^$' | grep -v '^127'`;
    }
    if (!window.electronRPC) return [];
    try {
      const res = await window.electronRPC("exec_shell", { command: cmd });
      const raw = ((res && res.content) || []).map(c => c.text).filter(Boolean).join("\n");
      let stdout = raw;
      try { const inner = JSON.parse(raw); if (inner && typeof inner.stdout === "string") stdout = inner.stdout; } catch {}
      return stdout
        .split(/\r?\n/)
        .map(s => s.trim())
        .filter(s => /^\d+\.\d+\.\d+\.\d+$/.test(s) && !s.startsWith("127.") && !s.startsWith("169.254."));
    } catch { return []; }
  }
  async function refreshLocalIPs() {
    const ips = await probeLocalIPs();
    const payload = { ips, primary: ips[0] || null, at: Date.now() };
    try { localStorage.setItem("cicy.localIPs", JSON.stringify(payload)); } catch {}
    if (window.dispatchEvent && window.CustomEvent) {
      window.dispatchEvent(new CustomEvent("cicy:local-ips", { detail: payload }));
    }
    return payload;
  }

  (async () => {
    try { updateInfo = await window.cicy.updates.check(); refreshHealth(); } catch {}
  })();

  refreshBackends();
  refreshLocalIPs();
  sidecarUI.refresh();

  async function autoOpenLastUsed() {
    try {
      if (history.length > 1) return;
      if (sessionStorage.getItem("cicy-auto-opened")) return;
      const params = new URLSearchParams(location.search);
      if (params.get("stay") === "1") return;
      sessionStorage.setItem("cicy-auto-opened", "1");
      const list = await window.cicy.backends.list();
      const ranked = list
        .filter(b => b.lastUsedAt)
        .sort((a, b) => new Date(b.lastUsedAt) - new Date(a.lastUsedAt));
      if (!ranked.length) return;
      await new Promise(r => setTimeout(r, 150));
      await window.cicy.backends.open(ranked[0].id);
    } catch (e) { console.warn("[auto-open]", e); }
  }
  autoOpenLastUsed();
  setInterval(() => refreshHealth(), 30000);
  setInterval(refreshLocalIPs, 60000);
</script>
